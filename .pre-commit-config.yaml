# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Scan for hardcoded secrets

  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args: ["--no-progress", "--include-fragments"]
        files: '^box/kb/.*\.md$'

  # Helm
  - repo: local
    hooks:
      - id: helm-docs
        name: helm-docs
        entry: make -C box/charts docs
        language: system
        files: 'box/.*\.(yaml|tpl|gotmpl)$'
        pass_filenames: false

  # Docs
  - repo: local
    hooks:
      - id: resume-pdf
        name: resume-pdf
        entry: make -C docs/resume pdf
        language: system
        files: '^docs/resume/resume\.html$'
        pass_filenames: false
      - id: kb-lint
        name: kb-lint
        entry: scripts/kb-lint.sh
        language: script
        files: '^box/kb/.*\.md$'
        pass_filenames: false

  # Dotfiles (tether)
  - repo: local
    hooks:
      - id: backup-brewfile
        name: Backup Brewfile (daily)
        entry: bash
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        description: |-
          This hook backs up Brewfile once per day.
          It compares the last backup date with the current date.
        args:
          - "-c"
          - |
            set -euo pipefail

            BREWFILE="box/addons/tether/configs/package-managers/brew/Brewfile"
            TIMESTAMP_FILE="box/addons/tether/.brewfile-last-backup"
            TODAY=$(date +%Y-%m-%d)

            if [[ -f "$TIMESTAMP_FILE" ]]; then
              LAST_BACKUP=$(cat "$TIMESTAMP_FILE")
            else
              LAST_BACKUP=""
            fi

            if [[ "$LAST_BACKUP" == "$TODAY" ]]; then
              echo "✅ Brewfile already backed up today, skipping"
              exit 0
            fi

            if ! command -v brew &> /dev/null; then
              echo "⚠️  brew command not found, skipping Brewfile backup"
              exit 0
            fi

            echo "🔄 Backing up Brewfile (last backup: ${LAST_BACKUP:-never})"

            brew bundle dump --force --file="$BREWFILE"

            {
              echo "#-------------------------------"
              echo "# PACKAGE INSTALLATION SUMMARY"
              echo "# Date: $TODAY"
              echo "#-------------------------------"
              for SECTION in tap brew cask mas vscode; do
                COUNT=$(grep -c "^$SECTION " "$BREWFILE" || true)
                echo "# Installed $SECTION count: $COUNT"
              done
              echo "#-------------------------------"
            } >> "$BREWFILE"

            echo "$TODAY" > "$TIMESTAMP_FILE"
            git add "$BREWFILE"

            echo "✅ Brewfile backup completed"

  # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: scripts/cargo-changed.sh fmt
        language: script
        files: '\.rs$|Cargo\.(toml|lock)$'
      - id: cargo-clippy
        name: cargo clippy
        entry: scripts/cargo-changed.sh clippy
        language: script
        files: '\.rs$|Cargo\.(toml|lock)$'
      - id: cargo-test
        name: cargo test
        entry: scripts/cargo-changed.sh test
        language: script
        files: '\.rs$|Cargo\.(toml|lock)$'
        stages: [pre-push]
