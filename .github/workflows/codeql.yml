name: CodeQL
run-name: 🔍 CodeQL analysis

# Advanced setup in place of GitHub's default setup, which runs on
# ubuntu-latest and cannot pin the runner. Same languages, same default query
# suite, same triggers: every push to main and a weekly scan.
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Test-only code: fixtures hard-code credentials and panic messages
          # name test users on purpose. forklift's src/testing compiles only
          # under cfg(test) or the testing feature, never into the binary.
          config: |
            paths-ignore:
              - "**/tests/**"
              - "**/src/testing/**"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
