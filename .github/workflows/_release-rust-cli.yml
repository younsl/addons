name: Release Rust CLI
run-name: "\U0001F4E6 Release rust CLI (Cargo.toml version change)"

on:
  push:
    branches: [main]
    paths:
      - 'box/cli/ij/Cargo.toml'
  workflow_dispatch:
    inputs:
      project:
        description: "Project to release"
        required: true
        type: choice
        options:
          - ij
      force:
        description: "Release even if the version already exists (overwrites the existing release)"
        required: false
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Detect: read the version from Cargo.toml, skip when dist/<version> already
  # exists on main. A merge that leaves the version untouched no-ops here.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      has_release: ${{ steps.info.outputs.has_release }}
      project_name: ${{ steps.info.outputs.project_name }}
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      project_base_dir: ${{ steps.info.outputs.project_base_dir }}
      macos_runner: ${{ steps.info.outputs.macos_runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve project and version from Cargo.toml
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED: ${{ inputs.project }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          PROJECT_NAME="${SELECTED:-ij}"

          case "${PROJECT_NAME}" in
            ij)
              PROJECT_BASE_DIR="box/cli/ij"
              MACOS_RUNNER="macos-26"
              ;;
            *)
              echo "::error::Unknown project '${PROJECT_NAME}'"
              exit 1
              ;;
          esac

          CARGO_TOML="${PROJECT_BASE_DIR}/Cargo.toml"
          if [[ ! -f "${CARGO_TOML}" ]]; then
            echo "::error::${CARGO_TOML} not found"
            exit 1
          fi

          # The [package] version is the only key at the start of a line; every
          # dependency version lives inside an inline table.
          VERSION=$(grep -m1 -oP '^version\s*=\s*"\K[^"]+' "${CARGO_TOML}" || echo "")
          if [[ -z "${VERSION}" ]]; then
            echo "::error::package version not found in ${CARGO_TOML}"
            exit 1
          fi

          TAG="${PROJECT_NAME}/${VERSION}"

          HAS_RELEASE="true"
          if [[ -d "${PROJECT_BASE_DIR}/dist/${VERSION}" ]]; then
            # The duplicate check keeps a merge that touched Cargo.toml without
            # bumping the version from re-cutting a release. A manual run asking
            # for force is a statement of intent.
            if [[ "${FORCE}" != "true" ]]; then
              echo "✅ ${TAG} already released, skip"
              HAS_RELEASE="false"
            else
              echo "♻️ ${TAG} already released, forced re-release overwrites dist/${VERSION}"
            fi
          else
            echo "🆕 ${TAG} not released yet, will release"
          fi

          {
            echo "has_release=${HAS_RELEASE}"
            echo "project_name=${PROJECT_NAME}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "project_base_dir=${PROJECT_BASE_DIR}"
            echo "macos_runner=${MACOS_RUNNER}"
          } >> $GITHUB_OUTPUT

          echo "Project: ${PROJECT_NAME}"
          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"
          echo "Base dir: ${PROJECT_BASE_DIR}"
          echo "macOS runner: ${MACOS_RUNNER}"

  test:
    needs: [detect]
    if: needs.detect.outputs.has_release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      PROJECT_BASE_DIR: ${{ needs.detect.outputs.project_base_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: ${{ env.PROJECT_BASE_DIR }}/target
          key: ${{ runner.os }}-cargo-build-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: cargo fmt --check

      - name: Run clippy
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: |
          cargo test --verbose
          cargo test --release --verbose

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.69.4
        with:
          tool: cargo-llvm-cov

      - name: Check test coverage (minimum 70%)
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: cargo llvm-cov --fail-under-lines 70

  build-binaries:
    needs: [detect, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PROJECT_NAME: ${{ needs.detect.outputs.project_name }}
      PROJECT_BASE_DIR: ${{ needs.detect.outputs.project_base_dir }}
      VERSION: ${{ needs.detect.outputs.version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: amd64
          # Native arm runner: no cross toolchain, and the smoke test runs.
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - os: ${{ needs.detect.outputs.macos_runner }}
            target: x86_64-apple-darwin
            platform: darwin
            arch: amd64
          - os: ${{ needs.detect.outputs.macos_runner }}
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: ${{ env.PROJECT_BASE_DIR }}/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: |
          echo "================================="
          echo "Building ${PROJECT_NAME}"
          echo "Target: ${{ matrix.target }}"
          echo "Platform: ${{ matrix.platform }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Version: ${VERSION}"
          echo "================================="

          cargo build --release --target ${{ matrix.target }} --verbose

          BINARY_NAME="${PROJECT_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
          SOURCE_BINARY="target/${{ matrix.target }}/release/${PROJECT_NAME}"

          if [ ! -f "${SOURCE_BINARY}" ]; then
            echo "Error: Binary not found at ${SOURCE_BINARY}"
            ls -la "target/${{ matrix.target }}/release/" || echo "Directory not found"
            exit 1
          fi

          cp "${SOURCE_BINARY}" "${BINARY_NAME}"
          chmod +x "${BINARY_NAME}"

          echo "Binary created: ${BINARY_NAME}"
          ls -lh "${BINARY_NAME}"

          echo "Running smoke test..."
          ./"${BINARY_NAME}" --version || echo "Warning: Version check failed (may not work on this platform)"

      - name: Create archive
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: |
          BINARY_NAME="${PROJECT_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p package
          cp "${BINARY_NAME}" "package/${PROJECT_NAME}"
          tar -czf "${BINARY_NAME}.tar.gz" -C package "${PROJECT_NAME}"
          echo "Created: ${BINARY_NAME}.tar.gz"
          ls -lh "${BINARY_NAME}.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.PROJECT_BASE_DIR }}/${{ env.PROJECT_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  # Commits the archives to <project>/dist/<version> on main, served from
  # raw.githubusercontent.com.
  publish:
    runs-on: ubuntu-26.04
    needs: [detect, build-binaries, test]
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.detect.outputs.project_name }}
      cancel-in-progress: false
    env:
      PROJECT_NAME: ${{ needs.detect.outputs.project_name }}
      PROJECT_BASE_DIR: ${{ needs.detect.outputs.project_base_dir }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: ${{ env.PROJECT_NAME }}-*
          merge-multiple: true

      - name: Commit binaries to dist
        run: |
          set -euo pipefail

          DIST_DIR="${PROJECT_BASE_DIR}/dist/${VERSION}"
          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}"
          cp artifacts/*.tar.gz "${DIST_DIR}/"
          (cd "${DIST_DIR}" && sha256sum -- *.tar.gz > SHA256SUMS)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${DIST_DIR}"
          git commit -s -m "[${PROJECT_NAME}] chore(dist): publish ${PROJECT_NAME} ${VERSION}" -m "Built from ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PUSHED=false
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            git pull --rebase origin main
          done
          if [[ "${PUSHED}" != "true" ]]; then
            echo "::error::Failed to push ${DIST_DIR} to main"
            exit 1
          fi

          {
            echo "### ${PROJECT_NAME} ${VERSION}"
            echo
            echo "Published to \`${DIST_DIR}\`."
            echo
            echo '```'
            cat "${DIST_DIR}/SHA256SUMS"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
