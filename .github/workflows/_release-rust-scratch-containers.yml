name: Release Rust Scratch Containers
run-name: "📦 Release rust scratch containers (version label change)"

on:
  push:
    branches: [main]
    paths:
      - 'box/kubernetes/aurora-database-insights-exporter/Dockerfile'
      - 'box/kubernetes/aws-health-event-notifier/Dockerfile'
      - 'box/kubernetes/aws-vpn-maintenance-handler/Dockerfile'
      - 'box/kubernetes/ec2-metadata-exporter/Dockerfile'
      - 'box/kubernetes/gss/Dockerfile'
      - 'box/kubernetes/trivy-collector/Dockerfile'
      - 'box/kubernetes/kubernetes-upgrade-operator/Dockerfile'
      - 'box/kubernetes/kagent-gateway/Dockerfile'
      - 'box/kubernetes/argocd-promotion-gate/Dockerfile'
      - 'box/kubernetes/argocd-canary-gate/Dockerfile'
      - 'box/kubernetes/filesystem-cleaner/Dockerfile'
      - 'box/kubernetes/external-ebs-autoresizer/Dockerfile'
      - 'box/kubernetes/backstage/backstage-mcp/Dockerfile'
      - 'box/kubernetes/forklift/Dockerfile'
      - 'box/kubernetes/forklift/Dockerfile.mcp'
  workflow_dispatch:
    inputs:
      project:
        description: "Project to release"
        required: true
        type: choice
        options:
          - aurora-database-insights-exporter
          - aws-health-event-notifier
          - aws-vpn-maintenance-handler
          - ec2-metadata-exporter
          - gss
          - trivy-collector
          - kuo
          - kagent-gateway
          - argocd-promotion-gate
          - argocd-canary-gate
          - filesystem-cleaner
          - external-ebs-autoresizer
          - backstage-mcp
          - forklift
          - forklift-mcp
      force:
        description: "Rebuild even if the version already exists on GHCR (overwrites the tag)"
        required: false
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Detect: extract version from Dockerfile label, check GHCR for duplicates,
  # emit dynamic matrices for downstream jobs.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    outputs:
      has_releases: ${{ steps.gen.outputs.has_releases }}
      test_matrix: ${{ steps.gen.outputs.test_matrix }}
      binary_matrix: ${{ steps.gen.outputs.binary_matrix }}
      docker_matrix: ${{ steps.gen.outputs.docker_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # ci-changed-files.sh diffs the whole push
          fetch-depth: 0

      - name: Generate release matrices
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED: ${{ inputs.project }}
          FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: .github/scripts/ci-detect-rust-releases.sh

  # ---------------------------------------------------------------------------
  # Test: fmt, clippy, tests, coverage (70% minimum, shared across projects)
  # ---------------------------------------------------------------------------
  test:
    needs: detect
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.test_matrix) }}
    env:
      PROJECT_BASE_DIR: ${{ matrix.base_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ matrix.project }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: ${{ env.PROJECT_BASE_DIR }}/target
          key: ${{ runner.os }}-cargo-build-test-${{ matrix.project }}-${{ hashFiles('**/Cargo.lock') }}

      # No frontend is built here, so a generated embed directory must exist
      - name: Create the embed directory
        if: matrix.embed_dir != '-'
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        env:
          EMBED_DIR: ${{ matrix.embed_dir }}
        run: mkdir -p "${EMBED_DIR}"

      - name: Check formatting
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: cargo fmt --check

      - name: Run clippy
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: |
          cargo test --verbose
          cargo test --release --verbose

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.69.4
        with:
          tool: cargo-llvm-cov

      - name: Check test coverage (minimum 70%)
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: cargo llvm-cov --fail-under-lines 70

  # ---------------------------------------------------------------------------
  # Build binaries: cargo-zigbuild for musl targets (per project × arch)
  # ---------------------------------------------------------------------------
  build-binaries:
    needs: [detect, test]
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.binary_matrix) }}
    env:
      PROJECT_NAME: ${{ matrix.project }}
      BINARY_NAME: ${{ matrix.binary }}
      PROJECT_BASE_DIR: ${{ matrix.base_dir }}
      VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        # Pinned: binaries built with zig 0.16.0 (LLVM 21) leak memory at runtime
        # in statically linked musl builds, growing RSS until OOMKill. The same
        # source built with zig 0.15.2 (LLVM 20) holds a flat RSS. Bump only after
        # verifying RSS stays flat on a rebuilt exporter over 24h.
        # cargo-zigbuild needs >= 0.23.0 to filter the --fix-cortex-a53-843419
        # linker arg that rustc 1.98 passes for aarch64-linux targets.
        run: pip install ziglang==0.15.2 && cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ matrix.project }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ matrix.project }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup pnpm
        if: matrix.frontend_manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ env.PROJECT_BASE_DIR }}/${{ matrix.frontend_dir }}/package.json
          run_install: false

      - name: Setup Node.js
        if: matrix.frontend_manager != 'none'
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Build frontend
        if: matrix.frontend_manager != 'none'
        working-directory: ${{ env.PROJECT_BASE_DIR }}/${{ matrix.frontend_dir }}
        env:
          FRONTEND_MANAGER: ${{ matrix.frontend_manager }}
        run: |
          case "${FRONTEND_MANAGER}" in
            npm)
              npm ci
              npm run build
              ;;
            pnpm)
              pnpm install --frozen-lockfile
              pnpm run build
              ;;
            *)
              echo "::error::unsupported frontend manager ${FRONTEND_MANAGER}"
              exit 1
              ;;
          esac

      - name: Build binary with cargo-zigbuild
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          # Read by forklift's build.rs, ignored by the other crates
          FORKLIFT_VERSION: ${{ matrix.version }}
          FORKLIFT_COMMIT: ${{ github.sha }}
        run: |
          echo "================================="
          echo "Building ${PROJECT_NAME} (binary: ${BINARY_NAME})"
          echo "Target: ${{ matrix.target }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Version: ${VERSION}"
          echo "================================="

          export VERGEN_BUILD_TIMESTAMP="${BUILD_TIMESTAMP}"
          cargo zigbuild --release --target ${{ matrix.target }} --bin "${BINARY_NAME}"

          ARTIFACT_NAME="${BINARY_NAME}-linux-${{ matrix.arch }}"
          SOURCE_BINARY="target/${{ matrix.target }}/release/${BINARY_NAME}"

          if [ ! -f "${SOURCE_BINARY}" ]; then
            echo "Error: Binary not found at ${SOURCE_BINARY}"
            ls -la "target/${{ matrix.target }}/release/" || echo "Directory not found"
            exit 1
          fi

          cp "${SOURCE_BINARY}" "${ARTIFACT_NAME}"
          chmod +x "${ARTIFACT_NAME}"

          echo "Binary created: ${ARTIFACT_NAME}"
          ls -lh "${ARTIFACT_NAME}"
          file "${ARTIFACT_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary }}-linux-${{ matrix.arch }}
          path: ${{ env.PROJECT_BASE_DIR }}/${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}

  # ---------------------------------------------------------------------------
  # Build & push Docker image (scratch, multiarch)
  # ---------------------------------------------------------------------------
  build-docker:
    needs: [detect, test, build-binaries]
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.docker_matrix) }}
    env:
      BINARY_NAME: ${{ matrix.binary }}
      PROJECT_BASE_DIR: ${{ matrix.base_dir }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ matrix.image }}
      VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download amd64 binary
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.binary }}-linux-amd64
          path: ${{ env.PROJECT_BASE_DIR }}

      - name: Download arm64 binary
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.binary }}-linux-arm64
          path: ${{ env.PROJECT_BASE_DIR }}

      - name: Verify binaries
        working-directory: ${{ env.PROJECT_BASE_DIR }}
        run: |
          echo "Downloaded binaries:"
          ls -lh "${BINARY_NAME}"-linux-*
          file "${BINARY_NAME}"-linux-*
          chmod +x "${BINARY_NAME}"-linux-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.PROJECT_BASE_DIR }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
