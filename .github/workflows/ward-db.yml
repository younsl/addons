name: Ward DB

run-name: "🛡️ Publish ward signature database"

# Daily rebuild of the signed signature database. Building and testing run
# without the signing key, only the publish job holds it and packages: write.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the inputs match the latest database"
        required: false
        default: false
        type: boolean

concurrency:
  group: ward-db
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  REPOSITORY: ghcr.io/${{ github.repository_owner }}/ward-db
  WORK_DIR: ${{ github.workspace }}/ward-db

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      revision: ${{ steps.build.outputs.revision }}
    env:
      WARD_BIN: ${{ github.workspace }}/box/addons/ward/target/release/ward
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            box/addons/ward/target
          key: ${{ runner.os }}-cargo-ward-db-${{ hashFiles('box/addons/ward/Cargo.lock') }}

      - name: Build ward
        working-directory: box/addons/ward
        run: cargo "+${RUST_VERSION}" build --release --bin ward

      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Fetch sources
        env:
          ABUSE_CH_AUTH_KEY: ${{ secrets.ABUSE_CH_AUTH_KEY }}
        run: .github/scripts/ci-ward-db.sh fetch

      - name: Build database
        id: build
        env:
          FORCE: ${{ inputs.force }}
        run: .github/scripts/ci-ward-db.sh build

      - name: Export false-positive corpus
        if: steps.build.outputs.changed == 'true'
        run: .github/scripts/ci-ward-db.sh corpus

      - name: Check database
        if: steps.build.outputs.changed == 'true'
        run: .github/scripts/ci-ward-db.sh check

      - name: Upload database
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ward-db
          path: |
            ${{ env.WORK_DIR }}/ward-db.json.gz
            ${{ env.WORK_DIR }}/state.env
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      # cosign v2: sign-blob writes a bare signature with --output-signature
      - name: Setup cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Download database
        uses: actions/download-artifact@v7
        with:
          name: ward-db
          path: ${{ env.WORK_DIR }}

      - name: Sign and push
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/ci-ward-db.sh publish
