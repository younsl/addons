name: Release Charts
run-name: "📦 Release changed charts to ghcr.io"

on:
  push:
    branches:
      - main
    paths:
      - 'box/kubernetes/**/Chart.yaml'
  workflow_dispatch:
    inputs:
      chart:
        description: 'Specific chart to release (leave empty for all)'
        required: false
        type: string
      force:
        description: 'Release even if the version already exists on ghcr.io (overwrites the tag)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  REGISTRY_PATH: ghcr.io/younsl/charts

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect charts to release
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CHART: ${{ inputs.chart }}
          FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: .github/scripts/ci-detect-chart-releases.sh

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Resolve chart dependencies
        env:
          CHART_PATH: ${{ matrix.chart_path }}
        run: |
          if [ ! -f "${CHART_PATH}/Chart.lock" ]; then
            echo "No Chart.lock in ${CHART_PATH}, nothing to resolve"
            exit 0
          fi

          helm dependency update "${CHART_PATH}"

          if ! git diff --exit-code -- "${CHART_PATH}/Chart.lock"; then
            echo "::error::Chart.lock is out of date: ${CHART_PATH}/Chart.lock. Run 'helm dependency update' locally and commit the result."
            exit 1
          fi

      - name: Lint chart
        env:
          CHART_PATH: ${{ matrix.chart_path }}
        run: |
          helm lint "${CHART_PATH}"

      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin helm-docs

      - name: Validate helm-docs
        env:
          CHART_PATH: ${{ matrix.chart_path }}
        run: |
          SHARED_TEMPLATE="$(pwd)/box/kubernetes/charts/README.md.gotmpl"

          if [ -f "${CHART_PATH}/README.md.gotmpl" ]; then
            helm-docs --chart-search-root "${CHART_PATH}" --template-files="README.md.gotmpl" --sort-values-order file --log-level info
          elif [ -f "${SHARED_TEMPLATE}" ]; then
            helm-docs --chart-search-root "${CHART_PATH}" --template-files="${SHARED_TEMPLATE}" --sort-values-order file --log-level info
          else
            echo "No helm-docs template found, skipping validation"
            exit 0
          fi

          if ! git diff --exit-code -- "${CHART_PATH}/README.md"; then
            echo "::error::helm-docs validation failed: ${CHART_PATH}/README.md is out of date. Run 'helm-docs' locally and commit the changes."
            exit 1
          fi

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        env:
          CHART_NAME: ${{ matrix.chart_name }}
          CHART_VERSION: ${{ matrix.version }}
          CHART_PATH: ${{ matrix.chart_path }}
        run: |
          helm package "${CHART_PATH}" --version "${CHART_VERSION}"
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY_PATH}"

      - name: Summary
        if: always()
        env:
          CHART_NAME: ${{ matrix.chart_name }}
          CHART_VERSION: ${{ matrix.version }}
          APP_VERSION: ${{ matrix.app_version }}
          CHART_PATH: ${{ matrix.chart_path }}
        run: |
          OCI_REF="oci://${REGISTRY_PATH}/${CHART_NAME}"
          {
            echo "## ${CHART_NAME}"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Version | \`${CHART_VERSION}\` |"
            echo "| App Version | \`${APP_VERSION}\` |"
            echo "| OCI | \`${OCI_REF}\` |"
            echo "| Path | \`${CHART_PATH}\` |"
            echo ""
            echo "\`\`\`bash"
            echo "helm install ${CHART_NAME} ${OCI_REF} --version ${CHART_VERSION}"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
