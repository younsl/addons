apiVersion: v2
name: aws-health-event-notifier
description: Receives AWS Health events and posts them to Slack
type: application
deprecated: false
version: 0.6.0
appVersion: "0.4.0"
home: https://github.com/younsl/addons
sources:
  - https://github.com/younsl/addons/tree/main/box/addons/aws-health-event-notifier
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - aws
  - aws-health
  - slack
  - notifier
  - webhook
  - observability
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Lease-based leader election with a ConfigMap delivery ledger (leaderElection.enabled), so two or more replicas run without duplicate Slack posts"
    - kind: changed
      description: "Slack 5xx and timeouts are retried up to 3 times, other failures are classified as not posted (retried next cycle) or unknown (never retried)"
  artifacthub.io/license: Apache-2.0
