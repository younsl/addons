{{- if and .Values.mcp.enabled .Values.mcp.token (not .Values.mcp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubernetes-upgrade-operator.fullname" . }}-mcp-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-upgrade-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mcp.existingSecretKey }}: {{ .Values.mcp.token | quote }}
{{- end }}
