                    properties:
                      endOfExtendedSupportDate:
                        description: End of extended support date.
                        format: date-time
                        nullable: true
                        type: string
                      endOfStandardSupportDate:
                        description: End of standard support date.
                        format: date-time
                        nullable: true
                        type: string
                      version:
                        description: Kubernetes version (e.g., "1.32").
                        type: string
                      versionStatus:
                        description: Version status (e.g., "standard-support", "extended-support").
                        type: string
                    required:
                    - version
                    - versionStatus
                    type: object
                  error:
                    description: Error message if lifecycle info could not be fetched.
                    nullable: true
                    type: string
                  lastCheckedTime:
                    description: Timestamp when lifecycle info was last fetched from the `DescribeClusterVersions` API.
                    format: date-time
                    type: string
                  targetVersion:
                    description: Lifecycle info for the target upgrade version.
                    nullable: true
                    properties:
                      endOfExtendedSupportDate:
                        description: End of extended support date.
                        format: date-time
                        nullable: true
                        type: string
                      endOfStandardSupportDate:
                        description: End of standard support date.
                        format: date-time
                        nullable: true
                        type: string
                      version:
                        description: Kubernetes version (e.g., "1.32").
                        type: string
                      versionStatus:
                        description: Version status (e.g., "standard-support", "extended-support").
                        type: string
                    required:
                    - version
                    - versionStatus
                    type: object
                required:
                - lastCheckedTime
                type: object
              message:
                description: Error message if the upgrade failed.
                nullable: true
                type: string
              observedGeneration:
                default: 0
                description: Last observed generation of the spec.
                format: int64
                type: integer
              phase:
                description: Current phase of the upgrade process.
                enum:
                - Pending
                - Planning
                - PreflightChecking
                - UpgradingControlPlane
                - UpgradingAddons
                - UpgradingNodeGroups
                - UpgradingKarpenterNodePools
                - RollingBackNodeGroups
                - RollingBackAddons
                - RollingBackControlPlane
                - Completed
                - Failed
                - null
                nullable: true
                type: string
              phases:
                default: {}
                description: Per-phase status details.
                properties:
                  addons:
                    description: Addon upgrade statuses.
                    items:
                      description: Status of an individual addon upgrade.
                      properties:
                        completedAt:
                          description: Timestamp when this add-on upgrade completed.
                          format: date-time
                          nullable: true
                          type: string
                        currentVersion:
                          description: Current installed version of the add-on before upgrade.
                          type: string
                        name:
                          description: Name of the EKS add-on (e.g., `vpc-cni`, `coredns`, `kube-proxy`).
                          type: string
                        startedAt:
                          description: Timestamp when this add-on upgrade was initiated.
                          format: date-time
                          nullable: true
                          type: string
                        status:
                          description: Status of a component upgrade.
                          enum:
                          - Pending
                          - InProgress
                          - Completed
                          - Failed
                          - Skipped
                          type: string
                        targetVersion:
                          description: Target version the add-on will be upgraded to.
                          type: string
                      required:
                      - currentVersion
                      - name
                      - status
                      - targetVersion
                      type: object
                    type: array
                  controlPlane:
