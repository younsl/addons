                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentVersion:
                description: Current Kubernetes version of the cluster.
                nullable: true
                type: string
              identity:
                description: AWS caller identity used for API calls (from STS `GetCallerIdentity`).
                nullable: true
                properties:
                  accountId:
                    description: AWS account ID.
                    type: string
                  arn:
                    description: IAM ARN used for API calls.
                    type: string
                required:
                - accountId
                - arn
                type: object
              lastTransition:
                description: 'The last transition (upgrade or rollback) that reached `Completed`. Recorded when the flow completes and deliberately preserved across spec-change resets (see `reset_status_patch`), because the live `current_version` alone cannot tell whether the cluster arrived at its current minor via a forward upgrade or a rollback. It is the only signal available to reject a consecutive rollback: EKS permits rolling back only to a version the cluster was recently upgraded from, so a second rollback in a row (e.g. 1.36 -> 1.35 then 1.35 -> 1.34) has no eligible target.'
                nullable: true
                properties:
                  completedAt:
                    description: Timestamp when the transition completed.
                    format: date-time
                    type: string
                  mode:
                    description: Direction of the completed transition.
                    enum:
                    - Forward
                    - Rollback
                    type: string
                  toVersion:
                    description: Cluster version the transition settled on.
                    type: string
                required:
                - completedAt
                - mode
                - toVersion
                type: object
              lifecycle:
                description: EKS version lifecycle information (support end dates).
