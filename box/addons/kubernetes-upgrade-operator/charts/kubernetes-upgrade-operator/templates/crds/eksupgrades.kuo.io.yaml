                                properties:
                                  controllers:
                                    description: Owning controllers of the pods evicted from this node, captured before deletion, encoded as `kind|namespace|name`. Persisted so a restart mid-replacement can still wait for the right controllers to recover.
                                    items:
                                      type: string
                                    type: array
                                  nodeClaim:
                                    description: Name of the `NodeClaim` being replaced.
                                    type: string
                                  nodeName:
                                    description: Name of the backing Node resource, if already registered. Recorded alongside the `NodeClaim` so operators can cross-reference `kubectl get nodes` without an extra lookup.
                                    nullable: true
                                    type: string
                                  providerId:
                                    description: Provider ID (e.g. `aws:///<az>/<instance-id>`) for AWS-side correlation.
                                    nullable: true
                                    type: string
                                  startedAt:
                                    description: Timestamp when this `NodeClaim`'s replacement started. Used for timeout enforcement.
                                    format: date-time
                                    nullable: true
                                    type: string
                                  state:
                                    description: 'Replacement stage: `Draining` or `WaitingControllerStable`.'
                                    type: string
                                required:
                                - nodeClaim
                                - state
                                type: object
                              type: array
                            name:
                              description: '`NodePool` name.'
                              type: string
                            replacedNodes:
                              default: 0
                              description: Nodes replaced so far in this `NodePool`.
                              format: uint32
                              minimum: 0.0
                              type: integer
                            replacements:
                              description: Completed replacements mapping each removed `NodeClaim` to the new one.
                              items:
                                description: A completed node replacement, mapping the removed `NodeClaim` to the one Karpenter provisioned in its place.
                                properties:
                                  newNodeClaim:
                                    description: Name of the newly provisioned `NodeClaim`, if it could be identified.
                                    nullable: true
                                    type: string
                                  nodeName:
                                    description: Name of the old backing Node, for cross-reference.
                                    nullable: true
                                    type: string
                                  oldNodeClaim:
                                    description: Name of the removed (old) `NodeClaim`.
                                    type: string
                                required:
                                - oldNodeClaim
                                type: object
                              type: array
                            status:
