    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for EKSUpgradeSpec via `CustomResource`
        properties:
          spec:
            description: '`EKSUpgrade` spec defines the desired state of an EKS cluster upgrade.'
            properties:
              addonVersions:
                additionalProperties:
                  type: string
                description: Optional add-on version overrides (addon name -> version).
                nullable: true
                type: object
              assumeRoleArn:
                description: IAM Role ARN to assume for cross-account access. Works with both IRSA and EKS Pod Identity as the base credential source.
                nullable: true
                type: string
              clusterName:
                description: Name of the EKS cluster to upgrade.
                type: string
              dryRun:
                default: false
                description: Plan only, do not execute.
                type: boolean
              karpenterNodePools:
                description: Karpenter `NodePool` node replacement configuration. When present and enabled, kuo rolls Karpenter-managed nodes after the managed node group phase completes. Absent or disabled leaves Karpenter nodes untouched (managed node groups only), preserving prior behaviour.
                nullable: true
                properties:
                  controllerStableTimeoutMinutes:
                    default: 10
                    description: Max minutes to wait for the controllers of evicted pods to become Ready again on other nodes before proceeding. Default 10.
                    format: uint64
                    minimum: 0.0
                    type: integer
                  enabled:
                    default: false
                    description: Enable Karpenter `NodePool` node replacement.
                    type: boolean
                  maxUnavailable:
                    default: '1'
                    description: Maximum nodes replaced concurrently per `NodePool`. Accepts a bare integer (`"1"`) or a percentage (`"10%"`) of the `NodePool`'s node count. Defaults to `"1"` (strictly sequential).
                    type: string
                  nodeDrainTimeoutMinutes:
                    default: 15
                    description: Max minutes to wait for an old node to drain and be removed after the `NodeClaim` is deleted. Karpenter performs the drain; kuo waits. Default 15.
                    format: uint64
                    minimum: 0.0
                    type: integer
                  nodePools:
                    description: '`NodePools` to process, in the listed order. An empty list or a single `ALL` entry (case-insensitive) selects every `NodePool` in the cluster.'
                    items:
                      type: string
                    type: array
                  strategy:
                    default: Replace
                    description: Replacement strategy. v1 supports `Replace` only.
                    enum:
                    - Replace
                    type: string
                type: object
              notification:
                description: Slack notification configuration for this upgrade.
                nullable: true
                properties:
                  onDryRun:
                    default: false
                    description: 'Send Slack notifications for dry-run executions (dryRun: true).'
                    type: boolean
                  onUpgrade:
                    default: false
                    description: 'Send Slack notifications for actual upgrades (dryRun: false).'
                    type: boolean
                type: object
              region:
                description: AWS region where the cluster resides.
                type: string
              targetVersion:
                description: Target Kubernetes version (e.g., "1.34").
                type: string
              timeouts:
                description: Timeout configuration.
                nullable: true
                properties:
                  controlPlaneMinutes:
                    default: 30
                    description: 'Control plane upgrade timeout in minutes (default: 30).'
                    format: uint64
                    minimum: 0.0
                    type: integer
                  nodegroupMinutes:
                    default: 60
                    description: 'Node group upgrade timeout in minutes (default: 60).'
                    format: uint64
                    minimum: 0.0
                    type: integer
                type: object
              upgradeMode:
                description: 'Direction of the version change (required; must be set explicitly). `Forward` upgrades the cluster toward `targetVersion`. `Rollback` reverts a previously upgraded cluster to the previous minor version (N-1), mirroring the AWS EKS version rollback semantics: node groups roll back first, then add-ons, then the control plane. Only a single minor rollback (N to N-1) is supported.'
                enum:
                - Forward
                - Rollback
                type: string
            required:
            - clusterName
            - region
            - targetVersion
            - upgradeMode
            type: object
          status:
            description: '`EKSUpgrade` status defines the observed state of the upgrade.'
            nullable: true
            properties:
              completedAt:
                description: Timestamp when the upgrade completed (Completed or Failed).
                format: date-time
                nullable: true
                type: string
              conditions:
                description: Conditions.
                items:
                  description: Condition on the `EKSUpgrade` resource.
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message with details about the condition.
                      nullable: true
                      type: string
                    reason:
                      description: Machine-readable reason for the condition's last transition (e.g., `AssumeRoleSuccess`, `IdentityVerified`).
                      type: string
                    status:
                      description: 'Status of the condition: `True`, `False`, or `Unknown`.'
                      type: string
                    type:
