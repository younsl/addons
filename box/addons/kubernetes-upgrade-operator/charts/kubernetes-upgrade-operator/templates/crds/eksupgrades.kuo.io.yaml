                              type: string
                            totalNodes:
                              default: 0
                              description: Total stale nodes detected in this `NodePool` at planning time.
                              format: uint32
                              minimum: 0.0
                              type: integer
                          required:
                          - name
                          - status
                          type: object
                        type: array
                      replacedNodes:
                        default: 0
                        description: Nodes replaced so far across all target `NodePools`.
                        format: uint32
                        minimum: 0.0
                        type: integer
                      strategy:
                        description: Strategy in effect (e.g. `Replace`).
                        type: string
                      totalNodes:
                        default: 0
                        description: Total stale nodes across all target `NodePools`.
                        format: uint32
                        minimum: 0.0
                        type: integer
                    type: object
                  nodegroups:
                    description: Node group upgrade statuses.
                    items:
                      description: Status of an individual node group upgrade.
                      properties:
                        completedAt:
                          description: Timestamp when this node group upgrade completed.
                          format: date-time
                          nullable: true
                          type: string
                        currentVersion:
                          description: Current Kubernetes version of the node group AMI before upgrade.
                          type: string
                        name:
                          description: Name of the managed node group.
                          type: string
                        startedAt:
                          description: 'Timestamp when this node group upgrade was initiated. Used for timeout enforcement. NOTE: No `skip_serializing_if` — same reason as `update_id`.'
                          format: date-time
                          nullable: true
                          type: string
                        status:
                          description: Status of a component upgrade.
                          enum:
                          - Pending
                          - InProgress
                          - Completed
                          - Failed
                          - Skipped
                          type: string
                        targetVersion:
                          description: Target Kubernetes version the node group will be upgraded to.
                          type: string
                        updateId:
                          description: 'Active AWS update ID for this node group (for crash recovery). NOTE: No `skip_serializing_if` — None must serialize as `null` so that JSON Merge Patch (RFC 7396) removes the field from the CRD status.'
                          nullable: true
                          type: string
                      required:
                      - currentVersion
                      - name
                      - status
                      - targetVersion
                      type: object
                    type: array
                  planning:
                    description: Planning phase details.
                    nullable: true
                    properties:
                      sourceVersion:
                        description: Cluster version at planning time, i.e. the start of the upgrade path. Immutable across the upgrade; unlike the top-level `current_version` which is advanced to each step's target during the control plane phase.
                        nullable: true
                        type: string
                      upgradePath:
                        description: Planned upgrade path (e.g., `["1.33", "1.34"]`).
                        items:
                          type: string
                        type: array
                    type: object
                  preflight:
                    description: Preflight checking phase details.
                    nullable: true
                    properties:
                      checks:
                        description: Results of preflight checks.
                        items:
                          description: Result of a single preflight check.
                          properties:
                            message:
                              description: Human-readable summary of the check result.
                              type: string
                            name:
                              description: Name of the preflight check.
                              type: string
                            resources:
                              description: Resources the check flagged, one entry per resource (e.g., `payments/worker-pdb` for a blocking PDB).
                              items:
                                type: string
                              type: array
                            status:
                              description: 'Result: Pass, Fail, or Skip.'
                              type: string
                          required:
                          - message
                          - name
                          - status
                          type: object
                        type: array
                    type: object
                type: object
              progress:
                description: Overall progress as `completed/total` component units (control plane minor steps + add-ons + node groups), analogous to a Pod's Ready column. `None` until a plan exists.
                nullable: true
                type: string
              startedAt:
                description: Timestamp when the upgrade started.
                format: date-time
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: EKSUpgrade
        type: object
    served: true
    storage: true
    subresources:
      status: {}
