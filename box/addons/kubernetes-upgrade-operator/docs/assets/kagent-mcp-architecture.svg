<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 520">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#ededed;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#8f8f8f;font-size:11px}
    .l{fill:#666;font-size:11px}
    .card{fill:#0a0a0a;stroke:#2e2e2e}
    .in{fill:#111;stroke:#262626}
    .hi{fill:#111;stroke:#ededed}
    .edge{stroke:#525252;stroke-width:1.25;fill:none}
    .bound{fill:none;stroke:#2e2e2e;stroke-dasharray:4 4}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/>
    </marker>
  </defs>

  <rect width="1248" height="520" fill="#000"/>
  <rect width="1248" height="520" fill="url(#grid)"/>

  <text x="40" y="52" class="t h">kuo MCP server</text>
  <text x="40" y="76" class="t s">kagent asks, kuo answers with verdicts over stateless, bearer authenticated Streamable HTTP</text>

  <rect x="40" y="108" width="800" height="372" rx="10" class="bound"/>
  <text x="56" y="130" class="t l">Kubernetes cluster (hub)</text>

  <rect x="64" y="160" width="232" height="152" rx="6" class="card"/>
  <text x="80" y="186" class="t n">kagent</text>
  <text x="280" y="186" text-anchor="end" class="m l">ns: kagent</text>
  <text x="80" y="214" class="t d">Agent</text>
  <text x="80" y="230" class="m l">toolNames</text>
  <text x="80" y="254" class="t d">RemoteMCPServer</text>
  <text x="80" y="270" class="m l">kuo.kuo.svc:8082/mcp</text>
  <text x="80" y="294" class="t d">Secret <tspan class="m l">kuo-mcp-token</tspan></text>

  <rect x="372" y="140" width="320" height="236" rx="6" class="card"/>
  <text x="388" y="166" class="t n">kuo</text>
  <text x="676" y="166" text-anchor="end" class="m l">ns: kuo</text>
  <text x="388" y="186" class="m l">:8080 health  :8081 metrics  :8082 mcp</text>

  <rect x="388" y="198" width="288" height="78" rx="5" class="hi"/>
  <text x="404" y="220" class="m n">mcp</text>
  <text x="404" y="240" class="t d">12 read tools, 3 mutating tools</text>
  <text x="404" y="256" class="t d">bearer auth, 30s TTL cache, audit and Slack</text>

  <rect x="388" y="288" width="288" height="50" rx="5" class="in"/>
  <text x="404" y="308" class="m n">controller</text>
  <text x="404" y="326" class="t d">same clients, same resolve path</text>

  <text x="388" y="362" class="m l">shared: eks, k8s, crd, render</text>

  <rect x="372" y="412" width="320" height="48" rx="6" class="card"/>
  <text x="388" y="441" class="m n">EKSUpgrade</text>
  <text x="676" y="441" text-anchor="end" class="t d">one per cluster</text>

  <rect x="904" y="160" width="304" height="104" rx="6" class="card"/>
  <text x="920" y="186" class="t n">AWS EKS API</text>
  <text x="920" y="208" class="t d">assumed role through STS</text>
  <text x="920" y="230" class="t l">insights, add-on compatibility,</text>
  <text x="920" y="246" class="t l">node groups, version lifecycle</text>

  <rect x="904" y="292" width="304" height="104" rx="6" class="card"/>
  <text x="920" y="318" class="t n">Target cluster (spoke)</text>
  <text x="920" y="340" class="t d">read only through resolve_client</text>
  <text x="920" y="362" class="t l">NodeClaims, NodePools, PDBs,</text>
  <text x="920" y="378" class="t l">node kubelet versions</text>

  <g class="edge" marker-end="url(#arrow)">
    <path d="M296 236 H382"/>
    <path d="M692 212 H898"/>
    <path d="M692 344 H898"/>
    <path d="M532 376 V406"/>
  </g>
  <g class="t l">
    <text x="339" y="228" text-anchor="middle" class="m">POST /mcp</text>
    <text x="339" y="252" text-anchor="middle">bearer</text>
    <text x="795" y="204" text-anchor="middle">describe, list</text>
    <text x="795" y="336" text-anchor="middle">get, list</text>
    <text x="544" y="396">read and patch, never AWS directly</text>
  </g>
</svg>
