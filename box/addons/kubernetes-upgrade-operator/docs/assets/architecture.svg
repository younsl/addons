  <text x="40" y="56" class="t h">kubernetes-upgrade-operator</text>
  <text x="40" y="80" class="t s">One hub cluster upgrades EKS clusters across accounts through STS AssumeRole</text>

  <rect x="40" y="150" width="436" height="270" rx="10" class="bound"/>
  <text x="56" y="172" class="t l">Hub account</text>

  <rect x="64" y="190" width="232" height="206" rx="8" class="card"/>
