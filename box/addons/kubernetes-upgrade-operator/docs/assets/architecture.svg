  <rect x="88" y="226" width="184" height="56" rx="6" class="card"/>
  <text x="180" y="250" text-anchor="middle" class="m n">EKSUpgrade</text>
  <text x="180" y="268" text-anchor="middle" class="t d">one per target cluster</text>

  <rect x="88" y="308" width="184" height="64" rx="6" class="hi"/>
  <text x="180" y="336" text-anchor="middle" class="m n">kuo</text>
  <text x="180" y="354" text-anchor="middle" class="t d">operator pod</text>

  <rect x="332" y="304" width="124" height="72" rx="6" class="card"/>
  <text x="394" y="332" text-anchor="middle" class="t n">Hub role</text>
  <text x="394" y="350" text-anchor="middle" class="t d">IRSA or</text>
  <text x="394" y="364" text-anchor="middle" class="t d">Pod Identity</text>

  <text x="40" y="450" class="t l">The hub role also upgrades the hub cluster itself.</text>

