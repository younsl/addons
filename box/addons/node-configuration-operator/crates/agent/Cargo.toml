[package]
name = "node-configuration-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent of node-configuration-operator that keeps the OS configuration of its node in line with NodeConfiguration custom resources"
readme.workspace = true
repository.workspace = true

[[bin]]
name = "node-configuration-agent"
path = "src/main.rs"
doc = false

[dependencies]
node-configuration-common.workspace = true

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util.workspace = true
futures.workspace = true

kube = { workspace = true, features = ["runtime"] }
k8s-openapi.workspace = true

serde_json.workspace = true

chrono.workspace = true
clap.workspace = true
regex.workspace = true

anyhow.workspace = true
thiserror.workspace = true

tracing.workspace = true

prometheus-client.workspace = true

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
rustls.workspace = true

[lints]
workspace = true
