apiVersion: node-configuration-operator.sh/v1alpha1
kind: NodeConfiguration
metadata:
  name: os-hardening
spec:
  intervalSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      cordon: true
  minReadySeconds: 30
  rules:
    - name: restrict-shell-profiles
      fileMode:
        paths:
          - /home/ec2-user/.bash*
          - /home/ssm-user/.bash*
          - /root/.bash*
          - /root/.cshrc
        mode: "0640"
    - name: drop-setuid
      fileMode:
        paths:
          - /usr/bin/newgrp
          - /usr/sbin/unix_chkpwd
        clear: "4000"
    - name: disable-system-logins
      loginShell:
        users: [sync, shutdown, halt]
        shell: /sbin/nologin
    - name: deny-root-login
      lineEdit:
        path: /etc/ssh/sshd_config
        pattern: '^#?PermitRootLogin .*'
        replacement: PermitRootLogin no
    - name: restrict-compilers
      fileMode:
        paths:
          - /usr/bin/gcc
          - /usr/bin/cc
        clear: "0001"
    - name: restrict-su
      fileMode:
        paths:
          - /usr/bin/su
        mode: "4750"
    - name: require-wheel-for-su
      lineEdit:
        path: /etc/pam.d/su
        pattern: '^#(auth\s*required\s*pam_wheel.so use_uid)'
        replacement: $1
    - name: login-banner
      file:
        path: /etc/issue.net
        content: |
          WARNING: Authorized users only. All activities are monitored and recorded.
    - name: motd
      file:
        path: /etc/motd
        content: |
          WARNING: Authorized users only. All activities are monitored and recorded.
    - name: ssh-banner
      lineEdit:
        path: /etc/ssh/sshd_config
        pattern: '^#?Banner .*'
        replacement: Banner /etc/issue.net
