# -- (string) Overrides the chart name used in resource names and the app.kubernetes.io/name label
nameOverride: ""
# -- (string) Overrides the full generated resource name
fullnameOverride: ""

crds:
  # -- (bool) Whether to install CRDs. Set to false if CRDs are managed externally.
  install: true
  # -- (bool) Whether to keep CRDs on chart uninstall.
  keep: true
  # -- (object) Annotations to add to the CRD resources.
  annotations: {}
  # -- (object) Additional labels to add to the CRD resources.
  additionalLabels: {}

# -- (int) Number of controller replicas to run. Above 1 requires `leaderElection.enabled`, and the replicas beyond the leader stand by.
replicaCount: 1

leaderElection:
  # -- (bool) Whether a controller replica acts only while it holds a Lease in the release namespace. One replica keeps it on so that two pods never act at once during a rolling update.
  enabled: true
  # -- (int) Seconds a standby waits on a Lease that is not renewed before it takes over.
  leaseDurationSeconds: 15
  # -- (int) Seconds the leader keeps trying to renew the Lease before it steps down. Must be below `leaseDurationSeconds`.
  renewDeadlineSeconds: 10
  # -- (int) Seconds between two attempts to take or renew the Lease. Must be below `renewDeadlineSeconds`.
  retryPeriodSeconds: 2

podDisruptionBudget:
  # -- (bool) Whether to create a PodDisruptionBudget for the controller pods. Leave it off with one replica, or a node drain waits on it.
  enabled: false
  # -- (int/string) Controller pods that must stay available during a voluntary disruption, as a count or a percentage. When set it replaces `maxUnavailable`.
  minAvailable: ""
  # -- (int/string) Controller pods that may be unavailable during a voluntary disruption, as a count or a percentage.
  maxUnavailable: 1
  # -- (string) `IfHealthyBudget` evicts an unhealthy pod only while the budget is met. `AlwaysAllow` always evicts it. Empty leaves it unset.
  unhealthyPodEvictionPolicy: IfHealthyBudget

# -- (int) Number of old ReplicaSets and DaemonSet revisions to retain for rollback.
revisionHistoryLimit: 5

image:
  # -- (string) Container image registry host, prefixed to `repository`. Set empty when `repository` carries the full path.
  registry: ghcr.io
  # -- (string) Container image repository path without registry prefix. The controller and the agent run the same image.
  repository: younsl/node-configuration-operator
  # -- (string) Image pull policy of the controller and the agent pods.
  pullPolicy: IfNotPresent
  # -- (string) Image tag. Defaults to `.Chart.AppVersion` if empty.
  tag: ""
  # -- (string) Image digest (`sha256:...`). When set, appended to the tag as `tag@digest` and takes precedence.
  digest: ""

# -- (list) Image pull secrets of the controller and the agent pods.
imagePullSecrets: []

serviceAccount:
  # -- (bool) Whether to create the controller ServiceAccount.
  create: true
  # -- (object) Annotations to add to the controller ServiceAccount.
  annotations: {}
  # -- (string) Controller ServiceAccount name. Defaults to the fullname template if empty.
  name: ""
  # -- (list) Image pull secrets attached to the controller ServiceAccount, used by every pod that runs as it.
  imagePullSecrets: []

resources:
  limits:
    # -- (string) Memory limit of the controller.
    memory: 64Mi
  requests:
    # -- (string) CPU request of the controller.
    cpu: 10m
    # -- (string) Memory request of the controller.
    memory: 32Mi

# -- (object) Container security context of the controller.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- (string) Pod priority class name of the controller. Empty uses the Kubernetes default.
priorityClassName: ""

# -- (object) Annotations to add to the controller pod.
podAnnotations: {}
# -- (object) Node selector for controller pod scheduling.
nodeSelector: {}
# -- (list) Tolerations for controller pod scheduling.
tolerations: []
# -- (object) Affinity rules for controller pod scheduling.
affinity: {}
# -- (list) Topology spread constraints of the controller pods. Spreading the replicas keeps one node or zone loss from taking the leader and every standby at once.
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: node-configuration-operator
# -- (object) Extra Pod spec fields of the controller, e.g. runtimeClassName. Fields the chart already renders are rejected.
extraPodSpec: {}

logging:
  # -- (string) Log level of the controller and the agent pods: trace, debug, info, warn, error. `RUST_LOG` on the pod overrides it.
  level: info
  # -- (string) Log format: json or text
  format: json

agent:
  serviceAccount:
    # -- (bool) Whether to create the ServiceAccount the agent pods run as.
    create: true
    # -- (object) Annotations to add to the agent ServiceAccount.
    annotations: {}
    # -- (string) Agent ServiceAccount name. Defaults to the fullname template with an `-agent` suffix if empty.
    name: ""
    # -- (list) Image pull secrets attached to the agent ServiceAccount, used by every pod that runs as it.
    imagePullSecrets: []
  resources:
    limits:
      # -- (string) Memory limit of the agent.
      memory: 64Mi
    requests:
      # -- (string) CPU request of the agent.
      cpu: 10m
      # -- (string) Memory request of the agent.
      memory: 16Mi
  # -- (bool) Whether rules with a `script` action may run. It makes the agent pod privileged with the host PID namespace and replaces `agent.securityContext`, because a script runs as root in the host root filesystem. Left off, a script rule fails and every other rule still runs.
  allowScripts: false
  # -- (list) In-place resize policy of the agent container. The default resizes CPU without a restart and restarts the container on a memory resize.
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: RestartContainer
  # -- (object) Container security context of the agent, unused when `agent.allowScripts` is on. It writes host files as root, and the three capabilities cover modes and owners of files that belong to other accounts.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
    seccompProfile:
      type: RuntimeDefault
  # -- (object) Update strategy of the agent DaemonSet itself, used when the image, these settings, or the set of targeted nodes changes. Rule changes roll out per NodeConfiguration instead.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  # -- (string) Pod priority class name of the agent. Empty uses the Kubernetes default.
  priorityClassName: ""
  # -- (object) Annotations to add to the agent pods.
  podAnnotations: {}
  # -- (object) Node selector of the agent pods, on top of the node affinity the controller adds.
  nodeSelector: {}
  # -- (object) Extra affinity of the agent pods. The controller sets the required node affinity from the targets of the NodeConfiguration resources and replaces one given here.
  affinity: {}
  # -- (list) Tolerations of the agent pods. The default tolerates every taint so a tainted node is still configured.
  tolerations:
    - operator: Exists
  # -- (object) Extra Pod spec fields of the agent, e.g. runtimeClassName. Fields the chart already renders are rejected.
  extraPodSpec: {}

# -- (list) NodeConfiguration custom resources to create. One agent pod per node applies all of them, and a change of the rules of one rolls out under its own strategy.
