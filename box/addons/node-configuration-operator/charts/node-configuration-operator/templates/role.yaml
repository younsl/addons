apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "node-configuration-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-configuration-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "node-configuration-operator.agentTemplateName" . | quote }}]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: [{{ include "node-configuration-operator.agentName" . | quote }}]
    verbs: ["get", "patch", "delete"]
  {{- if .Values.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ include "node-configuration-operator.fullname" . | quote }}]
    verbs: ["get", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "node-configuration-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-configuration-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "node-configuration-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "node-configuration-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
