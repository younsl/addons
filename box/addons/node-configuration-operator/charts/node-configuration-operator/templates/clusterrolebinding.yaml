apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "node-configuration-operator.fullname" . }}
  labels:
    {{- include "node-configuration-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "node-configuration-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "node-configuration-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "node-configuration-operator.agentName" . }}
  labels:
    {{- include "node-configuration-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "node-configuration-operator.agentName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "node-configuration-operator.agentServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
