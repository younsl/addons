                          nullable: true
                          pattern: ^[0-7]{3,4}$
                          type: string
                        mode:
                          description: The exact octal mode to set, such as `0640` or `4750`.
                          nullable: true
                          pattern: ^[0-7]{3,4}$
                          type: string
                        paths:
