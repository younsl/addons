            properties:
              dryRun:
                default: false
                description: Reports what a run would change without writing to the node. A change shows up as the outcome `pending`, and the node still counts as configured.
                type: boolean
              group:
                description: Names a set of `NodeConfiguration` resources that apply in order on a node, for example `os-vulnerability-hardening`. Without a group the resource runs independently of every other one.
