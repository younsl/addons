                description: Seconds between two runs on a node, which bounds how long a drift survives.
                format: uint32
                maximum: 86400.0
                minimum: 30.0
                type: integer
              minReadySeconds:
                default: 0
                description: Seconds a node must stay configured before the rollout moves on.
                format: uint32
                maximum: 3600.0
                minimum: 0.0
                type: integer
              paused:
                default: false
                description: Holds a new revision back. The nodes keep reapplying the revision they already run until the rollout is resumed, and a node that joins meanwhile gets that same revision.
                type: boolean
              priority:
                default: 0
                description: Order inside the group. A node runs the resource with the highest priority first, and runs a lower one only after every higher one of the group is configured on that node. Resources of equal priority do not wait for each other.
                format: int32
                maximum: 1000000.0
