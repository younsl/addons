apiVersion: v2
name: node-configuration-operator
description: Continuously reconciles the OS configuration of EKS managed node group nodes from NodeConfiguration custom resources
type: application
deprecated: false
version: 0.3.0
appVersion: "0.3.0"
home: https://github.com/younsl/addons
sources:
  - https://github.com/younsl/addons/tree/main/box/addons/node-configuration-operator
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - eks
  - kubernetes
  - node
  - hardening
  - operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "failurePolicy (Fail or Ignore) on the rules of NodeConfiguration and NodeConfigurationBinding, and in the values schema of nodeConfigurations"
    - kind: added
      description: "agent.podMonitor values, a PodMonitor for the agent pods that the controller creates and removes with the agent DaemonSet, with the Role rules for it"
    - kind: changed
      description: "The agent runs its own image, node-configuration-agent, selected by the new agent.image values"
    - kind: changed
      description: "The controller and agent containers no longer pass a subcommand"
    - kind: changed
      description: "App version 0.3.0"
