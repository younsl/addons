[package]
name = "node-configuration-operator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Controller that rolls NodeConfiguration custom resources out to EKS managed node group nodes"
readme.workspace = true
repository.workspace = true
default-run = "node-configuration-operator"

[lib]
name = "node_configuration_operator"
path = "src/lib.rs"

[[bin]]
name = "node-configuration-operator"
path = "src/main.rs"
doc = false

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
doc = false

[dependencies]
node-configuration-common.workspace = true

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util.workspace = true
futures.workspace = true

kube = { workspace = true, features = ["runtime"] }
k8s-openapi.workspace = true

serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

chrono.workspace = true
clap.workspace = true

anyhow.workspace = true
thiserror.workspace = true

tracing.workspace = true

prometheus-client.workspace = true

[dev-dependencies]
wiremock.workspace = true
rustls.workspace = true

[lints]
workspace = true
