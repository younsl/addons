[package]
name = "node-configuration-operator"
version = "0.3.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Controller that rolls NodeConfiguration custom resources out to EKS managed node group nodes"
readme = "../README.md"
repository = "https://github.com/younsl/addons"
default-run = "node-configuration-operator"

[lib]
name = "node_configuration_operator"
path = "src/lib.rs"

[[bin]]
name = "node-configuration-operator"
path = "src/main.rs"
doc = false

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
doc = false

[dependencies]
node-configuration-common = { path = "../common" }

tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7.20"
futures = { version = "0.3.34", default-features = false, features = ["std"] }

kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32", "schemars"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"

chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }

anyhow = "1.0.104"
thiserror = "2.0.21"

tracing = "0.1.44"

prometheus-client = "0.23.1"

[dev-dependencies]
wiremock = "0.6.5"
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Internal library shared by the binaries, not a published API
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_long_first_doc_paragraph = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
