<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 620" width="1248" height="620" role="img">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#fff;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#a1a1a1;font-size:11px}
    .l{fill:#737373;font-size:11px}
    .a{fill:#0070f3;font-size:11px;font-weight:500}
    .card{fill:#0a0a0a;stroke:#333;stroke-width:1}
    .hi{fill:#0a0a0a;stroke:#ededed;stroke-width:1}
    .acc{fill:#0a0a0a;stroke:#0070f3;stroke-width:1}
    .bound{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 4}
    .edge{stroke:#737373;stroke-width:1;fill:none}
    .dash{stroke:#737373;stroke-width:1;fill:none;stroke-dasharray:4 3}
    .aedge{stroke:#0070f3;stroke-width:1;fill:none}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1a1"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0070f3"/></marker>
  </defs>
  <rect width="1248" height="620" fill="#000"/>
  <text x="40" y="52" class="t h">The agent blocklists the inode the kernel executed, so the next exec is denied before it runs</text>
  <text x="40" y="76" class="t s">Offsets come from the running kernel at load time. The LSM hook hands its (dev, ino) to the exec event through an LRU map.</text>
  <rect x="40" y="120" width="260" height="88" rx="8" class="card"/>
  <text x="56" y="146" class="t n">Agent at load</text>
  <text x="56" y="166" class="t d">BTF + tracefs formats</text>
  <text x="56" y="183" class="t d">into read-only globals</text>
  <rect x="40" y="248" width="260" height="88" rx="8" class="card"/>
  <text x="56" y="274" class="m n">execve()</text>
  <text x="56" y="294" class="t d">any process on the node</text>
  <rect x="360" y="248" width="300" height="120" rx="8" class="acc"/>
  <text x="376" y="274" class="m n">lsm/bprm_check_security</text>
  <text x="376" y="294" class="m d">bprm-&gt;file-&gt;f_inode</text>
  <text x="376" y="311" class="t d">(dev, ino) into PENDING LRU</text>
  <text x="376" y="328" class="t d">deny if in BLOCKLIST and enforce</text>
  <rect x="360" y="432" width="300" height="120" rx="8" class="card"/>
  <text x="376" y="458" class="m n">tp/sched/sched_process_exec</text>
  <text x="376" y="478" class="t d">ppid, uid, cgroup, comm, filename</text>
  <text x="376" y="495" class="t d">argv up to 511 bytes, never env</text>
  <text x="376" y="512" class="t d">(dev, ino) taken from PENDING</text>
  <rect x="720" y="432" width="220" height="120" rx="8" class="card"/>
  <text x="736" y="458" class="t n">Ring buffer</text>
  <text x="736" y="478" class="t d">1 MiB, shared by</text>
  <text x="736" y="495" class="t d">exec, exit, connect, block</text>
  <rect x="988" y="248" width="220" height="304" rx="8" class="hi"/>
  <text x="1004" y="274" class="t n">ward agent</text>
  <text x="1004" y="294" class="t d">behavior rules</text>
  <text x="1004" y="311" class="t d">on-exec scan</text>
  <text x="1004" y="328" class="t d">Protect mode:</text>
  <text x="1004" y="345" class="t d">kill, quarantine,</text>
  <text x="1004" y="362" class="t d">BLOCKLIST insert</text>
  <text x="1004" y="379" class="t d"></text>
  <text x="1004" y="396" class="t d">drops its own tgid</text>
  <text x="1004" y="413" class="t d">through CONFIG</text>
  <rect x="720" y="120" width="220" height="88" rx="8" class="card"/>
  <text x="736" y="146" class="t n">Maps</text>
  <text x="736" y="166" class="m d">BLOCKLIST hash</text>
  <text x="736" y="183" class="m d">CONFIG array, PENDING LRU</text>
  <path d="M300 292 L360 292" class="edge" marker-end="url(#ah)"/>
  <path d="M510 368 L510 432" class="edge" marker-end="url(#ah)"/>
  <text x="520" y="404" class="t l" text-anchor="start">exec proceeds</text>
  <path d="M660 492 L720 492" class="edge" marker-end="url(#ah)"/>
  <path d="M940 492 L988 492" class="edge" marker-end="url(#ah)"/>
  <path d="M1098 248 L1098 164 L940 164" class="aedge" marker-end="url(#aa)"/>
  <text x="1108" y="200" class="t a" text-anchor="start">exact kernel (dev, ino)</text>
  <path d="M720 180 L600 180 L600 248" class="aedge" marker-end="url(#aa)"/>
  <path d="M170 208 L170 230 L330 230 L330 160 L720 160" class="dash"/>
  <text x="40" y="590" class="t d" text-anchor="start">Fallback chain: ebpf-lsm, then ebpf (no exec blocking), then procfs polling (may miss short-lived processes).</text>
</svg>
