<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 660" width="1248" height="660" role="img">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#fff;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#a1a1a1;font-size:11px}
    .l{fill:#737373;font-size:11px}
    .a{fill:#0070f3;font-size:11px;font-weight:500}
    .card{fill:#0a0a0a;stroke:#333;stroke-width:1}
    .hi{fill:#0a0a0a;stroke:#ededed;stroke-width:1}
    .acc{fill:#0a0a0a;stroke:#0070f3;stroke-width:1}
    .bound{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 4}
    .edge{stroke:#737373;stroke-width:1;fill:none}
    .dash{stroke:#737373;stroke-width:1;fill:none;stroke-dasharray:4 3}
    .aedge{stroke:#0070f3;stroke-width:1;fill:none}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1a1"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0070f3"/></marker>
  </defs>
  <rect width="1248" height="660" fill="#000"/>
  <text x="40" y="52" class="t h">The operator is always the control plane, the manager is an optional hub</text>
  <text x="40" y="76" class="t s">One Ward object puts an eBPF agent on every node. Turning the manager on adds a feed relay, a detection store, and mTLS.</text>
  <rect x="40" y="120" width="300" height="72" rx="8" class="card"/>
  <text x="56" y="146" class="t n">OCI registry</text>
  <text x="56" y="166" class="m d">ghcr.io/younsl/ward-db</text>
  <rect x="40" y="236" width="300" height="104" rx="8" class="acc"/>
  <text x="56" y="262" class="t n">ward operator</text>
  <text x="56" y="282" class="t d">Deployment, Lease leader election</text>
  <text x="56" y="299" class="t d">compiles policy, verifies the feed,</text>
  <text x="56" y="316" class="t d">plans the ring rollout</text>
  <rect x="40" y="384" width="300" height="72" rx="8" class="card"/>
  <text x="56" y="410" class="t n">Ward + WardSignature</text>
  <text x="56" y="430" class="t d">policy, indicators, custom rules</text>
  <rect x="40" y="500" width="300" height="112" rx="8" class="card"/>
  <text x="56" y="526" class="t n">Operator outputs</text>
  <text x="56" y="546" class="m d">ConfigMap &lt;name&gt;-policy</text>
  <text x="56" y="563" class="m d">ConfigMap &lt;name&gt;-rollout</text>
  <text x="56" y="580" class="m d">reads Lease ward-&lt;node&gt;</text>
  <path d="M190 192 L190 236" class="edge" marker-end="url(#ah)"/>
  <text x="200" y="218" class="t l" text-anchor="start">digest + signature</text>
  <path d="M190 384 L190 340" class="edge" marker-end="url(#ah)"/>
  <path d="M340 300 L380 300 L380 556 L346 556" class="aedge" marker-end="url(#aa)"/>
  <rect x="420" y="120" width="380" height="492" rx="10" class="bound"/>
  <text x="436" y="142" class="t l">spec.manager.enabled: true</text>
  <rect x="440" y="156" width="340" height="104" rx="8" class="hi"/>
  <text x="456" y="182" class="t n">ward manager</text>
  <text x="456" y="202" class="t d">StatefulSet + PersistentVolumeClaim</text>
  <text x="456" y="219" class="t d">feed relay, detection store</text>
  <text x="456" y="236" class="t d">query API :8080, metrics :8081</text>
  <rect x="440" y="336" width="340" height="104" rx="8" class="hi"/>
  <text x="456" y="362" class="t n">ward agent</text>
  <text x="456" y="382" class="t d">DaemonSet, eBPF probes on every node</text>
  <text x="456" y="399" class="t d">reads policy and rollout ConfigMaps</text>
  <text x="456" y="416" class="t d">mTLS :8443 to the manager</text>
  <path d="M570 260 L570 336" class="edge" marker-end="url(#ah)"/>
  <text x="560" y="296" class="t l" text-anchor="end">content, no node egress</text>
  <path d="M650 336 L650 260" class="edge" marker-end="url(#ah)"/>
  <text x="660" y="312" class="t l" text-anchor="start">detections</text>
  <rect x="440" y="480" width="340" height="112" rx="8" class="card"/>
  <text x="456" y="506" class="t n">Leaves the node as</text>
  <text x="456" y="526" class="t d">stdout JSON, top-level detection</text>
  <text x="456" y="543" class="t d">Event ThreatDetected or ExecBlocked</text>
  <text x="456" y="560" class="t d">Lease ward-&lt;node&gt;, and the manager</text>
  <rect x="828" y="120" width="380" height="492" rx="10" class="bound"/>
  <text x="844" y="142" class="t l">spec.manager.enabled: false</text>
  <rect x="848" y="156" width="340" height="104" rx="8" class="card"/>
  <text x="864" y="182" class="t n">OCI registry</text>
  <text x="864" y="202" class="m d">ghcr.io/younsl/ward-db</text>
  <text x="864" y="219" class="t d">pull secret mounted into agents</text>
  <text x="864" y="236" class="t d">every node needs registry egress</text>
  <rect x="848" y="336" width="340" height="104" rx="8" class="hi"/>
  <text x="864" y="362" class="t n">ward agent</text>
  <text x="864" y="382" class="t d">DaemonSet, eBPF probes on every node</text>
  <text x="864" y="399" class="t d">reads policy and rollout ConfigMaps</text>
  <text x="864" y="416" class="t d">verifies the digest it was assigned</text>
  <path d="M1018 260 L1018 336" class="edge" marker-end="url(#ah)"/>
  <text x="1028" y="302" class="t l" text-anchor="start">pulls the assigned revision</text>
  <rect x="848" y="480" width="340" height="112" rx="8" class="card"/>
  <text x="864" y="506" class="t n">Leaves the node as</text>
  <text x="864" y="526" class="t d">stdout JSON, top-level detection</text>
  <text x="864" y="543" class="t d">Event ThreatDetected or ExecBlocked</text>
  <text x="864" y="560" class="t d">Lease ward-&lt;node&gt; only</text>
</svg>
