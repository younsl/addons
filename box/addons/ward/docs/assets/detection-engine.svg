<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 620" width="1248" height="620" role="img">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#fff;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#a1a1a1;font-size:11px}
    .l{fill:#737373;font-size:11px}
    .a{fill:#0070f3;font-size:11px;font-weight:500}
    .card{fill:#0a0a0a;stroke:#333;stroke-width:1}
    .hi{fill:#0a0a0a;stroke:#ededed;stroke-width:1}
    .acc{fill:#0a0a0a;stroke:#0070f3;stroke-width:1}
    .bound{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 4}
    .edge{stroke:#737373;stroke-width:1;fill:none}
    .dash{stroke:#737373;stroke-width:1;fill:none;stroke-dasharray:4 3}
    .aedge{stroke:#0070f3;stroke-width:1;fill:none}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1a1"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0070f3"/></marker>
  </defs>
  <rect width="1248" height="620" fill="#000"/>
  <text x="40" y="52" class="t h">An allow indicator always wins, otherwise the most severe match decides</text>
  <text x="40" y="76" class="t s">Every source is searched for the same file, and severity, not the source, picks the detection.</text>
  <rect x="40" y="120" width="220" height="88" rx="8" class="card"/>
  <text x="56" y="146" class="t n">File or executable</text>
  <text x="56" y="166" class="t d">on exec or full scan</text>
  <rect x="40" y="248" width="220" height="88" rx="8" class="card"/>
  <text x="56" y="274" class="t n">Scan cache</text>
  <text x="56" y="294" class="t d">dev, ino, size, mtime</text>
  <text x="56" y="311" class="t d">skips unchanged files</text>
  <rect x="320" y="184" width="220" height="88" rx="8" class="acc"/>
  <text x="336" y="210" class="t n">allow indicator?</text>
  <text x="336" y="230" class="t d">yes: clean, stop</text>
  <rect x="320" y="312" width="220" height="88" rx="8" class="card"/>
  <text x="336" y="338" class="t n">block indicator?</text>
  <text x="336" y="358" class="t d">yes: detection, stop</text>
  <path d="M150 208 L150 248" class="edge" marker-end="url(#ah)"/>
  <path d="M260 292 L290 292 L290 228 L320 228" class="edge" marker-end="url(#ah)"/>
  <path d="M430 272 L430 312" class="edge" marker-end="url(#ah)"/>
  <text x="440" y="296" class="t l" text-anchor="start">no</text>
  <rect x="600" y="120" width="360" height="400" rx="10" class="bound"/>
  <text x="616" y="142" class="t l">Matched in parallel</text>
  <rect x="620" y="152" width="320" height="64" rx="8" class="card"/>
  <text x="636" y="178" class="t n">Built-in patterns</text>
  <text x="636" y="198" class="t d">EICAR, miners, web shells</text>
  <rect x="620" y="236" width="320" height="64" rx="8" class="card"/>
  <text x="636" y="262" class="t n">WardSignature</text>
  <text x="636" y="282" class="t d">hashes, strings, hex, YARA</text>
  <rect x="620" y="320" width="320" height="80" rx="8" class="card"/>
  <text x="636" y="346" class="t n">Feed hash index</text>
  <text x="636" y="366" class="t d">bloom filter in memory, 10 bits, 7 hashes</text>
  <text x="636" y="383" class="t d">sorted 34-byte records on disk</text>
  <rect x="620" y="420" width="320" height="80" rx="8" class="card"/>
  <text x="636" y="446" class="t n">YARA-X</text>
  <text x="636" y="466" class="t d">one scanner reused per full scan</text>
  <text x="636" y="483" class="t d">10 s timeout per file</text>
  <path d="M540 356 L600 356" class="edge" marker-end="url(#ah)"/>
  <rect x="1008" y="280" width="200" height="104" rx="8" class="hi"/>
  <text x="1024" y="306" class="t n">Most severe match</text>
  <text x="1024" y="326" class="t d">Critical, High,</text>
  <text x="1024" y="343" class="t d">Medium, Low</text>
  <path d="M960 332 L1008 332" class="edge" marker-end="url(#ah)"/>
  <text x="40" y="572" class="t d" text-anchor="start">A new revision loads beside the old one, must catch EICAR, then swaps in. On failure the agent keeps its last known good revision.</text>
</svg>
