<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 600" width="1248" height="600" role="img">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#fff;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#a1a1a1;font-size:11px}
    .l{fill:#737373;font-size:11px}
    .a{fill:#0070f3;font-size:11px;font-weight:500}
    .card{fill:#0a0a0a;stroke:#333;stroke-width:1}
    .hi{fill:#0a0a0a;stroke:#ededed;stroke-width:1}
    .acc{fill:#0a0a0a;stroke:#0070f3;stroke-width:1}
    .bound{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:4 4}
    .edge{stroke:#737373;stroke-width:1;fill:none}
    .dash{stroke:#737373;stroke-width:1;fill:none;stroke-dasharray:4 3}
    .aedge{stroke:#0070f3;stroke-width:1;fill:none}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1a1"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0070f3"/></marker>
  </defs>
  <rect width="1248" height="600" fill="#000"/>
  <text x="40" y="52" class="t h">A new database reaches every node only after the canary ring survives the soak</text>
  <text x="40" y="76" class="t s">The operator verifies before anything ships, and a halted digest is never retried.</text>
  <rect x="40" y="140" width="200" height="104" rx="8" class="card"/>
  <text x="56" y="166" class="t n">Registry tag</text>
  <text x="56" y="186" class="t d">resolved to a digest</text>
  <text x="56" y="203" class="t d">every feed interval</text>
  <rect x="280" y="140" width="220" height="104" rx="8" class="hi"/>
  <text x="296" y="166" class="t n">Operator verifies</text>
  <text x="296" y="186" class="t d">layer digest</text>
  <text x="296" y="203" class="t d">ECDSA P-256 signature</text>
  <text x="296" y="220" class="t d">engine compile</text>
  <rect x="540" y="140" width="220" height="104" rx="8" class="card"/>
  <text x="556" y="166" class="t n">Canary ring</text>
  <text x="556" y="186" class="t d">ward.sh/ring=canary nodes</text>
  <text x="556" y="203" class="t d">plus canaryPercent by</text>
  <text x="556" y="220" class="t d">hash of node name</text>
  <rect x="800" y="140" width="180" height="104" rx="8" class="card"/>
  <text x="816" y="166" class="t n">Soak</text>
  <text x="816" y="186" class="t d">spec.feed.rollout.soak</text>
  <text x="816" y="203" class="t d">agents hot swap,</text>
  <text x="816" y="220" class="t d">no Pod restart</text>
  <rect x="1020" y="140" width="188" height="104" rx="8" class="acc"/>
  <text x="1036" y="166" class="t n">Promote</text>
  <text x="1036" y="186" class="t d">every node runs it,</text>
  <text x="1036" y="203" class="t d">it becomes stable</text>
  <path d="M240 192 L280 192" class="edge" marker-end="url(#ah)"/>
  <path d="M500 192 L540 192" class="edge" marker-end="url(#ah)"/>
  <path d="M760 192 L800 192" class="edge" marker-end="url(#ah)"/>
  <path d="M980 192 L1020 192" class="edge" marker-end="url(#ah)"/>
  <rect x="620" y="328" width="360" height="160" rx="8" class="card"/>
  <text x="636" y="354" class="t n">Halt when any gate fails</text>
  <text x="636" y="374" class="t d">load error on any canary agent</text>
  <text x="636" y="391" class="t d">canary rate per agent over the broad rate</text>
  <text x="636" y="408" class="t d">times maxDetectionRatio, above minDetections</text>
  <text x="636" y="425" class="t d">no convergence within 3 soaks</text>
  <path d="M890 244 L890 328" class="dash" marker-end="url(#ah)"/>
  <rect x="1020" y="360" width="188" height="96" rx="8" class="card"/>
  <text x="1036" y="386" class="t n">Halted</text>
  <text x="1036" y="406" class="t d">canary returns to stable</text>
  <text x="1036" y="423" class="t d">digest never retried</text>
  <path d="M980 408 L1020 408" class="edge" marker-end="url(#ah)"/>
  <text x="40" y="560" class="t d" text-anchor="start">Agents report their active revision and detection counters in their Lease ward-&lt;node&gt;. The operator reads the Leases to evaluate the gates.</text>
</svg>
