apiVersion: security.ward.sh/v1alpha1
kind: Ward
metadata:
  name: ward
  namespace: ward-system
spec:
  mode: Protect
  manager:
    # The manager relays the feed to agents, so nodes need no registry egress.
    enabled: true
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: dedicated
        operator: Equal
        value: system
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/system
                  operator: Exists
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: ward
            app.kubernetes.io/component: manager
    dnsPolicy: ClusterFirst
    dnsConfig:
      options:
        - name: ndots
          value: "2"
  feed:
    # Pin a revision with ghcr.io/younsl/ward-db@sha256:<digest>
    image: ghcr.io/younsl/ward-db:latest
    # Signed keyless in CI: Fulcio certificate for this workflow, logged in Rekor.
    keyless:
      issuer: https://token.actions.githubusercontent.com
      identity: https://github.com/younsl/addons/.github/workflows/ward-db.yml@refs/heads/main
    interval: 6h
    rollout:
      canaryPercent: 10
      soak: 1h
      maxDetectionRatio: 5
      minDetections: 20
