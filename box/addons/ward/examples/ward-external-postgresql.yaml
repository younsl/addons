apiVersion: security.ward.sh/v1alpha1
kind: Ward
metadata:
  name: ward
  namespace: ward-system
spec:
  mode: Detect
  manager:
    enabled: true
  # Keep detections in an existing PostgreSQL server over verified TLS.
  postgresql:
    enabled: true
    external:
      host: postgresql.example.com
      port: 5432
      database: ward
      username: ward
      passwordSecretRef:
        name: ward-postgresql
        key: password
      sslMode: VerifyFull
      caSecretRef:
        name: ward-postgresql-ca
        key: ca.crt
