apiVersion: v1
kind: Secret
metadata:
  name: ward-db-pull
  namespace: ward-system
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"auth":"${BASE64_USER_COLON_TOKEN}"}}}
---
apiVersion: security.ward.sh/v1alpha1
kind: Ward
metadata:
  name: ward
  namespace: ward-system
spec:
  mode: Detect
  manager:
    # No manager: agents pull the feed from the registry themselves and
    # report detections through stdout JSON and Kubernetes Events only.
    enabled: false
  feed:
    image: ghcr.io/younsl/ward-db:latest
    publicKey: |
      -----BEGIN PUBLIC KEY-----
      ${COSIGN_PUBLIC_KEY}
      -----END PUBLIC KEY-----
    pullSecretRef:
      name: ward-db-pull
