# -- (string) Override the chart name
nameOverride: ""
# -- (string) Override the fully qualified release name
fullnameOverride: ""

image:
  # -- (string) Container image registry host
  registry: ghcr.io
  # -- (string) Container image repository path without registry prefix
  repository: younsl/ward
  # -- (string) Image tag, defaults to appVersion
  tag: ""
  # -- (string) Image digest (`sha256:...`), takes precedence over tag
  digest: ""
  # -- (string) Image pull policy, also passed to the workloads the operator creates
  pullPolicy: IfNotPresent

# -- (list) Image pull secrets for private registries
imagePullSecrets: []

# -- (int) Operator replicas. Above 1 enables Lease leader election and a PodDisruptionBudget
replicaCount: 1

# -- (int) Number of old ReplicaSets to retain for rollback
revisionHistoryLimit: 3

crds:
  # -- (bool) Install and upgrade the Ward and WardSignature CRDs
  install: true
  # -- (bool) Keep the CRDs on `helm uninstall`
  keep: true
  # -- (object) Extra CRD annotations
  annotations: {}
  # -- (object) Extra CRD labels
  additionalLabels: {}

operator:
  # -- (list) Image prefixes a Ward's `spec.image` may use, empty allows only this chart's image repository
  allowedImagePrefixes: []
  # -- (bool) Honor `spec.agent.privileged`, otherwise such a Ward is refused
  allowPrivilegedAgent: false
  # -- (bool) Honor `spec.postgresql.external.sslMode: Disable`, otherwise such a Ward is refused
  allowPostgresqlPlaintext: false
  # -- (string) Image of the embedded PostgreSQL server a Ward deploys with `spec.postgresql`. A Ward may override it only within `allowedImagePrefixes`
  postgresqlImage: "docker.io/library/postgres:18.6-alpine3.24"
  # -- (string) `debug`, `info`, `warn`, or `error`
  logLevel: "info"
  # -- (string) `json` or `text`
  logFormat: "json"

ward:
  # -- (bool) Render a Ward object from `ward.spec`
  create: false
  # -- (string) Ward object name
  name: ward
  # -- (object) Extra Ward object labels
  labels: {}
  # -- (object) Extra Ward object annotations
  annotations: {}
  # -- (object) Ward spec, see examples/ward.yaml
  spec: {}
    # mode: Detect
    # agent:
    #   eventSource: Auto

# -- (list) Extra container env (EnvVar entries)
extraEnv: []
  # - name: HTTPS_PROXY
  #   value: http://proxy.example.com:3128

# -- (list) Extra container envFrom sources
extraEnvFrom: []

ports:
  # -- (int) Health and metrics port (/healthz, /readyz, /metrics)
  http: 8081

rbac:
  # -- (bool) Create RBAC resources
  create: true

serviceAccount:
  # -- (bool) Create a ServiceAccount
  create: true
  # -- (string) ServiceAccount name, defaults to the fullname
  name: ""
  # -- (object) ServiceAccount annotations
  annotations: {}
  # -- (bool) Automount the ServiceAccount token
  automountServiceAccountToken: true
  # -- (list) Image pull secrets on the ServiceAccount
  imagePullSecrets: []

service:
  # -- (bool) Create a Service for health and metrics
  enabled: true
  # -- (string) Service type
  type: ClusterIP
  # -- (string) Traffic distribution, e.g. PreferClose, empty omits
  trafficDistribution: ""

podMonitor:
  # -- (bool) Create a PodMonitor for the manager and agent Pods of every Ward
  enabled: false
  # -- (string) Scrape interval
  interval: 30s
  # -- (string) Scrape timeout
  scrapeTimeout: 10s
  # -- (object) Extra PodMonitor labels
  labels: {}

wardNamespacePolicy:
  # -- (bool) Deny Ward objects outside the release namespace, needs ValidatingAdmissionPolicy (1.30+)
  enabled: true

leaseAdmissionPolicy:
  # -- (bool) Deny an agent writing any Lease but `ward-<own node>`, needs ValidatingAdmissionPolicy (1.30+)
  enabled: true

serviceMonitor:
  # -- (bool) Create a ServiceMonitor for the operator
  enabled: false
  # -- (string) Scrape interval
  interval: 30s
  # -- (string) Scrape timeout
  scrapeTimeout: 10s
  # -- (object) Extra ServiceMonitor labels
  labels: {}

# -- (object) Operator Pod resources
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

# -- (list) Container resize policy, empty omits
resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: NotRequired

# -- (object) Extra Pod annotations
podAnnotations: {}
# -- (object) Extra Pod labels
podLabels: {}

# -- (object) Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- (object) Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- (string) PriorityClass name, empty omits
priorityClassName: ""
# -- (object) Node selector
nodeSelector: {}
# -- (list) Tolerations
tolerations: []
# -- (object) Affinity
affinity: {}

# -- (list) Extra manifests rendered verbatim
extraObjects: []
