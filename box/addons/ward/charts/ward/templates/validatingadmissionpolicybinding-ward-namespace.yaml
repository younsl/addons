{{- if and .Values.wardNamespacePolicy.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicyBinding") -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "ward.fullname" . }}-namespace
  labels:
    {{- include "ward.labels" . | nindent 4 }}
spec:
  policyName: {{ include "ward.fullname" . }}-namespace
  validationActions:
    - Deny
{{- end }}
