{{- if .Values.crds.install }}
{{- /*
  Generated by `make crd` from WardSignatureSpec. Do not edit:
  change the Rust type and regenerate.

  This sits in templates/ rather than crds/ because Helm never upgrades anything
  in crds/. A schema change there would silently not apply, and this chart is
  installed through Argo CD, where that failure is invisible.
*/}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wardsignatures.security.ward.sh
  labels:
    {{- include "ward.labels" . | nindent 4 }}
    {{- with .Values.crds.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.crds.keep .Values.crds.annotations }}
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  group: security.ward.sh
  names:
    kind: WardSignature
    plural: wardsignatures
    shortNames:
    - wsig
    singular: wardsignature
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.signatures
      name: Signatures
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Custom signatures and YARA rules merged into every Ward in the same namespace.
        properties:
          spec:
            description: Custom signatures and YARA rules for the `Ward` in the same namespace.
            properties:
              signatures:
                items:
                  description: One signature. A file matches when its hash is listed, or when its patterns (`strings` and `hex`) satisfy `condition`.
                  properties:
                    condition:
                      default: All
                      description: Whether `All` patterns or `Any` one of them must match.
                      enum:
                      - All
                      - Any
                      type: string
                    description:
                      type: string
                    hex:
                      description: Hex byte patterns that must occur in the file.
                      items:
                        maxLength: 2048
                        minLength: 8
                        pattern: ^[0-9a-fA-F\s]+$
                        type: string
                      maxItems: 64
                      type: array
                    name:
                      maxLength: 253
                      minLength: 1
                      type: string
                    severity:
                      enum:
                      - Low
                      - Medium
                      - High
                      - Critical
                      type: string
                    sha256:
                      description: File hashes, 64 hex digits each.
                      items:
                        pattern: ^[a-fA-F0-9]{64}$
                        type: string
                      maxItems: 10000
                      type: array
                    strings:
                      description: Literal byte strings that must occur in the file.
                      items:
                        maxLength: 1024
                        minLength: 4
                        type: string
                      maxItems: 64
                      type: array
                  required:
                  - name
                  - severity
                  type: object
                  x-kubernetes-validations:
                  - message: needs sha256, strings, or hex
                    rule: (has(self.sha256) && size(self.sha256) > 0) || (has(self.strings) && size(self.strings) > 0) || (has(self.hex) && size(self.hex) > 0)
                maxItems: 1000
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              yara:
                description: YARA rule source, compiled with YARA-X.
                maxLength: 262144
                nullable: true
                type: string
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed. If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              signatures:
                default: 0
                description: Signatures plus YARA rules accepted.
                format: int64
                type: integer
            type: object
        required:
        - spec
        title: WardSignature
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
