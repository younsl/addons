                    x-kubernetes-validations:
                    - message: rootcheck interval must be at least 10m
                      rule: duration(self) >= duration('10m')
                type: object
              scan:
                default:
                  onExec: true
                  yara: true
                  interval: 6h
                  maxFileSizeMib: 32
                description: Signature (anti-malware) scanning.
                properties:
                  hostPaths:
                    description: Host directories the full scan also walks.
                    items:
                      maxLength: 4096
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-validations:
                    - message: hostPaths must be absolute
                      rule: self.all(p, p.startsWith('/'))
                  interval:
