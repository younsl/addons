                        enum:
                        - Disable
                        - VerifyFull
                        type: string
                      username:
                        default: ward
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - host
                    - passwordSecretRef
                    type: object
                    x-kubernetes-validations:
                    - message: sslMode VerifyFull needs caSecretRef
                      rule: (has(self.sslMode) && self.sslMode == 'Disable') || has(self.caSecretRef)
                type: object
                x-kubernetes-validations:
                - message: set postgresql.external or postgresql.embedded, not both
                  rule: '!(has(self.external) && has(self.embedded))'
              rootcheck:
                default:
                  enabled: true
                  interval: 12h
                description: 'Rootkit anomaly checks on the host: hidden processes, files in `/dev`, and setuid files in temporary directories.'
                properties:
                  enabled:
                    default: true
                    type: boolean
                  interval:
                    default: 12h
                    maxLength: 32
                    pattern: ^([0-9]+(ms|s|m|h))+$
