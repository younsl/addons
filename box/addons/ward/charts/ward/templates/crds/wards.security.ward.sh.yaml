                        description: The data volume. Disabling the embedded server deletes it with its data.
                        properties:
                          size:
                            default: 1Gi
                            description: Size of the `PersistentVolumeClaim`.
                            maxLength: 32
                            type: string
                            x-kubernetes-validations:
                            - message: size must be a quantity of at least 64Mi
                              rule: isQuantity(self) && quantity(self).compareTo(quantity('64Mi')) >= 0
                          storageClassName:
                            description: Storage class of the claim. Empty means the cluster default.
                            maxLength: 253
                            nullable: true
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: storage is immutable, a StatefulSet cannot change its volume claims
                          rule: self == oldSelf
                      tolerations:
                        items:
                          description: The pod this Toleration is attached to tolerates any taint that matches the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: Effect indicates the taint effect to match. Empty means match all taint effects. When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: Key is the taint key that the toleration applies to. Empty means match all taint keys. If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: Operator represents a key's relationship to the value. Valid operators are Exists and Equal. Defaults to Equal. Exists is equivalent to wildcard for value, so that a pod can tolerate all taints of a particular category.
                              type: string
                            tolerationSeconds:
                              description: TolerationSeconds represents the period of time the toleration (which must be of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default, it is not set, which means tolerate the taint forever (do not evict). Zero and negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: Value is the taint value the toleration matches to. If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
                          type: object
                        type: array
                    type: object
                  enabled:
                    default: false
                    description: Keep detections in PostgreSQL instead of a file on the manager volume. Needs the manager.
                    type: boolean
                  external:
                    description: An existing server. Unset, the operator deploys an embedded one.
                    nullable: true
                    properties:
                      caSecretRef:
                        description: Secret key in the `Ward` namespace holding the PEM CA bundle the server certificate chains to.
                        nullable: true
                        properties:
                          key:
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      database:
                        default: ward
                        maxLength: 63
                        minLength: 1
                        type: string
                      host:
                        maxLength: 253
                        minLength: 1
                        type: string
                      passwordSecretRef:
                        description: Secret key in the `Ward` namespace holding the password.
                        properties:
                          key:
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      port:
                        default: 5432
                        format: uint16
                        maximum: 65535.0
                        minimum: 1.0
                        type: integer
                      sslMode:
                        default: VerifyFull
