                    description: Period of the full scan of every container filesystem and of `hostPaths`.
                    maxLength: 32
                    pattern: ^([0-9]+(ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: interval must be at least 1m
                      rule: duration(self) >= duration('1m')
                  maxFileSizeMib:
                    default: 32
                    description: Files larger than this are skipped.
                    format: uint32
                    maximum: 1024.0
                    minimum: 1.0
                    type: integer
                  onExec:
                    default: true
                    description: Scan the executable of every new process.
                    type: boolean
                  yara:
                    default: true
                    description: Match YARA rules from the feed and `WardSignatures`. Rules cost agent memory, so large rule sets may need a higher memory limit.
                    type: boolean
                type: object
            type: object
          status:
            nullable: true
            properties:
              agents:
                description: Ready over desired agents, as `3/3`.
                nullable: true
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed. If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              content:
                description: Signature database rollout, as the manager reports it.
                nullable: true
                properties:
                  message:
                    nullable: true
                    type: string
                  phase:
                    description: '`Idle`, `Canary`, or `Halted`.'
                    nullable: true
                    type: string
                  revisions:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: Active revisions and the agents running each.
                    type: object
                  stable:
                    description: The revision every ring runs.
                    nullable: true
                    type: string
                  target:
                    description: The revision being rolled out, if any.
                    nullable: true
                    type: string
                type: object
              eventSources:
                additionalProperties:
                  format: int32
                  type: integer
                description: Agents per event source mode (`ebpf-lsm`, `ebpf`, `procfs`).
                type: object
              managerReady:
                default: false
                type: boolean
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                description: '`Progressing`, `Ready`, or `Degraded`.'
                nullable: true
                type: string
              policyRevision:
                description: Hash of the policy the agents pull from the manager.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Ward
        type: object
        x-kubernetes-validations:
        - message: name must be at most 40 characters so derived object names stay valid
