{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ward.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ward.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - security.ward.sh
    resources:
      - wards
    verbs:
      - patch
      - update
  - apiGroups:
      - security.ward.sh
    resources:
      - wards/finalizers
    verbs:
      - update
  - apiGroups:
      - security.ward.sh
    resources:
      - wardsignatures
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - security.ward.sh
    resources:
      - wardsignatures/status
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
{{- end }}
