{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ward.fullname" . }}
  labels:
    {{- include "ward.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - security.ward.sh
    resources:
      - wards
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - security.ward.sh
    resources:
      - wards/status
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - {{ include "ward.workloadClusterRoleName" . }}
      - {{ include "ward.leaseClusterRoleName" . }}
    verbs:
      - bind
{{- end }}
