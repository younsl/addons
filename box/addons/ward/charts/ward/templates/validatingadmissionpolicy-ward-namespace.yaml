{{- if and .Values.wardNamespacePolicy.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "ward.fullname" . }}-namespace
  labels:
    {{- include "ward.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - security.ward.sh
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - wards
  validations:
    - expression: object.metadata.namespace == {{ .Release.Namespace | quote }}
      message: {{ printf "a Ward deploys privileged node agents and is only accepted in namespace %s" .Release.Namespace | quote }}
      reason: Forbidden
{{- end }}
