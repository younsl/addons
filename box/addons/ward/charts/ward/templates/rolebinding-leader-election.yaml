{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ward.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ward.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ward.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "ward.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
