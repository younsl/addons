{{- if and .Values.ward.create (or .Values.crds.install (.Capabilities.APIVersions.Has "security.ward.sh/v1alpha1/Ward")) -}}
apiVersion: security.ward.sh/v1alpha1
kind: Ward
metadata:
  name: {{ .Values.ward.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ward.labels" . | nindent 4 }}
    {{- with .Values.ward.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- with .Values.ward.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- toYaml .Values.ward.spec | nindent 2 }}
{{- end }}
