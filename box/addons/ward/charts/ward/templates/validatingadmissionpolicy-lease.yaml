{{- if and .Values.leaseAdmissionPolicy.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "ward.leaseClusterRoleName" . }}
  labels:
    {{- include "ward.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - coordination.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - leases
  matchConditions:
    - name: ward-agent
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith(':ward-agent')
  validations:
    - expression: >-
        has(request.userInfo.extra) &&
        'authentication.kubernetes.io/node-name' in request.userInfo.extra &&
        size(request.userInfo.extra['authentication.kubernetes.io/node-name']) > 0 &&
        object.metadata.name == 'ward-' + request.userInfo.extra['authentication.kubernetes.io/node-name'][0]
      messageExpression: >-
        'a ward agent may only write the Lease ward-<its node name>, not ' + object.metadata.name
      reason: Forbidden
{{- end }}
