[package]
name = "ward"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Kubernetes-native open source antivirus and EDR: a manager StatefulSet and a node agent DaemonSet, deployed from one custom resource"
readme = "README.md"
repository = "https://github.com/younsl/addons"
default-run = "ward"

[lib]
name = "ward"
path = "src/lib.rs"

[[bin]]
name = "ward"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
doc = false

[dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "io-util"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32", "schemars"] }
schemars = "1.2.3"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
prometheus-client = "0.25.2"
sha2 = "0.10.9"
memchr = "2.8.3"
walkdir = "2.5.0"
nix = { version = "0.31.3", default-features = false, features = ["signal", "fs", "inotify", "poll"] }
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
getrandom = "0.3.4"
subtle = "2.6.1"
yara-x = { version = "1.23.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "console-module", "dotnet-module", "elf-module", "hash-module", "macho-module", "math-module", "pe-module", "string-module", "time-module"] }
# yara-x 1.23 does not build against later rsa release candidates
rsa = { version = "=0.10.0-rc.19", default-features = false }
flate2 = "1.1.10"
base64 = "0.22.1"
time = { version = "0.3.47", default-features = false }
aws-lc-rs = "1.16.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls-pki-types = { version = "1.14.1", features = ["std"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["aws-lc-rs", "std"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
ward-ebpf-common = { path = "ebpf-common" }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.16.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Internal library shared by the binary and crdgen, not a published API
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_long_first_doc_paragraph = "allow"
# pid/ppid, sig/sigs and similar pairs are the domain's own names
similar_names = "allow"
# Integrity settings mirror Wazuh syscheck's boolean options one to one
struct_excessive_bools = "allow"
# Tests assert that results are empty without restating the length
assert_is_empty = "allow"
# Two-way matches on Option read clearer than if let with else
single_match_else = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
