[package]
name = "forklift"
version = "0.15.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI, raw, OCI) with proxy caching and supply-chain policy gates"
publish = false
default-run = "forklift"

[lib]
name = "forklift"
path = "src/lib.rs"

[[bin]]
name = "forklift"
path = "src/bin/forklift.rs"

[[bin]]
name = "forklift-mcp"
path = "src/bin/forklift_mcp.rs"

[features]
# Exposes `forklift::testing` (shared test harness) to the integration tests in tests/.
testing = []

[dependencies]
# Runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util", "rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await", "io"] }
async-trait = "0.1.92"
bytes = "1.12.1"

# HTTP server
axum = { version = "0.8.9", features = ["http1", "http2", "json", "query", "multipart", "matched-path", "original-uri", "tokio", "macros"] }
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "server-graceful", "service"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "set-header"] }

# HTTP client (upstream proxying, webhooks, OSV, deps.dev, GitLab, OIDC)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "http2", "json", "stream", "multipart", "gzip"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
serde_yaml_ng = "0.10.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
toml = "1.1.6"

# Storage
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "hooks", "functions"] }
aws-config = { version = "1.12.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.149.0", default-features = false, features = ["rt-tokio", "http-1x", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.4.2", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1.17.0", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1.8.0", features = ["http-body-1-x", "rt-tokio"] }
aws-sigv4 = { version = "1.6.0", default-features = false, features = ["http1", "sign-http"] }
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }

# Kubernetes (Lease leader election, pod role label)
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }

# Auth
openidconnect = { version = "4.0.1", default-features = false }
bcrypt = "0.19.3"
hmac = "0.13.0"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
subtle = "2.6.1"
base64 = "0.23.1"
rand = "0.10.3"
hex = "0.4.3"

# MCP server (forklift-mcp binary)
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server", "schemars", "macros"] }
schemars = "1.2.2"

# Observability
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter", "std"] }
pprof = { version = "0.15.0", default-features = false, features = ["prost-codec"] }

# Static assets
rust-embed = { version = "8.12.0", features = ["include-exclude", "mime-guess", "debug-embed"] }
mime_guess = "2.0.5"

# Utilities
chrono = { version = "0.4.45", features = ["serde", "clock"] }
chrono-tz = "0.10.4"
thiserror = "2.0.21"
anyhow = "1.0.104"
url = "2.5.8"
regex = "1.13.1"
uuid = { version = "1.26.1", features = ["v4"] }
semver = "1.0.28"
glob-match = "0.2.1"
ipnet = "2.12.2"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
percent-encoding = "2.3.2"
form_urlencoded = "1.2.2"
mime = "0.3.17"
httpdate = "1.0.3"
humantime = "2.4.0"
rustix = { version = "1.1.5", features = ["fs", "termios", "system"] }
parking_lot = "0.12.5"
once_cell = "1.21.4"
dashmap = "6.2.1"
itoa = "1.0.18"
arc-swap = "1.9.2"

[dev-dependencies]
# Self-reference so tests/ can use the harness behind the `testing` feature.
forklift = { path = ".", features = ["testing"] }
wiremock = "0.6.5"
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
pretty_assertions = "1.4.1"
serial_test = "4.0.1"
# Reads DTO JSON shapes from Rust source (see src/api/openapi_schema_test.rs).
syn = { version = "3.0.6", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Internal crate: errors are typed enums and panics are invariant checks, not API contract
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Docs name Go, slog and wire-protocol identifiers in prose, backticking each adds noise
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
# pub(crate) states the intended reach even inside private modules
redundant_pub_crate = "allow"
# Sizes and counts round-trip through SQLite i64 columns and Go-compatible wire types
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Request handlers and the server wiring are long by nature of the protocols they serve
too_many_lines = "allow"
# Config and API DTO structs mirror env vars and JSON shapes field for field
struct_excessive_bools = "allow"
# Artifact paths are case-sensitive by protocol, lowercasing would change matching
case_sensitive_file_extension_comparisons = "allow"
# mul_add changes rounding of displayed ratios and scores
suboptimal_flops = "allow"
# Nursery lints with frequent false positives or worse readability
option_if_let_else = "allow"
significant_drop_tightening = "allow"
useless_let_if_seq = "allow"
# push_str(&format!()) reads clearer in text renderers than write! with a discarded fmt::Result
format_push_string = "allow"
# Local consts and helpers sit next to their only use
items_after_statements = "allow"
# Protocol and digest names (sha1/sha256, src/dst) are similar by nature
similar_names = "allow"
many_single_char_names = "allow"
# Arms stay separate to document each protocol or status case
match_same_arms = "allow"
# Handlers and spawned tasks take owned Arc and extractor values by framework convention
needless_pass_by_value = "allow"
# serde skip_serializing_if predicates must take &T
trivially_copy_pass_by_ref = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1
