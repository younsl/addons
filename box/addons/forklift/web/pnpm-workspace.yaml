allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
# Security-patch pins for transitive dependencies flagged by Dependabot.
# Each selector matches only the vulnerable range, so nothing else moves.
# Drop an entry once every dependent resolves to a patched version on its own.
overrides:
  brace-expansion@2: '>=5.0.12'
  shell-quote: '>=1.11.0'
  nanoid@<3.3.18: 3.3.18
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=3.0.0 <5.0.12: 5.0.12
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  ip-address@<=10.7.3: 10.7.4
  undici@>=7.0.0 <7.30.1: 7.30.1
  postcss@<=8.5.22: 8.5.23
  hono@<4.13.11: 4.13.11
  '@hono/node-server@<2.1.3': 2.1.3
  uuid@<11.1.1: 11.1.1
  axios@>=1.0.0 <1.20.0: 1.20.0
  seroval@<1.6.11: 1.6.11
  seroval-plugins@<1.6.11: 1.6.11
  proxy-addr@<2.0.8: 2.0.8
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  '@modelcontextprotocol/sdk@<1.32.0': 1.32.0
  follow-redirects@<1.16.2: 1.16.2
  vite@>=8.0.0 <8.1.6: 8.1.6
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  qs@>=6.7.0 <=6.16.0: 6.16.1
  glob@>=9.0.0 <=14.0.1: 14.0.2
  minimatch@>=7.0.0 <11.0.1: 11.0.1
  systeminformation@<5.33.16: 5.33.16
  zod@<4.6.6: 4.6.6
  joi@<17.13.9: 17.13.9
  joi@>=18.0.0 <18.3.1: 18.3.1
  postcss-selector-parser@<7.1.6: 7.1.6
  # pnpm's trust policy rejects semver 6.3.1 (trust downgrade); 6 has no newer release.
  semver@<7: ^7.8.5
# No patched release is published yet. Both are dev-only (shadcn, eslint), never bundled.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c
    # deepmerge has no release past 4.3.1 yet, reached only through dev tooling (jest-config, shadcn).
    - GHSA-gcqx-w48m-w2h4
