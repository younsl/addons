{{- if and .Values.storage.migration.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forklift.fullname" . }}-migrate
  labels:
    {{- include "forklift.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forklift.fullname" . }}-migrate
subjects:
  - kind: ServiceAccount
    name: {{ include "forklift.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
