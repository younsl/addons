{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forklift.fullname" . }}-mcp
  labels:
    {{- include "forklift.mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "forklift.mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.mcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "forklift.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
        {{- with .Values.mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: forklift-mcp
          image: "{{ include "forklift.mcp.image" . }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: FORKLIFT_MCP_UPSTREAM_URL
              value: {{ include "forklift.mcp.upstreamURL" . | quote }}
            - name: FORKLIFT_MCP_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: FORKLIFT_MCP_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- if .Values.mcp.token.existingSecret }}
            - name: FORKLIFT_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.token.existingSecret }}
                  key: {{ .Values.mcp.token.key }}
            {{- end }}
            {{- with .Values.mcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.mcp.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
