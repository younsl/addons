apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.23.0
appVersion: "0.20.0"
home: https://github.com/younsl/ct/tree/main/box/addons/forklift
sources:
  - https://github.com/younsl/ct/tree/main/box/addons/forklift/charts/forklift
dependencies:
  - name: seaweedfs
    version: "4.52.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bundled SeaweedFS subchart bumped from 4.48.0 to 4.52.0 (image chrislusf/seaweedfs:4.52). The all-in-one Deployment uses the Recreate strategy, so object storage is briefly unavailable during the upgrade"
