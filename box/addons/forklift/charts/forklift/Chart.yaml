apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.18.1
appVersion: "0.18.1"
home: https://github.com/younsl/addons/tree/main/box/addons/forklift
sources:
  - https://github.com/younsl/addons/tree/main/box/addons/forklift/charts/forklift
dependencies:
  - name: seaweedfs
    version: "4.48.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "Artifact label changes no longer wait behind audit pruning: prune batches hold the write connection about 200 ms, pause between batches and yield to queued writes"
    - kind: fixed
      description: "Download pruning walks audit ids forward instead of rescanning kept entries on every batch"
    - kind: fixed
      description: "Management API mutations wait at most 5 seconds for the write connection and answer 503 with Retry-After instead of timing out"
