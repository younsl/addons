<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5f5f5f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="592" fill="#0a0a0a"/>

  <text x="28" y="32" font-size="11" font-weight="600" letter-spacing="2.5" fill="#6f6f6f">REPOSITORY TYPES</text>

  <!-- hosted -->
  <g>
    <rect x="24" y="52" width="852" height="160" rx="10" fill="#111111" stroke="#242424"/>
    <text x="48" y="100" font-size="15" font-weight="700" fill="#f2f2f2">Hosted</text>
    <g font-size="11" fill="#8c8c8c">
      <text x="48" y="126">Stores artifacts you publish</text>
      <text x="48" y="142">via UI, API, or native</text>
      <text x="48" y="158">publishers.</text>
    </g>

    <rect x="300" y="108" width="124" height="48" rx="6" fill="#1b1b1b" stroke="#303030"/>
    <text x="362" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#e3e3e3">Publisher</text>
    <text x="362" y="144" text-anchor="middle" font-size="9" fill="#7d7d7d">npm publish / twine / UI</text>

    <rect x="508" y="92" width="156" height="80" rx="6" fill="#e4e4e4"/>
    <text x="586" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#161616">Hosted</text>
    <text x="586" y="146" text-anchor="middle" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5a5a5a">/npm/npm-internal/</text>

    <rect x="744" y="108" width="112" height="48" rx="6" fill="#1b1b1b" stroke="#303030"/>
    <text x="800" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#e3e3e3">Consumer</text>
    <text x="800" y="144" text-anchor="middle" font-size="9" fill="#7d7d7d">build clients</text>

    <g stroke="#5f5f5f" stroke-width="1.3" fill="none">
      <path d="M424,132 H508" marker-end="url(#arrow)"/>
      <path d="M664,132 H744" marker-end="url(#arrow)"/>
    </g>
    <g font-size="9.5" fill="#8c8c8c" text-anchor="middle">
      <text x="466" y="124">publish</text>
      <text x="704" y="124">fetch</text>
    </g>
  </g>

  <!-- proxy -->
  <g>
    <rect x="24" y="228" width="852" height="160" rx="10" fill="#111111" stroke="#242424"/>
    <text x="48" y="276" font-size="15" font-weight="700" fill="#f2f2f2">Proxy</text>
    <g font-size="11" fill="#8c8c8c">
      <text x="48" y="302">Caches an upstream registry,</text>
      <text x="48" y="318">applying security policies</text>
      <text x="48" y="334">on the way through.</text>
    </g>

    <rect x="300" y="284" width="124" height="48" rx="6" fill="#1b1b1b" stroke="#303030"/>
    <text x="362" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#e3e3e3">Client</text>
    <text x="362" y="320" text-anchor="middle" font-size="8.5" fill="#7d7d7d">mvn npm cargo go pip</text>

    <rect x="496" y="268" width="168" height="80" rx="6" fill="#e4e4e4"/>
    <text x="580" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#161616">Proxy</text>
    <text x="580" y="314" text-anchor="middle" font-size="9.5" fill="#4d4d4d">policy check + cache</text>
    <text x="580" y="332" text-anchor="middle" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5a5a5a">/maven/maven-central/</text>

    <rect x="736" y="284" width="124" height="48" rx="6" fill="#1b1b1b" stroke="#303030"/>
    <text x="798" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#e3e3e3">Upstream</text>
    <text x="798" y="320" text-anchor="middle" font-size="9" fill="#7d7d7d">public registry</text>

    <g stroke="#5f5f5f" stroke-width="1.3" fill="none">
      <path d="M424,308 H496" marker-end="url(#arrow)"/>
      <path d="M664,308 H736" marker-end="url(#arrow)"/>
    </g>
    <g font-size="9.5" fill="#8c8c8c" text-anchor="middle">
      <text x="460" y="300">request</text>
      <text x="700" y="300">on miss</text>
    </g>
  </g>

  <!-- group -->
  <g>
    <rect x="24" y="404" width="852" height="160" rx="10" fill="#111111" stroke="#242424"/>
    <text x="48" y="452" font-size="15" font-weight="700" fill="#f2f2f2">Group</text>
    <g font-size="11" fill="#8c8c8c">
      <text x="48" y="478">One read-only URL over an</text>
      <text x="48" y="494">ordered member list. Returns</text>
      <text x="48" y="510">the first hit.</text>
    </g>

    <rect x="300" y="460" width="124" height="48" rx="6" fill="#1b1b1b" stroke="#303030"/>
    <text x="362" y="481" text-anchor="middle" font-size="12" font-weight="700" fill="#e3e3e3">Client</text>
    <text x="362" y="496" text-anchor="middle" font-size="9" fill="#7d7d7d">one endpoint</text>

    <rect x="488" y="444" width="140" height="80" rx="6" fill="#e4e4e4"/>
    <text x="558" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#161616">Group</text>
    <text x="558" y="490" text-anchor="middle" font-size="9.5" fill="#4d4d4d">read-only</text>
    <text x="558" y="508" text-anchor="middle" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5a5a5a">/maven/maven-public/</text>

    <rect x="696" y="448" width="160" height="34" rx="6" fill="#1b1b1b" stroke="#303030"/>
    <text x="712" y="469" font-size="10" fill="#5f5f5f">1</text>
    <text x="726" y="469" font-size="11" fill="#dcdcdc">maven-internal</text>
    <text x="844" y="469" text-anchor="end" font-size="8.5" fill="#7a7a7a">hosted</text>

    <rect x="696" y="492" width="160" height="34" rx="6" fill="#1b1b1b" stroke="#303030"/>
    <text x="712" y="513" font-size="10" fill="#5f5f5f">2</text>
    <text x="726" y="513" font-size="11" fill="#dcdcdc">maven-central</text>
    <text x="844" y="513" text-anchor="end" font-size="8.5" fill="#7a7a7a">proxy</text>

    <g stroke="#5f5f5f" stroke-width="1.3" fill="none">
      <path d="M424,484 H488" marker-end="url(#arrow)"/>
      <path d="M628,484 H656"/>
      <path d="M656,465 V509"/>
      <path d="M656,465 H696" marker-end="url(#arrow)"/>
      <path d="M656,509 H696" marker-end="url(#arrow)"/>
    </g>
    <text x="452" y="476" font-size="9.5" fill="#8c8c8c" text-anchor="middle">request</text>
    <text x="696" y="546" font-size="9.5" fill="#8c8c8c">ordered lookup, first hit wins</text>
  </g>
</svg>
