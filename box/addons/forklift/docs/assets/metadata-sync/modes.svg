<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="880" height="360" fill="#0a0a0a"/>

  <!-- wal -->
  <g>
    <rect x="24" y="24" width="404" height="312" rx="8" fill="#0e0e0e" stroke="#ededed"/>
    <text x="44" y="54" fill="#ededed" font-size="14">wal</text>
    <text x="80" y="54" fill="#6e6e6e" font-size="11">default</text>

    <rect x="44" y="76" width="120" height="44" rx="4" fill="#161616" stroke="#3a3a3a"/>
    <text x="104" y="103" fill="#ededed" font-size="11" text-anchor="middle">base</text>
    <g fill="#161616" stroke="#ededed">
      <rect x="176" y="86" width="26" height="24" rx="3"/>
      <rect x="208" y="86" width="26" height="24" rx="3"/>
      <rect x="240" y="86" width="26" height="24" rx="3"/>
      <rect x="272" y="86" width="26" height="24" rx="3"/>
    </g>
    <text x="312" y="103" fill="#8b8b8b" font-size="11">+ seg / 5 s</text>

    <g font-size="11">
      <text x="44" y="160" fill="#6e6e6e">data-loss window</text>
      <text x="408" y="160" fill="#ededed" text-anchor="end">about 5 s</text>
      <line x1="44" y1="172" x2="408" y2="172" stroke="#1f1f1f"/>
      <text x="44" y="196" fill="#6e6e6e">writes per change</text>
      <text x="408" y="196" fill="#ededed" text-anchor="end">changed pages, new key</text>
      <line x1="44" y1="208" x2="408" y2="208" stroke="#1f1f1f"/>
      <text x="44" y="232" fill="#6e6e6e">overwrites</text>
      <text x="408" y="232" fill="#ededed" text-anchor="end">base, on rotation only</text>
      <line x1="44" y1="244" x2="408" y2="244" stroke="#1f1f1f"/>
      <text x="44" y="268" fill="#6e6e6e">failover</text>
      <text x="408" y="268" fill="#ededed" text-anchor="end">apply new segments, seconds</text>
      <line x1="44" y1="280" x2="408" y2="280" stroke="#1f1f1f"/>
      <text x="44" y="304" fill="#6e6e6e">use for</text>
      <text x="408" y="304" fill="#ededed" text-anchor="end">every deployment</text>
    </g>
  </g>

  <!-- snapshot -->
  <g>
    <rect x="452" y="24" width="404" height="312" rx="8" fill="#0e0e0e" stroke="#2a2a2a"/>
    <text x="472" y="54" fill="#8b8b8b" font-size="14">snapshot</text>
    <text x="548" y="54" fill="#6e6e6e" font-size="11">fallback</text>

    <g fill="#161616" stroke="#3a3a3a">
      <rect x="472" y="76" width="120" height="44" rx="4"/>
      <rect x="480" y="84" width="120" height="44" rx="4" opacity="0.6"/>
    </g>
    <text x="532" y="103" fill="#8b8b8b" font-size="11" text-anchor="middle">whole db</text>
    <text x="620" y="103" fill="#8b8b8b" font-size="11">same key, every change</text>

    <g font-size="11">
      <text x="472" y="160" fill="#6e6e6e">data-loss window</text>
      <text x="836" y="160" fill="#8b8b8b" text-anchor="end">metaSyncInterval (+15 m pacing)</text>
      <line x1="472" y1="172" x2="836" y2="172" stroke="#1f1f1f"/>
      <text x="472" y="196" fill="#6e6e6e">writes per change</text>
      <text x="836" y="196" fill="#8b8b8b" text-anchor="end">whole database, zstd</text>
      <line x1="472" y1="208" x2="836" y2="208" stroke="#1f1f1f"/>
      <text x="472" y="232" fill="#6e6e6e">overwrites</text>
      <text x="836" y="232" fill="#8b8b8b" text-anchor="end">every upload</text>
      <line x1="472" y1="244" x2="836" y2="244" stroke="#1f1f1f"/>
      <text x="472" y="268" fill="#6e6e6e">failover</text>
      <text x="836" y="268" fill="#8b8b8b" text-anchor="end">download the whole database</text>
      <line x1="472" y1="280" x2="836" y2="280" stroke="#1f1f1f"/>
      <text x="472" y="304" fill="#6e6e6e">use for</text>
      <text x="836" y="304" fill="#8b8b8b" text-anchor="end">rollback below 0.18.0, triage</text>
    </g>
  </g>
</svg>
