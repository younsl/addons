<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#0a0a0a"/>
  <text x="24" y="34" fill="#ededed" font-size="13">pod lifecycle</text>
  <text x="24" y="54" fill="#6e6e6e" font-size="11">5 GB database, 790 MB compressed base: boot is the measured download and decompress</text>

  <g font-size="12">
    <rect x="24" y="76" width="196" height="96" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="40" y="100" fill="#ededed">boot</text>
    <text x="40" y="122" fill="#8b8b8b" font-size="10">download base, decompress,</text>
    <text x="40" y="138" fill="#8b8b8b" font-size="10">apply segments, header check</text>
    <text x="40" y="160" fill="#ededed" font-size="11">about 2 min</text>

    <rect x="244" y="76" width="196" height="96" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="260" y="100" fill="#ededed">standby</text>
    <text x="260" y="122" fill="#8b8b8b" font-size="10">poll every metaSyncInterval,</text>
    <text x="260" y="138" fill="#8b8b8b" font-size="10">apply new segments</text>
    <text x="260" y="160" fill="#ededed" font-size="11">background</text>

    <rect x="464" y="76" width="196" height="96" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="480" y="100" fill="#ededed">promote</text>
    <text x="480" y="122" fill="#8b8b8b" font-size="10">catch up, header check,</text>
    <text x="480" y="138" fill="#8b8b8b" font-size="10">swap in</text>
    <text x="480" y="160" fill="#ededed" font-size="11">seconds</text>

    <rect x="684" y="76" width="172" height="96" rx="6" fill="#111111" stroke="#ededed"/>
    <text x="700" y="100" fill="#ededed">leader</text>
    <text x="700" y="122" fill="#8b8b8b" font-size="10">first base, then a</text>
    <text x="700" y="138" fill="#8b8b8b" font-size="10">segment every 5 s</text>
    <text x="700" y="160" fill="#ededed" font-size="11">base in ~80 s</text>
  </g>
  <g stroke="#8b8b8b" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 220 124 H 242"/>
    <path d="M 440 124 H 462"/>
    <path d="M 660 124 H 682"/>
  </g>

  <!-- startup probe budget -->
  <g>
    <line x1="24" y1="214" x2="856" y2="214" stroke="#1f1f1f"/>
    <text x="24" y="206" fill="#6e6e6e" font-size="10">startupProbe budget (failureThreshold 60 x periodSeconds 5)</text>
    <rect x="24" y="224" width="832" height="16" rx="3" fill="#161616" stroke="#2a2a2a"/>
    <rect x="24" y="224" width="333" height="16" rx="3" fill="#ededed"/>
    <text x="34" y="236" fill="#0a0a0a" font-size="10">boot about 2 min</text>
    <text x="846" y="236" fill="#8b8b8b" font-size="10" text-anchor="end">300 s</text>
  </g>

  <g font-size="10" fill="#8b8b8b">
    <text x="24" y="272">healthy logs</text>
    <text x="140" y="272" fill="#ededed">restored metadata from S3 base and wal segments</text>
    <text x="140" y="290" fill="#ededed">started wal generation  reason=...</text>
    <text x="140" y="308" fill="#ededed">published wal base</text>
  </g>
</svg>
