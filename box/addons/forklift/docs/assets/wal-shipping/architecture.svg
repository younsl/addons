<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#0a0a0a"/>

  <!-- leader pod -->
  <g>
    <rect x="24" y="24" width="250" height="392" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-dasharray="5 4"/>
    <text x="40" y="46" fill="#6e6e6e" font-size="11">leader pod (emptyDir)</text>

    <rect x="44" y="64" width="210" height="44" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="149" y="91" fill="#ededed" font-size="12" text-anchor="middle">write pool (1 conn)</text>

    <rect x="44" y="140" width="98" height="44" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="93" y="167" fill="#ededed" font-size="12" text-anchor="middle">-wal</text>
    <rect x="156" y="140" width="98" height="44" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="205" y="167" fill="#ededed" font-size="12" text-anchor="middle">.db</text>

    <rect x="44" y="230" width="210" height="64" rx="6" fill="#111111" stroke="#ededed"/>
    <text x="149" y="254" fill="#ededed" font-size="12" text-anchor="middle">shipper, every 5s</text>
    <text x="149" y="274" fill="#8b8b8b" font-size="10" text-anchor="middle">holds write conn while reading</text>

    <rect x="44" y="326" width="210" height="70" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="149" y="348" fill="#8b8b8b" font-size="10" text-anchor="middle">read pool: query_only</text>
    <text x="149" y="366" fill="#8b8b8b" font-size="10" text-anchor="middle">wal_autocheckpoint = 0</text>
    <text x="149" y="384" fill="#8b8b8b" font-size="10" text-anchor="middle">only the shipper checkpoints</text>

    <g stroke="#8b8b8b" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
      <path d="M 93 108 V 138"/>
      <path d="M 93 186 V 228"/>
      <path d="M 205 228 V 186"/>
    </g>
    <g fill="#6e6e6e" font-size="10">
      <text x="100" y="126">commit</text>
      <text x="100" y="212">frames</text>
      <text x="212" y="212">TRUNCATE</text>
    </g>
  </g>

  <!-- bucket -->
  <g>
    <rect x="320" y="24" width="250" height="392" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-dasharray="5 4"/>
    <text x="336" y="46" fill="#6e6e6e" font-size="11">bucket (SeaweedFS / S3)</text>

    <rect x="340" y="64" width="210" height="88" rx="6" fill="#111111" stroke="#ededed"/>
    <text x="356" y="88" fill="#ededed" font-size="12">meta/forklift.db</text>
    <text x="356" y="108" fill="#8b8b8b" font-size="10">base copy, zstd</text>
    <text x="356" y="124" fill="#8b8b8b" font-size="10">generation, fence, sha256</text>
    <text x="356" y="140" fill="#8b8b8b" font-size="10">replaced only on rotation</text>

    <rect x="340" y="180" width="210" height="216" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="356" y="204" fill="#ededed" font-size="12">meta/wal/&lt;generation&gt;/</text>
    <g fill="#8b8b8b" font-size="10">
      <rect x="356" y="220" width="178" height="26" rx="4" fill="#161616" stroke="#2a2a2a"/>
      <text x="366" y="237">…00000.seg  frames 0..k</text>
      <rect x="356" y="254" width="178" height="26" rx="4" fill="#161616" stroke="#2a2a2a"/>
      <text x="366" y="271">…00001.seg</text>
      <rect x="356" y="288" width="178" height="26" rx="4" fill="#161616" stroke="#2a2a2a"/>
      <text x="366" y="305">…00002.seg</text>
      <text x="366" y="334">new key per segment</text>
      <text x="366" y="350">If-None-Match: *</text>
      <text x="366" y="366">sha256 + first frame inside</text>
    </g>
  </g>

  <!-- standby pod -->
  <g>
    <rect x="616" y="24" width="240" height="392" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-dasharray="5 4"/>
    <text x="632" y="46" fill="#6e6e6e" font-size="11">standby pod</text>

    <rect x="636" y="64" width="200" height="88" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="736" y="92" fill="#ededed" font-size="12" text-anchor="middle">replica.db</text>
    <text x="736" y="112" fill="#8b8b8b" font-size="10" text-anchor="middle">base + segments</text>
    <text x="736" y="128" fill="#8b8b8b" font-size="10" text-anchor="middle">replayed page by page</text>

    <rect x="636" y="200" width="200" height="56" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="736" y="224" fill="#ededed" font-size="12" text-anchor="middle">quick_check</text>
    <text x="736" y="242" fill="#8b8b8b" font-size="10" text-anchor="middle">before boot and promote</text>

    <rect x="636" y="304" width="200" height="56" rx="6" fill="#111111" stroke="#ededed"/>
    <text x="736" y="328" fill="#ededed" font-size="12" text-anchor="middle">promote: swap in</text>
    <text x="736" y="346" fill="#8b8b8b" font-size="10" text-anchor="middle">then start own generation</text>

    <g stroke="#8b8b8b" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
      <path d="M 736 152 V 198"/>
      <path d="M 736 256 V 302"/>
    </g>
  </g>

  <!-- cross flows -->
  <g stroke="#ededed" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 256 262 H 290 V 108 H 338"/>
    <path d="M 256 280 H 300 V 250 H 338"/>
  </g>
  <g stroke="#8b8b8b" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 552 108 H 634"/>
    <path d="M 552 250 H 594 V 120 H 634"/>
  </g>
  <g fill="#8b8b8b" font-size="10">
    <text x="296" y="98" text-anchor="middle">rotate</text>
    <text x="306" y="296" text-anchor="middle">append</text>
    <text x="593" y="98" text-anchor="middle">HEAD, GET</text>
    <text x="604" y="272" text-anchor="middle">LIST, GET</text>
  </g>
</svg>
