<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/>
    </marker>
  </defs>
  <rect width="880" height="250" fill="#0a0a0a"/>
  <text x="24" y="34" fill="#6e6e6e" font-size="11">generation lifecycle (leader)</text>

  <g font-size="12">
    <rect x="24" y="56" width="148" height="76" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="98" y="84" fill="#ededed" text-anchor="middle">1 checkpoint</text>
    <text x="98" y="104" fill="#8b8b8b" font-size="10" text-anchor="middle">TRUNCATE under</text>
    <text x="98" y="118" fill="#8b8b8b" font-size="10" text-anchor="middle">the write conn</text>

    <rect x="196" y="56" width="148" height="76" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="270" y="84" fill="#ededed" text-anchor="middle">2 copy .db</text>
    <text x="270" y="104" fill="#8b8b8b" font-size="10" text-anchor="middle">file is frozen until</text>
    <text x="270" y="118" fill="#8b8b8b" font-size="10" text-anchor="middle">the next checkpoint</text>

    <rect x="368" y="56" width="148" height="76" rx="6" fill="#111111" stroke="#ededed"/>
    <text x="442" y="84" fill="#ededed" text-anchor="middle">3 publish base</text>
    <text x="442" y="104" fill="#8b8b8b" font-size="10" text-anchor="middle">fenced PUT,</text>
    <text x="442" y="118" fill="#8b8b8b" font-size="10" text-anchor="middle">If-Match on old ETag</text>

    <rect x="540" y="56" width="148" height="76" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="614" y="84" fill="#ededed" text-anchor="middle">4 delete old</text>
    <text x="614" y="104" fill="#8b8b8b" font-size="10" text-anchor="middle">previous generation's</text>
    <text x="614" y="118" fill="#8b8b8b" font-size="10" text-anchor="middle">segments</text>

    <rect x="712" y="56" width="144" height="76" rx="6" fill="#111111" stroke="#2a2a2a"/>
    <text x="784" y="84" fill="#ededed" text-anchor="middle">5 append</text>
    <text x="784" y="104" fill="#8b8b8b" font-size="10" text-anchor="middle">segment per 5s,</text>
    <text x="784" y="118" fill="#8b8b8b" font-size="10" text-anchor="middle">in order, no gaps</text>
  </g>

  <g stroke="#8b8b8b" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 172 94 H 194"/>
    <path d="M 344 94 H 366"/>
    <path d="M 516 94 H 538"/>
    <path d="M 688 94 H 710"/>
  </g>
  <g stroke="#ededed" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <path d="M 784 132 V 180 H 98 V 134"/>
  </g>
  <g fill="#8b8b8b" font-size="10">
    <text x="440" y="198" text-anchor="middle">rotate: segments outgrow the base, 2000 segments, a lost frame, or a new term</text>
    <text x="440" y="226" text-anchor="middle">replay: base + segments 0..n = the checkpointed file, byte for byte</text>
  </g>
</svg>
