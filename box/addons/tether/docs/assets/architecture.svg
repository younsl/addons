<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">tether local container architecture</title>
  <desc id="desc">A browser, curl, and the bootstrap script on macOS reach the tether container over loopback port 8080. The container mounts config.toml read only, HOME read write at the same path, and /opt/homebrew read only, then keeps dotfile symlinks in HOME pointing at the repository configs.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#888" stroke-width="1.2"/>
    </marker>
    <style>
      .sans { font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .fg { fill: #ededed; }
      .muted { fill: #a1a1a1; }
      .dim { fill: #666; }
      .eyebrow { font-size: 10px; letter-spacing: 1.2px; fill: #666; }
      .req { stroke: #888; stroke-width: 1; fill: none; }
      .mount { stroke: #555; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="680" fill="#000"/>
  <rect width="1280" height="680" fill="url(#dots)"/>

  <text x="56" y="64" class="sans fg" font-size="24" font-weight="600" letter-spacing="-0.5">tether</text>
  <text x="56" y="90" class="sans muted" font-size="14">Local container architecture on macOS</text>

  <g class="mono" font-size="11">
    <line x1="1036" y1="60" x2="1064" y2="60" class="req" marker-end="url(#arrow)"/>
    <text x="1074" y="64" class="muted">request</text>
    <line x1="1146" y1="60" x2="1174" y2="60" class="mount"/>
    <text x="1184" y="64" class="muted">bind mount</text>
  </g>

  <g class="sans">
    <text x="56" y="264" class="fg" font-size="15" font-weight="500">Browser</text>
    <text x="56" y="284" class="mono muted" font-size="12">console, logs, files</text>
    <text x="56" y="322" class="fg" font-size="15" font-weight="500">curl</text>
    <text x="56" y="342" class="mono muted" font-size="12">POST /api/reconcile</text>
    <text x="56" y="540" class="fg" font-size="15" font-weight="500">bootstrap-dotfiles.sh</text>
    <text x="56" y="560" class="mono muted" font-size="12">docker | podman run</text>
  </g>
  <line x1="240" y1="270" x2="396" y2="270" class="req" marker-end="url(#arrow)"/>
  <line x1="240" y1="328" x2="396" y2="328" class="req" marker-end="url(#arrow)"/>
  <line x1="240" y1="546" x2="396" y2="546" class="req" marker-end="url(#arrow)"/>
  <text x="318" y="260" class="mono dim" font-size="10" text-anchor="middle">127.0.0.1:8080</text>
  <text x="318" y="536" class="mono dim" font-size="10" text-anchor="middle">run -d</text>

  <rect x="400.5" y="152.5" width="400" height="448" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <circle cx="428" cy="181" r="4" fill="#50e3c2"/>
  <text x="442" y="186" class="sans fg" font-size="16" font-weight="600">tether</text>
  <text x="776" y="186" class="mono muted" font-size="11" text-anchor="end">scratch  uid 65532</text>
  <text x="424" y="208" class="mono dim" font-size="11">ghcr.io/younsl/tether  /app/tether</text>
  <line x1="401" y1="226.5" x2="800" y2="226.5" stroke="#1f1f1f"/>

  <text x="424" y="254" class="mono eyebrow">WEB  :8080</text>
  <text x="424" y="278" class="mono fg" font-size="12">/  /logs  /api/*</text>
  <text x="776" y="278" class="sans muted" font-size="12" text-anchor="end">console and API</text>
  <text x="424" y="300" class="mono fg" font-size="12">/healthz  /readyz  /metrics</text>
  <text x="776" y="300" class="sans muted" font-size="12" text-anchor="end">probes, Prometheus</text>
  <text x="424" y="324" class="sans dim" font-size="12">Loopback Host only. Handlers read State, never the disk.</text>
  <line x1="401" y1="342.5" x2="800" y2="342.5" stroke="#1f1f1f"/>

  <text x="424" y="370" class="mono eyebrow">CONTROLLER</text>
  <text x="776" y="370" class="mono dim" font-size="10" text-anchor="end">every 5m or on wake</text>
  <g class="mono" font-size="12">
    <text x="424" y="394" class="dim">01</text><text x="452" y="394" class="fg">load config.toml</text>
    <text x="424" y="416" class="dim">02</text><text x="452" y="416" class="fg">plan one step per target</text>
    <text x="424" y="438" class="dim">03</text><text x="452" y="438" class="fg">link, relink, or back up</text>
    <text x="424" y="460" class="dim">04</text><text x="452" y="460" class="fg">regenerate Brewfile, krewfile</text>
  </g>
  <line x1="401" y1="480.5" x2="800" y2="480.5" stroke="#1f1f1f"/>

  <text x="424" y="508" class="mono eyebrow">MOUNTS</text>
  <g class="mono" font-size="12">
    <text x="424" y="532" class="fg">/etc/tether/config.toml</text>
    <text x="776" y="532" class="dim" text-anchor="end">ro</text>
    <text x="424" y="554" class="fg">$HOME</text>
    <text x="776" y="554" class="dim" text-anchor="end">rw</text>
    <text x="424" y="576" class="fg">/opt/homebrew</text>
    <text x="776" y="576" class="dim" text-anchor="end">ro</text>
  </g>

  <path d="M801 528 H824 V228 H868" class="mount"/>
  <path d="M801 550 H840 V364 H868" class="mount"/>
  <path d="M801 572 H868" class="mount"/>
  <circle cx="870" cy="228" r="2.5" fill="#888"/>
  <circle cx="870" cy="364" r="2.5" fill="#888"/>
  <circle cx="870" cy="572" r="2.5" fill="#888"/>

  <text x="884" y="196" class="mono eyebrow">REPOSITORY</text>
  <text x="884" y="232" class="mono fg" font-size="12">config.toml</text>
  <text x="1060" y="232" class="sans muted" font-size="12">link spec, reread every run</text>
  <text x="884" y="254" class="mono fg" font-size="12">configs/</text>
  <text x="1060" y="254" class="sans muted" font-size="12">source_root</text>
  <text x="884" y="276" class="mono fg" font-size="12">Brewfile, krewfile</text>
  <text x="1060" y="276" class="sans muted" font-size="12">regenerated from disk</text>

  <text x="884" y="340" class="mono eyebrow">HOME</text>
  <text x="884" y="368" class="mono fg" font-size="12">~/.zshrc  ~/.config/*</text>
  <text x="1060" y="368" class="sans muted" font-size="12">symlinks into configs/</text>
  <text x="884" y="390" class="mono fg" font-size="12">~/.claude/skills/*</text>
  <text x="1060" y="390" class="sans muted" font-size="12">per entry</text>
  <text x="884" y="412" class="mono fg" font-size="12">~/.dotfiles-backup/</text>
  <text x="1060" y="412" class="sans muted" font-size="12">replaced files</text>


  <text x="884" y="548" class="mono eyebrow">HOMEBREW</text>
  <text x="884" y="576" class="mono fg" font-size="12">/opt/homebrew</text>
  <text x="1060" y="576" class="sans muted" font-size="12">installed packages, read only</text>

  <text x="600" y="636" class="mono dim" font-size="11" text-anchor="middle">Runs in the docker or podman VM. Host paths are mounted at the same path, so links resolve on both sides.</text>
</svg>
