[package]
name = "tether"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Server that keeps dotfiles symlinked into a home directory"
readme = "README.md"
repository = "https://github.com/younsl/addons"

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }

# HTTP server (status, reconcile trigger, health, metrics)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

# Metrics
prometheus-client = "0.25"

# Link spec file and status output
serde = { version = "1", features = ["derive"] }
toml = "0.9"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }

# Config
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
