    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Decides which Slack members may invoke an agent name through a mention, and splits new threads across the kagent Agents in agentRefs by weight. The policy name is the agent name CHAT_AGENT and CHAT_AGENT_MAP route to. A name without a policy falls back to the gateway's CHAT_ALLOWED_USERS.
        properties:
          spec:
            description: Decides who may invoke an agent name through a Slack mention, and which kagent Agents answer it.
            properties:
              agentRefs:
                description: The kagent Agents a new thread is sent to, picked by weight like Gateway API `backendRefs`. A thread stays on the Agent it started on.
                items:
                  description: Identifies a kagent Agent by every field.
                  properties:
                    group:
                      description: API group of the referenced object. Always `kagent.dev`.
                      maxLength: 253
                      minLength: 1
                      type: string
                    kind:
                      description: Kind of the referenced object. Always `Agent`.
                      maxLength: 63
                      minLength: 1
                      type: string
                    name:
                      description: Name of the Agent.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the Agent. Must be the namespace the gateway submits to (`KAGENT_NAMESPACE`), which is also where it reads policies from.
                      maxLength: 63
                      minLength: 1
                      type: string
                    weight:
                      default: 1
                      description: Share of new threads sent to this Agent, relative to the other refs. `0` sends none, which drains the Agent while its threads finish.
                      format: int32
                      maximum: 1000000.0
                      minimum: 0.0
                      type: integer
                  required:
                  - group
                  - kind
                  - name
                  - namespace
                  type: object
                  x-kubernetes-validations:
                  - message: agentRefs entries must name a kagent.dev Agent
                    rule: self.group == 'kagent.dev' && self.kind == 'Agent'
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: agentRefs must name each Agent once and give at least one a weight above 0
                  rule: self.all(a, self.exists_one(b, b.name == a.name)) && self.exists(a, !has(a.weight) || a.weight > 0)
              chat:
                description: Who may invoke the agent name through a Slack mention.
                properties:
                  allowAll:
                    description: Lets every member of the allowed channels invoke the agent, overriding a restrictive `CHAT_ALLOWED_USERS` for this agent alone.
                    type: boolean
                  allowedUsers:
                    description: Slack member IDs (`U...` or `W...`) allowed to invoke the agent.
                    items:
                      maxLength: 32
                      minLength: 2
                      type: string
                    maxItems: 1000
                    type: array
                    x-kubernetes-validations:
                    - message: allowedUsers must be Slack member IDs such as U01234567
                      rule: self.all(u, u.matches('^[UW][A-Z0-9]+$'))
                type: object
                x-kubernetes-validations:
                - message: 'set exactly one of allowedUsers (non-empty) and allowAll: true'
                  rule: (has(self.allowAll) && self.allowAll) != (has(self.allowedUsers) && size(self.allowedUsers) > 0)
