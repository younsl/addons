    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Routes Slack mentions and alerts to kagent Agents, like a Gateway API route, and decides which Slack members may invoke them. spec.match picks the mentions and alerts the policy takes, agentRefs the Agents that answer by weight. Anything no policy matches is dropped.
        properties:
          spec:
            description: Decides who may invoke an agent name through a Slack mention, and which kagent Agents answer it.
            properties:
              agentRefs:
                description: The kagent Agents a new thread is sent to, picked by weight like Gateway API `backendRefs`. A thread stays on the Agent it started on.
                items:
                  description: Identifies a kagent Agent by every field.
                  properties:
                    group:
                      description: API group of the referenced object. Always `kagent.dev`.
                      maxLength: 253
                      minLength: 1
                      type: string
                    kind:
                      description: Kind of the referenced object. Always `Agent`.
                      maxLength: 63
                      minLength: 1
                      type: string
                    name:
                      description: Name of the Agent.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the Agent. Must be the namespace the gateway submits to (`KAGENT_NAMESPACE`), which is also where it reads policies from.
                      maxLength: 63
                      minLength: 1
                      type: string
                    weight:
                      default: 1
                      description: Share of new threads sent to this Agent, relative to the other refs. `0` sends none, which drains the Agent while its threads finish.
                      format: int32
                      maximum: 1000000.0
                      minimum: 0.0
                      type: integer
                  required:
                  - group
                  - kind
                  - name
                  - namespace
                  type: object
                  x-kubernetes-validations:
                  - message: agentRefs entries must name a kagent.dev Agent
                    rule: self.group == 'kagent.dev' && self.kind == 'Agent'
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: agentRefs must name each Agent once, give at least one a weight above 0, and share one namespace
                  rule: self.all(a, self.exists_one(b, b.name == a.name)) && self.exists(a, !has(a.weight) || a.weight > 0) && self.map(a, a.namespace).all(n, n == self[0].namespace)
              alertChannel:
                description: Slack channel, by name or conversation ID, that the alerts this policy matches thread in. Unset uses the matched label value as the channel name.
                maxLength: 80
                minLength: 1
                nullable: true
                type: string
                x-kubernetes-validations:
                - message: alertChannel must be one channel name or ID
                  rule: '!self.contains('' '') && !self.contains(''*'')'
              chat:
                description: Who may invoke the agent name through a Slack mention.
                properties:
                  allowAll:
                    description: Lets every member of the allowed channels invoke the agent, overriding a restrictive `CHAT_ALLOWED_USERS` for this agent alone.
                    type: boolean
                  allowedUsers:
                    description: Slack member IDs (`U...` or `W...`) allowed to invoke the agent.
                    items:
                      maxLength: 32
                      minLength: 2
                      type: string
                    maxItems: 1000
                    type: array
                    x-kubernetes-validations:
                    - message: allowedUsers must be Slack member IDs such as U01234567
                      rule: self.all(u, u.matches('^[UW][A-Z0-9]+$'))
                type: object
                x-kubernetes-validations:
                - message: 'set exactly one of allowedUsers (non-empty) and allowAll: true'
                  rule: (has(self.allowAll) && self.allowAll) != (has(self.allowedUsers) && size(self.allowedUsers) > 0)
              match:
                description: The mentions and alerts this policy takes, like a Gateway API route match.
                properties:
                  alertLabel:
                    description: The alert label whose value routes an alert to this policy.
                    nullable: true
                    properties:
                      name:
                        description: Label name, read from the labels every alert in the group shares, then from the group labels.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                        type: string
                      values:
                        description: Label values that route to this policy. `*` alone takes every alert no other policy matches, whatever its labels.
                        items:
                          maxLength: 128
                          minLength: 1
                          type: string
                        maxItems: 64
                        minItems: 1
                        type: array
                        x-kubernetes-validations:
                        - message: values must be unique, carry no surrounding spaces, and use * only as the single catch-all value
                          rule: self.all(v, self.exists_one(w, w == v) && v.trim() == v && (v == '*' || !v.contains('*'))) && (!self.exists(v, v == '*') || size(self) == 1)
                    required:
                    - name
                    - values
                    type: object
                  slackChannels:
                    description: Slack channels, by name or conversation ID, whose mentions this policy answers. `*` takes every channel no other policy names.
                    items:
                      maxLength: 80
                      minLength: 1
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-validations:
                    - message: slackChannels entries must be unique channel names or IDs without spaces, or the single catch-all *
                      rule: self.all(c, self.exists_one(d, d == c) && !c.contains(' ') && (c == '*' || !c.contains('*')))
                type: object
                x-kubernetes-validations:
                - message: match needs slackChannels or alertLabel
                  rule: (has(self.slackChannels) && size(self.slackChannels) > 0) || has(self.alertLabel)
            required:
            - agentRefs
            - chat
            - match
            type: object
            x-kubernetes-validations:
            - message: alertChannel needs match.alertLabel, the alerts it applies to
              rule: '!has(self.alertChannel) || has(self.match.alertLabel)'
          status:
            description: What the gateway last observed about the policy.
            nullable: true
            properties:
              conditions:
                description: '`Ready` reports whether the gateway enforces the policy as written. `AgentResolved` reports whether the referenced Agent exists.'
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed. If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: The `metadata.generation` the conditions describe.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: AgentAccessPolicy
        type: object
