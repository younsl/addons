  <text x="400" y="428" fill="#888" font-size="11" font-family="'SF Mono', Menlo, monospace">A2A endpoint</text>

  <rect x="724" y="208" width="184" height="272" rx="6" fill="#0a0a0a" stroke="#333" stroke-dasharray="4 3"/>
  <text x="740" y="236" fill="#ededed" font-size="15" font-weight="600">Agent</text>
  <text x="896" y="232" text-anchor="end" fill="#666" font-size="10" font-family="'SF Mono', Menlo, monospace">CR</text>
  <text x="740" y="256" fill="#888" font-size="11" font-family="'SF Mono', Menlo, monospace">kagent.dev</text>
  <g fill="#a1a1a1" font-size="11" font-family="'SF Mono', Menlo, monospace">
