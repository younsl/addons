  <text x="80" y="76" fill="#888" font-size="11" font-family="'SF Mono', Menlo, monospace">@kagent in a thread</text>

  <rect x="20" y="128" width="920" height="392" rx="10" fill="none" stroke="#262626" stroke-dasharray="4 4"/>
  <text x="36" y="150" fill="#666" font-size="11" font-family="'SF Mono', Menlo, monospace">Kubernetes cluster</text>
