    <text x="740" y="320">aws-alert-triage-v2</text>
    <text x="740" y="340">security-alert-triage</text>
    <text x="740" y="360">database-alert-triage</text>
  </g>

  <g stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <path d="M200 92V206"/>
    <path d="M282 252H378"/>
    <path d="M642 268H722"/>
    <path d="M282 430H378"/>
    <path d="M642 430H722"/>
