      <text x="282" y="114">thread reply</text>
      <text x="330" y="270" text-anchor="middle">watch</text>
      <text x="330" y="314" text-anchor="middle">status</text>
      <text x="682" y="286" text-anchor="middle">agentRefs</text>
      <text x="682" y="300" text-anchor="middle">weight</text>
      <text x="330" y="448" text-anchor="middle">A2A turn</text>
      <text x="682" y="448" text-anchor="middle">runs task</text>
