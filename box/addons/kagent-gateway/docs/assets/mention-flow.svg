  <text x="620" y="232" text-anchor="end" fill="#666" font-size="10" font-family="'SF Mono', Menlo, monospace">CR</text>
  <text x="400" y="256" fill="#888" font-size="11" font-family="'SF Mono', Menlo, monospace">access.kagent-gateway.sh</text>
  <g fill="#a1a1a1" font-size="11" font-family="'SF Mono', Menlo, monospace">
    <text x="400" y="286">one object per route</text>
    <text x="400" y="302">allowedUsers or allowAll</text>
    <text x="400" y="318">agentRefs with weight</text>
  </g>

  <rect x="380" y="380" width="260" height="100" rx="6" fill="#0a0a0a" stroke="#333"/>
