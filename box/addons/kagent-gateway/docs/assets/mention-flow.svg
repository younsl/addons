  <text x="52" y="186" fill="#666" font-size="11" font-family="'SF Mono', Menlo, monospace">namespace/kagent</text>

  <rect x="60" y="208" width="220" height="272" rx="6" fill="#0a0a0a" stroke="#ededed"/>
  <text x="80" y="236" fill="#ededed" font-size="15" font-weight="600">kagent-gateway</text>
  <text x="80" y="256" fill="#888" font-size="11" font-family="'SF Mono', Menlo, monospace">Deployment</text>
  <g fill="#888" font-size="11" font-family="'SF Mono', Menlo, monospace">
    <text x="80" y="300">match channel or label</text>
    <text x="80" y="318">spec.match</text>
    <text x="80" y="354">check member</text>
    <text x="80" y="372">policy cache</text>
    <text x="80" y="408">pick Agent by weight</text>
