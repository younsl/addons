      <circle cx="330" cy="236" r="9" fill="#ededed"/>
      <circle cx="682" cy="252" r="9" fill="#ededed"/>
      <circle cx="330" cy="414" r="9" fill="#ededed"/>
      <circle cx="682" cy="414" r="9" fill="#ededed"/>
