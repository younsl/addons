<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#666"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#000"/>

  <rect x="60" y="28" width="220" height="64" rx="6" fill="#0a0a0a" stroke="#333"/>
