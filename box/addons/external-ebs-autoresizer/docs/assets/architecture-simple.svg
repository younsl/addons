<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="290" fill="#ffffff"/>

  <!-- EKS cluster -->
  <rect x="24" y="80" width="272" height="150" rx="8" fill="none" stroke="#a1a1a1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="102" font-size="11" fill="#666666">EKS cluster</text>

  <rect x="44" y="120" width="232" height="70" rx="6" fill="#000000"/>
  <text x="160" y="151" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">external-ebs-autoresizer</text>
  <text x="160" y="171" font-size="11" fill="#a1a1a1" text-anchor="middle">leader Pod</text>

  <!-- AWS APIs -->
  <rect x="400" y="73" width="180" height="72" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.25"/>
  <text x="490" y="104" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Amazon EC2 API</text>
  <text x="490" y="124" font-size="11" fill="#666666" text-anchor="middle">find instances, ModifyVolume</text>

  <rect x="400" y="165" width="180" height="72" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.25"/>
  <text x="490" y="196" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">AWS Systems Manager</text>
  <text x="490" y="216" font-size="11" fill="#666666" text-anchor="middle">Run Command</text>

  <!-- standalone EC2 -->
  <rect x="680" y="30" width="196" height="230" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.25"/>
  <text x="778" y="60" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Standalone EC2</text>

  <rect x="700" y="84" width="156" height="50" rx="6" fill="#fafafa" stroke="#eaeaea" stroke-width="1"/>
  <text x="778" y="113" font-size="12.5" fill="#000000" text-anchor="middle">root EBS volume</text>

  <rect x="700" y="176" width="156" height="50" rx="6" fill="#fafafa" stroke="#eaeaea" stroke-width="1"/>
  <text x="778" y="198" font-size="12.5" fill="#000000" text-anchor="middle">root filesystem</text>
  <text x="778" y="215" font-size="11" fill="#666666" text-anchor="middle">df, growpart, resize</text>

  <!-- flow -->
  <path d="M 276 145 H 340 V 109 H 396" fill="none" stroke="#000000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 276 165 H 340 V 201 H 396" fill="none" stroke="#000000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="580" y1="109" x2="696" y2="109" stroke="#000000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="630" y="100" font-size="11" fill="#666666" text-anchor="middle">grow volume</text>
  <line x1="580" y1="201" x2="696" y2="201" stroke="#000000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="630" y="192" font-size="11" fill="#666666" text-anchor="middle">measure, extend</text>
</svg>
