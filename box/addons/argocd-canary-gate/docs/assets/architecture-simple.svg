<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>

  <!-- developer pressing SYNC -->
  <circle cx="70" cy="122" r="11" fill="none" stroke="#111111" stroke-width="1.5"/>
  <path d="M 50 162 C 50 146 62 138 70 138 C 78 138 90 146 90 162" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="70" y="182" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">developer</text>
  <text x="70" y="197" font-size="11" fill="#6b6b6b" text-anchor="middle">presses SYNC</text>

  <line x1="96" y1="150" x2="126" y2="150" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- the sync path -->
  <rect x="130" y="110" width="180" height="80" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="220" y="144" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Argo CD</text>
  <text x="220" y="166" font-size="11.5" fill="#6b6b6b" text-anchor="middle">UI &#183; CLI &#183; API</text>

  <rect x="360" y="110" width="200" height="80" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="460" y="144" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">kube-apiserver</text>
  <text x="460" y="166" font-size="11.5" fill="#6b6b6b" text-anchor="middle">validating webhook</text>

  <rect x="620" y="110" width="230" height="80" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="735" y="140" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">argocd-canary-gate</text>
  <text x="735" y="160" font-size="11.5" fill="#cccccc" text-anchor="middle">deny while a canary</text>
  <text x="735" y="175" font-size="11.5" fill="#cccccc" text-anchor="middle">is mid-flight</text>

  <!-- bottom row -->
  <rect x="360" y="280" width="200" height="72" rx="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="460" y="310" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">cert-manager</text>
  <text x="460" y="330" font-size="11" fill="#6b6b6b" text-anchor="middle">serving cert + webhook caBundle</text>

  <rect x="620" y="280" width="230" height="80" rx="6" fill="#f4f4f4" stroke="#111111" stroke-width="1.5"/>
  <text x="735" y="310" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Rollout</text>
  <text x="735" y="330" font-size="11.5" fill="#6b6b6b" text-anchor="middle">stableRS vs currentPodHash</text>
  <text x="735" y="345" font-size="11.5" fill="#6b6b6b" text-anchor="middle">pauseConditions &#183; abort</text>

  <!-- flow -->
  <line x1="310" y1="150" x2="356" y2="150" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="333" y="138" font-size="11.5" fill="#6b6b6b" text-anchor="middle">1. sync</text>

  <line x1="560" y1="134" x2="616" y2="134" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="122" font-size="11.5" fill="#6b6b6b" text-anchor="middle">2. review</text>

  <line x1="616" y1="170" x2="564" y2="170" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="200" font-size="11.5" fill="#6b6b6b" text-anchor="middle">4. allow, or deny 403</text>
  <text x="588" y="215" font-size="11.5" fill="#6b6b6b" text-anchor="middle">shown in the sync toast</text>

  <line x1="775" y1="190" x2="775" y2="276" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="228" font-size="11.5" fill="#6b6b6b">3. reads live status</text>
  <text x="660" y="243" font-size="11.5" fill="#6b6b6b">by tracking label</text>

  <!-- cert-manager keeps the webhook's TLS trust working: the serving pair
       lands in a Secret the gate mounts, the caBundle lands in the webhook
       registration the apiserver holds -->
  <line x1="460" y1="276" x2="460" y2="194" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="40" y="392" font-size="11.5" fill="#6b6b6b">A denied sync is also recorded as a Kubernetes Event on the Application. Auto-sync and skip-annotated apps are exempt.</text>
</svg>
