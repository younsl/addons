apiVersion: v1
kind: Service
metadata:
  name: {{ include "argocd-canary-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-canary-gate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  selector:
    {{- include "argocd-canary-gate.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.service.webhookPort }}
      targetPort: webhook
      protocol: TCP
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
