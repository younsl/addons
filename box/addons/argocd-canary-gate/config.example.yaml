# Example gate configuration for a local run. Every key is optional; the
# values shown are the defaults.

# enforce denies a sync while a watched Rollout has an update in flight.
# warn lets it through with a warning and counts the hit.
mode: enforce

# The verdict when the Rollout list itself fails: allow or deny.
onError: deny

argocd:
  # Namespace holding the Application resources. Denial Events are written here.
  namespace: argocd

rollouts:
  # Label tying a Rollout to its Application. Argo CD stamps its tracking label
  # on every managed resource with the Application name as the value.
  trackingLabel: argocd.argoproj.io/instance
  # Strategies the gate watches: canary, blueGreen.
  strategies:
    - canary

exempt:
  # Principals whose sync requests bypass the gate.
  usernames:
    - system:serviceaccount:argocd:argocd-application-controller
  # Bypass the gate when Argo CD marks the operation automated (auto-sync).
  automated: true
  # Application annotation that opts one app out when set to "true".
  annotation: canary-gate.younsl.github.io/skip
