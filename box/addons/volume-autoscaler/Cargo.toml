[package]
name = "volume-autoscaler"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Grows EC2 root volumes and Kubernetes PersistentVolumeClaims when usage crosses a threshold"
readme = "README.md"
repository = "https://github.com/younsl/addons"
default-run = "volume-autoscaler"

[lib]
name = "volume_autoscaler"
path = "src/lib.rs"

[[bin]]
name = "volume-autoscaler"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
doc = false

[dependencies]
# Async runtime
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-util = "0.7.20"
async-trait = "0.1.92"

# HTTP servers (health, metrics)
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

# HTTP client (Alertmanager, Grafana, Prometheus query API)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }

# AWS SDK
# Without default features: the legacy `rustls` feature links a second HTTP and
# TLS stack (hyper 0.14, rustls 0.21, ring) next to the one kube and reqwest use.
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-ec2 = { version = "1.267.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.128.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-smithy-types = "1.8.1"

# Kubernetes (Lease, Events, Nodes, claims and volumes, InstanceVolumeAutoscaler)
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32", "schemars"] }
schemars = "1.2.3"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# The process-wide rustls crypto provider, shared by AWS SDK, kube, and reqwest.
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"

# Time
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# Policy selectors (RE2-compatible syntax, as in the Go version)
regex = "1.13.1"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Metrics
prometheus = { version = "0.14.0", default-features = false }

[dev-dependencies]
wiremock = "0.6.5"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
# Paused-clock tests for the controller loop
tokio = { version = "1.53.2", features = ["test-util"] }
indoc = "2.0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Internal library shared by the controller and crdgen, not a published API
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_long_first_doc_paragraph = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
