{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "volume-autoscaler.fullname" . }}
  labels:
    {{- include "volume-autoscaler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs:
      - create
      - patch
      - update
  {{- if (include "volume-autoscaler.leaderElectEnabled" .) }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs:
      - get
      - create
      - update
  {{- end }}
  {{- if and (has "unused-volume-scan" .Values.controllers) (.Values.config.orphanPvcCleanup | default dict).enabled }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs:
      - create
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "volume-autoscaler.fullname" . }}-orphan-pvc
    verbs:
      - get
      - patch
  {{- end }}
{{- end }}
