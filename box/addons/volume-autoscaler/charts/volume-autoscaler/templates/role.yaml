{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "volume-autoscaler.fullname" . }}
  labels:
    {{- include "volume-autoscaler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs:
      - create
      - patch
      - update
  {{- if (include "volume-autoscaler.leaderElectEnabled" .) }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs:
      - get
      - create
      - update
  {{- end }}
{{- end }}
