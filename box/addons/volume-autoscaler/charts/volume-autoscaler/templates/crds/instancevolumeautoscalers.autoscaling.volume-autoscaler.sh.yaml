                              enum:
                              - Percent
                              - GiB
                              type: string
                            value:
                              description: The step size in the unit `type` names.
                              format: int32
                              minimum: 1.0
                              type: integer
                          required:
                          - type
                          - value
                          type: object
                        type: array
                      selectPolicy:
