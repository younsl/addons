                properties:
                  kind:
                    description: '`Instance` or `TagSelector`.'
                    enum:
                    - Instance
                    - TagSelector
                    type: string
                  name:
                    description: 'The EC2 instance ID, for `kind: Instance`.'
                    nullable: true
                    pattern: ^i-[0-9a-f]{8,17}$
                    type: string
                  tags:
                    additionalProperties:
                      maxLength: 256
                      minLength: 1
                      type: string
                    description: 'Tag key and value pairs an instance must all carry, for `kind: TagSelector`.'
                    maxProperties: 50
                    nullable: true
                    type: object
