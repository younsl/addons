                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              cooldownDuration:
                description: The cooldown in effect between two modifications of one volume, the default included.
                type: string
              currentVolumes:
                default: 0
                description: How many root EBS volumes the autoscaler currently targets, one per targeted instance with a resolvable root volume.
                format: int32
                type: integer
              instances:
                description: Per-instance observations from the latest pass.
                items:
                  description: One target instance as observed in the latest pass.
                  properties:
                    cooldownUntil:
                      description: When the volume may be modified again. Set while a cooldown runs, including right after a resize.
                      format: date-time
                      nullable: true
                      type: string
                    currentCapacity:
