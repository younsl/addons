            description: Automatically grows the root EBS volume of the EC2 instances that `scaleTargetRef` selects when root filesystem utilization crosses the metric target.
            properties:
              alertEnabled:
                default: true
                description: Sends Alertmanager alerts for this autoscaler's resizes. The controller-wide `alertmanager.enabled` switch remains the master gate.
                type: boolean
              behavior:
                default: {}
                description: How the volume grows once the target is crossed. The API server fills in the scale-up defaults when it is omitted.
                nullable: true
                properties:
                  scaleUp:
                    default: {}
                    description: Scale-up rules. Omitted means `Max` of 10 percent and 1 GiB.
                    nullable: true
                    properties:
                      cooldownDuration:
