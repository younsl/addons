                        description: Minimum time between two modifications of the same volume, in hours, minutes, and seconds (`6h`, `6h30m`, `90m`). At least `6h`, which is also the default, so a volume never exceeds the EBS limit of four modifications in a rolling 24 hours.
                        nullable: true
                        pattern: ^([0-9]+(h|m|s))+$
