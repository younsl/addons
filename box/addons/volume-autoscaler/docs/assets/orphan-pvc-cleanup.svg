<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 548">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#ededed;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#8f8f8f;font-size:11px}
    .l{fill:#666;font-size:11px}
    .k{fill:#8f8f8f;font-size:10.5px}
    .card{fill:#0a0a0a;stroke:#2e2e2e}
    .hi{fill:#0a0a0a;stroke:#ededed}
    .ns{fill:#050505;stroke:#262626}
    .edge{stroke:#525252;stroke-width:1.25;fill:none}
    .dash{stroke:#525252;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    .bound{fill:none;stroke:#2e2e2e;stroke-dasharray:4 4}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/>
    </marker>
  </defs>

  <rect width="1248" height="548" fill="#000"/>
  <rect width="1248" height="548" fill="url(#grid)"/>

  <text x="40" y="52" class="t h">Orphan PVC cleanup</text>
  <text x="40" y="76" class="t s">Opt-in from the ConfigMap. Deletes claims only, after a notice written on the claim itself.</text>

  <rect x="24" y="100" width="1200" height="388" rx="8" class="bound"/>
  <text x="40" y="122" class="t l">Kubernetes cluster</text>

  <!-- inputs -->
  <rect x="48" y="150" width="232" height="56" rx="6" class="card"/>
  <text x="64" y="174" class="t n">PVCs, PVs, Pods, StatefulSets</text>
  <text x="64" y="192" class="t d">unused volume scan, every 1h</text>

  <rect x="48" y="250" width="232" height="84" rx="6" class="card"/>
  <text x="64" y="274" class="t n">Workload Pod templates</text>
  <text x="64" y="292" class="t d">Deployments, ReplicaSets, DaemonSets</text>
  <text x="64" y="308" class="t d">StatefulSets, Jobs, CronJobs</text>
  <text x="64" y="324" class="t k">listed only while enabled</text>

  <rect x="48" y="360" width="232" height="72" rx="6" class="card"/>
  <text x="64" y="384" class="m n">ConfigMap</text>
  <text x="64" y="402" class="m k">orphanPvcCleanup</text>
  <text x="64" y="420" class="t d">enabled: false by default</text>

  <!-- controller -->
  <rect x="312" y="112" width="272" height="340" rx="8" class="ns"/>
  <text x="328" y="134" class="t l">volume-autoscaler Pod, leader</text>

  <rect x="332" y="150" width="232" height="56" rx="6" class="card"/>
  <text x="348" y="174" class="m n">classify()</text>
  <text x="348" y="192" class="t d">unused reason and unused-since</text>

  <rect x="332" y="250" width="232" height="84" rx="6" class="hi"/>
  <text x="348" y="274" class="m n">Policy.decide()</text>
  <text x="348" y="292" class="t d">reasons, minUnusedAge, namespaces</text>
  <text x="348" y="308" class="t d">guards: opt-out, owner, templates</text>
  <text x="348" y="324" class="t k">fails closed on any list error</text>

  <rect x="332" y="360" width="232" height="72" rx="6" class="card"/>
  <text x="348" y="384" class="m n">delete_due()</text>
  <text x="348" y="402" class="t d">Pod recheck, UID precondition</text>
  <text x="348" y="418" class="t d">longest unused first, capped</text>

  <path d="M280 178 H330" class="edge" marker-end="url(#arrow)"/>
  <path d="M280 292 H330" class="edge" marker-end="url(#arrow)"/>
  <path d="M280 396 H296 V320 H330" class="edge" marker-end="url(#arrow)"/>
  <path d="M448 206 V248" class="edge" marker-end="url(#arrow)"/>
  <path d="M448 334 V358" class="edge" marker-end="url(#arrow)"/>

  <!-- claim lifecycle -->
  <rect x="620" y="150" width="250" height="56" rx="6" class="card"/>
  <text x="636" y="174" class="t n">Unused</text>
  <text x="636" y="192" class="m k">volume-autoscaler.sh/unused-since</text>

  <rect x="620" y="250" width="250" height="84" rx="6" class="hi"/>
  <text x="636" y="274" class="t n">Scheduled</text>
  <text x="636" y="292" class="m k">orphan-pvc-delete-after</text>
  <text x="636" y="310" class="t d">Warning OrphanPvcDeletionScheduled</text>
  <text x="636" y="326" class="t k">opt out: orphan-pvc-cleanup=disabled</text>

  <rect x="620" y="360" width="250" height="72" rx="6" class="card"/>
  <text x="636" y="384" class="t n">Deleted</text>
  <text x="636" y="402" class="t d">PersistentVolumeClaim only</text>
  <text x="636" y="418" class="t d">Normal OrphanPvcDeleted</text>

  <path d="M564 178 H618" class="edge" marker-end="url(#arrow)"/>
  <text x="592" y="170" class="t l" text-anchor="middle">annotate</text>
  <path d="M564 292 H618" class="edge" marker-end="url(#arrow)"/>
  <text x="592" y="284" class="t l" text-anchor="middle">schedule</text>
  <path d="M564 396 H618" class="edge" marker-end="url(#arrow)"/>
  <text x="592" y="388" class="t l" text-anchor="middle">delete</text>

  <path d="M745 206 V248" class="edge" marker-end="url(#arrow)"/>
  <text x="757" y="232" class="t l">unused for minUnusedAge</text>
  <path d="M745 334 V358" class="edge" marker-end="url(#arrow)"/>
  <text x="757" y="350" class="t l">after noticePeriod</text>

  <!-- outcomes -->
  <rect x="920" y="250" width="280" height="84" rx="6" class="card"/>
  <text x="936" y="274" class="t n">Canceled</text>
  <text x="936" y="292" class="t d">deadline removed, Normal Event</text>
  <text x="936" y="308" class="t d">a new full notice if eligible again</text>
  <text x="936" y="324" class="t k">back in use, protected, or disabled</text>
  <path d="M870 292 H918" class="dash" marker-end="url(#arrow)"/>

  <rect x="920" y="352" width="280" height="52" rx="6" class="card"/>
  <text x="936" y="374" class="m n">reclaimPolicy: Delete</text>
  <text x="936" y="392" class="t d">CSI driver deletes the PV and EBS volume</text>

  <rect x="920" y="416" width="280" height="52" rx="6" class="card"/>
  <text x="936" y="438" class="m n">reclaimPolicy: Retain</text>
  <text x="936" y="456" class="t d">PV Released, EBS kept, still reported</text>

  <path d="M870 396 H895 V378 H918" class="edge" marker-end="url(#arrow)"/>
  <path d="M895 396 V442 H918" class="edge" marker-end="url(#arrow)"/>

  <text x="40" y="520" class="t s">Never deleted by the addon: PersistentVolumes and EBS volumes. No AWS API call is made.</text>
</svg>
