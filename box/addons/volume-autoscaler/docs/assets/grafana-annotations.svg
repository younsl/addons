<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 380">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#ededed;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#8f8f8f;font-size:11px}
    .l{fill:#666;font-size:11px}
    .k{fill:#8f8f8f;font-size:10.5px}
    .card{fill:#0a0a0a;stroke:#2e2e2e}
    .hi{fill:#0a0a0a;stroke:#ededed}
    .ns{fill:#050505;stroke:#262626}
    .edge{stroke:#525252;stroke-width:1.25;fill:none}
    .bound{fill:none;stroke:#2e2e2e;stroke-dasharray:4 4}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/>
    </marker>
  </defs>

  <rect width="1248" height="380" fill="#000"/>
  <rect width="1248" height="380" fill="url(#grid)"/>

  <text x="40" y="52" class="t h">Grafana annotations</text>
  <text x="40" y="76" class="t s">One POST per resize attempt. Dashboards pick the markers up by tag.</text>

  <rect x="24" y="100" width="1200" height="220" rx="8" class="bound"/>
  <text x="40" y="122" class="t l">Cluster: Kubernetes</text>

  <rect x="56" y="140" width="340" height="156" rx="8" class="ns"/>
  <text x="72" y="162" class="t l">Namespace: kube-system</text>
  <rect x="80" y="180" width="292" height="92" rx="6" class="hi"/>
  <text x="96" y="206" class="m n">volume-autoscaler</text>
  <text x="96" y="226" class="t d">resize completed or failed</text>
  <text x="96" y="252" class="m k">GRAFANA_API_TOKEN from a Secret</text>

  <rect x="852" y="140" width="340" height="156" rx="8" class="ns"/>
  <text x="868" y="162" class="t l">Namespace: monitoring</text>
  <rect x="876" y="180" width="292" height="92" rx="6" class="card"/>
  <text x="892" y="206" class="m n">grafana</text>
  <text x="892" y="226" class="m k">grafana.monitoring:3000</text>
  <text x="892" y="252" class="t d">dashboards draw markers by tag</text>

  <path d="M372 226 H874" class="edge" marker-end="url(#arrow)"/>
  <text x="623" y="212" class="m n" text-anchor="middle">POST /api/annotations</text>
  <text x="623" y="248" class="m k" text-anchor="middle">Authorization: Bearer token</text>
  <text x="623" y="266" class="t d" text-anchor="middle">tags event:ebs-resize, time and timeEnd</text>

  <text x="40" y="352" class="t s">Best effort: a failed POST is logged and never blocks a resize.</text>
</svg>
