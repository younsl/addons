<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#ededed;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#8f8f8f;font-size:11px}
    .l{fill:#666;font-size:11px}
    .k{fill:#8f8f8f;font-size:10.5px}
    .b{fill:#ededed;font-size:10px;font-weight:500}
    .bm{fill:#8f8f8f;font-size:10px;font-weight:500}
    .card{fill:#0a0a0a;stroke:#2e2e2e}
    .hi{fill:#0a0a0a;stroke:#ededed}
    .chip{fill:#111;stroke:#262626}
    .ns{fill:#050505;stroke:#262626}
    .edge{stroke:#525252;stroke-width:1.25;fill:none}
    .lead{stroke:#ededed;stroke-width:1.25;fill:none}
    .dash{stroke:#525252;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    .bound{fill:none;stroke:#2e2e2e;stroke-dasharray:4 4}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/>
    </marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ededed"/>
    </marker>
  </defs>

  <rect width="1120" height="600" fill="#000"/>
  <rect width="1120" height="600" fill="url(#grid)"/>

  <text x="40" y="52" class="t h">High availability</text>
  <text x="40" y="76" class="t s">Two replicas compete for one Lease. Only the holder reconciles, so the same volume never gets concurrent ModifyVolume calls</text>

  <rect x="40" y="108" width="672" height="420" rx="10" class="bound"/>
  <text x="56" y="130" class="t l">EKS cluster</text>
  <rect x="56" y="140" width="640" height="372" rx="8" class="ns"/>
  <text x="72" y="162" class="t l">Namespace <tspan class="m d">kube-system</tspan></text>

  <rect x="72" y="176" width="268" height="320" rx="8" class="bound"/>
  <text x="88" y="196" class="t l">Deployment <tspan class="m d">volume-autoscaler</tspan>, <tspan class="m d">replicas: 2</tspan></text>

  <rect x="88" y="208" width="236" height="112" rx="6" class="hi"/>
  <text x="104" y="236" class="t n">Pod A</text>
  <rect x="246" y="222" width="62" height="20" rx="10" fill="#ededed"/>
  <text x="277" y="236" text-anchor="middle" class="t b" fill="#000" style="fill:#000">leader</text>
  <text x="104" y="256" class="m k">volume-autoscaler-6c8d9-x2k4p</text>
  <text x="104" y="282" class="t d">Reconciles every autoscaler</text>
  <text x="104" y="300" class="t d">Renews the Lease every 2s</text>

  <rect x="88" y="360" width="236" height="112" rx="6" class="card"/>
  <text x="104" y="388" class="t n">Pod B</text>
  <rect x="236" y="374" width="72" height="20" rx="10" class="chip"/>
  <text x="272" y="388" text-anchor="middle" class="t bm">standby</text>
  <text x="104" y="408" class="m k">volume-autoscaler-6c8d9-q7m2n</text>
  <text x="104" y="434" class="t d">Reconcile loop stays off</text>
  <text x="104" y="452" class="t d">Tries to acquire every 2s</text>

  <rect x="420" y="332" width="260" height="164" rx="6" class="hi"/>
  <text x="436" y="360" class="t n">Lease <tspan class="m d">volume-autoscaler</tspan></text>
  <text x="436" y="380" class="m l">coordination.k8s.io/v1</text>
  <rect x="436" y="394" width="228" height="86" rx="4" class="chip"/>
  <text x="448" y="414" class="m k">holderIdentity: ...-x2k4p</text>
  <text x="448" y="432" class="m k">leaseDurationSeconds: 15</text>
  <text x="448" y="450" class="m k">renewTime: refreshed by leader</text>
  <text x="448" y="468" class="m k">leaseTransitions: 0</text>

  <path d="M324 296 H550 V328" class="lead" marker-end="url(#arrow-hi)"/>
  <text x="344" y="288" class="t l">renew</text>

  <path d="M324 416 H416" class="dash" marker-end="url(#arrow)"/>
  <text x="334" y="408" class="t l">acquire</text>

  <text x="760" y="196" class="t l">Leader only</text>
  <rect x="760" y="208" width="320" height="72" rx="6" class="card"/>
  <text x="776" y="236" class="t n">Kubernetes API</text>
  <text x="776" y="258" class="t d">autoscalers, claims, Nodes, Events</text>
  <rect x="760" y="300" width="320" height="72" rx="6" class="card"/>
  <text x="776" y="328" class="t n">AWS APIs</text>
  <text x="776" y="350" class="t d">EC2 ModifyVolume, SSM Run Command</text>

  <path d="M324 236 H756" class="lead" marker-end="url(#arrow-hi)"/>
  <path d="M728 236 V336 H756" class="lead" marker-end="url(#arrow-hi)"/>
  <text x="600" y="228" class="t l">reconcile</text>

  <text x="40" y="560" class="t s">Failover: when the leader stops renewing, the Lease expires after 15s and the standby acquires it, then starts reconciling.</text>
</svg>
