<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 330">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#ededed;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#8f8f8f;font-size:11px}
    .l{fill:#666;font-size:11px}
    .card{fill:#0a0a0a;stroke:#2e2e2e}
    .hi{fill:#0a0a0a;stroke:#ededed}
    .edge{stroke:#525252;stroke-width:1.25;fill:none}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/>
    </marker>
  </defs>

  <rect width="1248" height="330" fill="#000"/>
  <rect width="1248" height="330" fill="url(#grid)"/>

  <text x="40" y="52" class="t h">Report data flow</text>
  <text x="40" y="76" class="t s">A Trivy report travels from the edge cluster to the browser in four hops</text>

  <rect x="44" y="120" width="200" height="132" rx="6" class="card"/>
  <text x="60" y="144" class="t l">Edge cluster</text>
  <text x="60" y="164" class="t n">Trivy Operator</text>
  <text x="60" y="190" class="t d">creates a</text>
  <text x="60" y="206" class="m d">VulnerabilityReport</text>
  <text x="60" y="222" class="t d">or <tspan class="m">SbomReport</tspan></text>

  <rect x="284" y="120" width="200" height="132" rx="6" class="card"/>
  <text x="300" y="144" class="t l">scraper</text>
  <text x="300" y="164" class="t n">Per-cluster watcher</text>
  <text x="300" y="190" class="t d">tags the cluster name</text>
  <text x="300" y="206" class="t d">writes SQLite on emptyDir</text>
  <text x="300" y="222" class="t d">evaluates alert rules</text>

  <rect x="524" y="120" width="200" height="132" rx="6" class="card"/>
  <text x="540" y="144" class="t l">scraper</text>
  <text x="540" y="164" class="t n">Internal API <tspan class="m">:8081</tspan></text>
  <text x="540" y="190" class="t d">shared token auth</text>
  <text x="540" y="206" class="t d">NetworkPolicy fenced</text>

  <rect x="764" y="120" width="200" height="132" rx="6" class="card"/>
  <text x="780" y="144" class="t l">server</text>
  <text x="780" y="164" class="t n">Read proxy</text>
  <text x="780" y="190" class="t d">applies RBAC</text>
  <text x="780" y="206" class="t d">joins notes from ConfigMap</text>
  <text x="780" y="222" class="t d">renders the UI pages</text>

  <rect x="1004" y="120" width="200" height="132" rx="6" class="hi"/>
  <text x="1020" y="144" class="t l">Security engineer</text>
  <text x="1020" y="164" class="t n">Browser</text>
  <text x="1020" y="190" class="t d">Dashboard</text>
  <text x="1020" y="206" class="t d">Vulnerabilities</text>
  <text x="1020" y="222" class="t d">SBOM</text>

  <g class="edge" marker-end="url(#arrow)">
    <path d="M244 186 H278"/>
    <path d="M484 186 H518"/>
    <path d="M724 186 H758"/>
    <path d="M964 186 H998"/>
  </g>

  <text x="44" y="296" class="t l">Reports from the hub's own cluster enter through the local watcher and are tagged with the clusterName chart value.</text>
</svg>
