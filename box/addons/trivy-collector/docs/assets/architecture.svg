<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 520">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#ededed;font-size:20px;font-weight:600;letter-spacing:-0.4px}
    .s{fill:#a1a1a1;font-size:13px}
    .n{fill:#ededed;font-size:13px;font-weight:500}
    .d{fill:#8f8f8f;font-size:11px}
    .l{fill:#666;font-size:11px}
    .card{fill:#0a0a0a;stroke:#2e2e2e}
    .hi{fill:#0a0a0a;stroke:#ededed}
    .chip{fill:#111;stroke:#262626}
    .edge{stroke:#525252;stroke-width:1.25;fill:none}
    .bound{fill:none;stroke:#2e2e2e;stroke-dasharray:4 4}
    .ns{fill:#050505;stroke:#262626}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/>
    </marker>
  </defs>

  <rect width="1248" height="520" fill="#000"/>
  <rect width="1248" height="520" fill="url(#grid)"/>

  <text x="40" y="52" class="t h">trivy-collector</text>
  <text x="40" y="76" class="t s">The hub pulls Trivy reports from every edge cluster. Edges run nothing but a read-only ServiceAccount.</text>

  <rect x="40" y="236" width="140" height="64" rx="6" class="card"/>
  <text x="110" y="264" text-anchor="middle" class="t n">Security engineer</text>
  <text x="110" y="282" text-anchor="middle" class="t d">browser or API token</text>

  <rect x="216" y="108" width="640" height="392" rx="10" class="bound"/>
  <text x="232" y="130" class="t l">Hub cluster</text>

  <rect x="228" y="146" width="616" height="310" rx="8" class="ns"/>
  <text x="244" y="168" class="t l">Namespace <tspan class="m d">trivy-system</tspan></text>

  <rect x="240" y="212" width="176" height="112" rx="6" class="hi"/>
  <text x="256" y="236" class="t l">Deployment</text>
  <text x="256" y="256" class="m n">server</text>
  <text x="256" y="278" class="t d">UI and API on :3000</text>
  <text x="256" y="294" class="t d">no database</text>
  <text x="256" y="310" class="t d">scales out</text>

  <rect x="476" y="196" width="200" height="144" rx="6" class="card"/>
  <text x="492" y="220" class="t l">Deployment</text>
  <text x="492" y="240" class="m n">scraper</text>
  <text x="492" y="262" class="t d">one replica</text>
  <text x="492" y="278" class="t d">per-cluster watchers</text>
  <text x="492" y="294" class="t d">alert evaluator</text>
  <text x="492" y="310" class="t d">SQLite on emptyDir</text>
  <text x="492" y="326" class="t d">internal API on :8081</text>

  <rect x="240" y="384" width="140" height="56" rx="6" class="chip"/>
  <text x="256" y="406" class="t l">ConfigMap</text>
  <text x="256" y="424" class="m d">notes</text>
  <rect x="392" y="384" width="140" height="56" rx="6" class="chip"/>
  <text x="408" y="406" class="t l">Secret</text>
  <text x="408" y="424" class="m d">api-tokens</text>
  <rect x="544" y="384" width="140" height="56" rx="6" class="chip"/>
  <text x="560" y="406" class="t l">Secret, one per edge</text>
  <text x="560" y="424" class="m d">cluster</text>
  <text x="232" y="482" class="t l">State a person authored lives in API objects, so both pods restart without data loss.</text>

  <g>
    <rect x="900" y="150" width="308" height="140" rx="8" class="card"/>
    <text x="916" y="176" class="t n">Edge cluster A</text>
    <rect x="916" y="192" width="134" height="32" rx="5" class="chip"/>
    <text x="983" y="212" text-anchor="middle" class="t d">Trivy Operator</text>
    <rect x="1058" y="192" width="134" height="32" rx="5" class="chip"/>
    <text x="1125" y="212" text-anchor="middle" class="t d">read-only SA</text>
    <text x="916" y="252" class="m l">VulnerabilityReport</text>
    <text x="916" y="270" class="m l">SbomReport</text>
  </g>
  <g>
    <rect x="900" y="320" width="308" height="140" rx="8" class="card"/>
    <text x="916" y="346" class="t n">Edge cluster B</text>
    <rect x="916" y="362" width="134" height="32" rx="5" class="chip"/>
    <text x="983" y="382" text-anchor="middle" class="t d">Trivy Operator</text>
    <rect x="1058" y="362" width="134" height="32" rx="5" class="chip"/>
    <text x="1125" y="382" text-anchor="middle" class="t d">read-only SA</text>
    <text x="916" y="422" class="m l">VulnerabilityReport</text>
    <text x="916" y="440" class="m l">SbomReport</text>
  </g>

  <g class="edge" marker-end="url(#arrow)">
    <path d="M180 268 H234"/>
    <path d="M416 268 H470"/>
    <path d="M878 220 H894"/>
    <path d="M878 390 H894"/>
  </g>
  <path d="M676 268 H878 M878 220 V390" class="edge"/>
  <text x="207" y="260" text-anchor="middle" class="t l">view</text>
  <text x="446" y="258" text-anchor="middle" class="m l">:8081</text>
  <text x="777" y="258" text-anchor="middle" class="t l">watch with SA token</text>
</svg>
