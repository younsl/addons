<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="ij runs as a local process. It merges CLI flags with the file config, resolves MFA credentials once through STS AssumeRole, scans 22 AWS regions in parallel with EC2 DescribeInstances, shows a fuzzy-search TUI picker that can also start or stop instances, and finally spawns aws ssm start-session inside a PTY so the terminal talks to the instance through SSM Session Manager as a shell or a port-forwarding tunnel." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6dade"/>
    </marker>
    <marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c848c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#0a0a0b"/>

  <!-- boundaries -->
  <text x="30" y="36" fill="#6f767d" font-size="11.5" letter-spacing="1.6">LOCAL</text>
  <rect x="30" y="50" width="770" height="600" rx="10" fill="none" stroke="#33383e" stroke-dasharray="6 5"/>

  <text x="840" y="36" fill="#6f767d" font-size="11.5" letter-spacing="1.6">AWS</text>
  <rect x="840" y="50" width="330" height="600" rx="10" fill="none" stroke="#33383e" stroke-dasharray="6 5"/>

  <!-- terminal -->
  <rect x="60" y="120" width="140" height="422" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="130" y="326" fill="#e6e9ec" font-size="14" text-anchor="middle">Terminal</text>
  <text x="130" y="348" fill="#8d949b" font-size="11" text-anchor="middle">stdin / stdout</text>

  <!-- ij process -->
  <rect x="280" y="80" width="490" height="490" rx="8" fill="#0f1113" stroke="#2b3036"/>
  <text x="300" y="106" fill="#8d949b" font-size="11.5" letter-spacing="1.6">ij PROCESS</text>

  <rect x="310" y="120" width="430" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="334" y="146" fill="#e6e9ec" font-size="14">Config</text>
  <text x="334" y="167" fill="#8d949b" font-size="11">flags override ~/.config/ij/config.yaml, then AWS_PROFILE</text>

  <rect x="310" y="210" width="430" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="334" y="236" fill="#e6e9ec" font-size="14">MFA resolver</text>
  <text x="334" y="257" fill="#8d949b" font-size="11">mfa_serial from ~/.aws/config, credentials cached in-memory</text>

  <rect x="310" y="300" width="430" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="334" y="326" fill="#e6e9ec" font-size="14">Region scanner</text>
  <text x="334" y="347" fill="#8d949b" font-size="11">tokio task per region, tag filter, merged into one table</text>

  <rect x="310" y="390" width="430" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="334" y="416" fill="#e6e9ec" font-size="14">TUI picker</text>
  <text x="334" y="437" fill="#8d949b" font-size="11">ratatui, nucleo fuzzy search, state column, confirm modal</text>

  <rect x="310" y="480" width="430" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="334" y="506" fill="#e6e9ec" font-size="14">Session</text>
  <text x="334" y="527" fill="#8d949b" font-size="11">PTY raw mode, Enter ~ . escape, session-manager-plugin child</text>

  <!-- stage flow -->
  <line x1="525" y1="182" x2="525" y2="204" stroke="#7c848c" marker-end="url(#a-dim)"/>
  <line x1="525" y1="272" x2="525" y2="294" stroke="#7c848c" marker-end="url(#a-dim)"/>
  <line x1="525" y1="362" x2="525" y2="384" stroke="#7c848c" marker-end="url(#a-dim)"/>
  <line x1="525" y1="452" x2="525" y2="474" stroke="#7c848c" marker-end="url(#a-dim)"/>

  <!-- aws -->
  <rect x="870" y="210" width="270" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="894" y="236" fill="#e6e9ec" font-size="14">STS</text>
  <text x="894" y="257" fill="#8d949b" font-size="11">AssumeRole with OTP</text>

  <rect x="870" y="300" width="270" height="152" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="894" y="326" fill="#e6e9ec" font-size="14">EC2 API</text>
  <text x="894" y="347" fill="#8d949b" font-size="11">DescribeInstances</text>
  <text x="894" y="437" fill="#8d949b" font-size="11">StartInstances / StopInstances</text>

  <rect x="870" y="480" width="270" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="894" y="506" fill="#e6e9ec" font-size="14">SSM Session Manager</text>
  <text x="894" y="527" fill="#8d949b" font-size="11">shell or port-forwarding document</text>

  <rect x="870" y="570" width="270" height="62" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="894" y="596" fill="#e6e9ec" font-size="14">EC2 instance</text>
  <text x="894" y="617" fill="#8d949b" font-size="11">SSM Agent, or remote host via -L</text>

  <!-- terminal edges -->
  <line x1="200" y1="151" x2="304" y2="151" stroke="#d6dade" marker-end="url(#a)"/>
  <text x="252" y="140" fill="#a8afb6" font-size="10.5" text-anchor="middle">ij prod</text>

  <line x1="206" y1="241" x2="304" y2="241" stroke="#7c848c" stroke-dasharray="5 4" marker-start="url(#a-dim)" marker-end="url(#a-dim)"/>
  <text x="255" y="230" fill="#a8afb6" font-size="10.5" text-anchor="middle">OTP once</text>

  <line x1="200" y1="421" x2="304" y2="421" stroke="#d6dade" marker-end="url(#a)"/>
  <text x="252" y="410" fill="#a8afb6" font-size="10.5" text-anchor="middle">keys</text>

  <line x1="206" y1="511" x2="304" y2="511" stroke="#d6dade" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="255" y="500" fill="#a8afb6" font-size="10.5" text-anchor="middle">PTY I/O</text>

  <!-- aws edges -->
  <line x1="740" y1="241" x2="864" y2="241" stroke="#d6dade" marker-end="url(#a)"/>
  <text x="802" y="230" fill="#a8afb6" font-size="10.5" text-anchor="middle">AssumeRole</text>
  <text x="802" y="258" fill="#7c848c" font-size="10.5" text-anchor="middle">temporary creds</text>

  <line x1="740" y1="331" x2="864" y2="331" stroke="#d6dade" marker-end="url(#a)"/>
  <text x="802" y="320" fill="#a8afb6" font-size="10.5" text-anchor="middle">DescribeInstances</text>
  <text x="802" y="348" fill="#7c848c" font-size="10.5" text-anchor="middle">22 regions, parallel</text>

  <line x1="740" y1="421" x2="864" y2="421" stroke="#7c848c" stroke-dasharray="5 4" marker-end="url(#a-dim)"/>
  <text x="802" y="410" fill="#a8afb6" font-size="10.5" text-anchor="middle">Start / Stop</text>
  <text x="802" y="438" fill="#7c848c" font-size="10.5" text-anchor="middle">Ctrl+B / Ctrl+S</text>

  <line x1="740" y1="511" x2="864" y2="511" stroke="#d6dade" marker-end="url(#a)"/>
  <text x="802" y="500" fill="#a8afb6" font-size="10.5" text-anchor="middle">ssm start-session</text>
  <text x="802" y="528" fill="#7c848c" font-size="10.5" text-anchor="middle">shell or -L tunnel</text>

  <line x1="1005" y1="542" x2="1005" y2="564" stroke="#d6dade" marker-end="url(#a)"/>
</svg>
