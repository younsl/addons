{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dsa-cluster-rolebinding
subjects:
  - kind: ServiceAccount
    name: dsa-service-account
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: dsa-cluster-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
