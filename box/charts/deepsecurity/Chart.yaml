apiVersion: v2
name: deepsecurity
description: Installs and activates the Trend Micro Deep Security Agent on every Linux node through a privileged DaemonSet.
type: application
version: 0.1.0
appVersion: 1.0.0
kubeVersion: '>=1.27.0-0'
keywords:
  - deep-security
  - trend-micro
  - security
  - daemonset
home: https://github.com/younsl/addons/tree/main/box/charts/deepsecurity
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
sources:
  - https://github.com/younsl/addons
annotations:
  "helm.sh/skip-test": "true"
  "helm.sh/skip-test-reason": "Requires a reachable Deep Security Manager"
  artifacthub.io/changes: |
    - kind: added
      description: Initial release of the Deep Security Agent DaemonSet chart.
