{{- if .Values.storage.migration.enabled }}
{{- include "forklift.validateStorage" . }}
{{- $source := .Values.storage.migration.sourceObjectStorage }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "forklift.migrationJobName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "forklift.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.storage.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.storage.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      {{- with .Values.storage.migration.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "forklift.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "forklift.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ include "forklift.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - migrate-storage
            - --lease-name={{ include "forklift.leaseName" . }}
            - --writer-selector=app.kubernetes.io/name={{ include "forklift.name" . }},app.kubernetes.io/instance={{ .Release.Name }}
            - --concurrency={{ .Values.storage.migration.concurrency }}
            - --wait={{ .Values.storage.migration.wait }}
            - --staging=/tmp
            - --verify={{ .Values.storage.migration.verify }}
            - --verify-sample-percent={{ .Values.storage.migration.verifySamplePercent }}
            {{- if .Values.storage.migration.dryRun }}
            - --dry-run
            {{- end }}
            {{- if .Values.storage.migration.overwriteMeta }}
            - --overwrite-meta
            {{- end }}
            {{- if .Values.storage.migration.allowMissingSourceBlobs }}
            - --allow-missing-source-blobs
            {{- end }}
            {{- if gt (int .Values.replicaCount) 1 }}
            - --require-conditional-writes
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FORKLIFT_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            - name: FORKLIFT_STORAGE_BACKEND
              value: "s3"
            - name: FORKLIFT_STORAGE_S3_BUCKET
              value: {{ $source.bucket | quote }}
            - name: FORKLIFT_STORAGE_S3_PREFIX
              value: {{ $source.prefix | quote }}
            - name: FORKLIFT_STORAGE_S3_REGION
              value: {{ $source.region | quote }}
            - name: FORKLIFT_STORAGE_S3_ENDPOINT
              value: {{ $source.endpoint | quote }}
            - name: FORKLIFT_STORAGE_S3_FORCE_PATH_STYLE
              value: {{ $source.forcePathStyle | quote }}
            {{- with $source.existingSecret }}
            - name: FORKLIFT_STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: access-key-id
            - name: FORKLIFT_STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: secret-access-key
            {{- end }}
            - name: FORKLIFT_MIGRATE_TO_S3_BUCKET
              value: {{ include "forklift.s3Bucket" . | quote }}
            - name: FORKLIFT_MIGRATE_TO_S3_PREFIX
              value: {{ .Values.storage.s3.prefix | quote }}
            - name: FORKLIFT_MIGRATE_TO_S3_REGION
              value: {{ include "forklift.s3Region" . | quote }}
            - name: FORKLIFT_MIGRATE_TO_S3_ENDPOINT
              value: {{ include "forklift.s3Endpoint" . | quote }}
            - name: FORKLIFT_MIGRATE_TO_S3_FORCE_PATH_STYLE
              value: {{ or .Values.storage.s3.forcePathStyle .Values.seaweedfs.enabled | quote }}
            - name: FORKLIFT_MIGRATE_TO_S3_PROVIDER
              value: {{ include "forklift.s3Provider" . | quote }}
            - name: FORKLIFT_MIGRATE_TO_S3_ADMIN_ENDPOINT
              value: {{ include "forklift.s3AdminEndpoint" . | quote }}
            - name: FORKLIFT_MIGRATE_TO_S3_CREATE_BUCKET
              value: {{ or .Values.storage.s3.createBucket .Values.seaweedfs.enabled | quote }}
            {{- with (include "forklift.s3CredSecret" .) }}
            - name: FORKLIFT_MIGRATE_TO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: access-key-id
            - name: FORKLIFT_MIGRATE_TO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: secret-access-key
            {{- end }}
            {{- if .Values.storage.s3.existingSecret }}
            - name: FORKLIFT_MIGRATE_TO_S3_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret }}
                  key: admin-token
                  optional: true
            {{- else if .Values.storage.s3.adminToken }}
            - name: FORKLIFT_MIGRATE_TO_S3_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "forklift.fullname" . }}
                  key: s3-admin-token
            {{- end }}
          {{- with .Values.storage.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: staging
              mountPath: /tmp
      volumes:
        - name: staging
          emptyDir:
            {{- with .Values.storage.migration.stagingSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
