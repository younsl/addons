{{- $s3 := .Values.seaweedfs.allInOne.s3 | default dict }}
{{- if and .Values.seaweedfs.enabled $s3.existingConfigSecret }}
{{- $admin := .Values.seaweedfs.s3.credentials.admin | default dict }}
{{- $access := $admin.accessKey }}
{{- $secret := $admin.secretKey }}
{{- if $admin.existingSecret }}
{{- $access = "${SEAWEEDFS_S3_ADMIN_ACCESS_KEY_ID}" }}
{{- $secret = "${SEAWEEDFS_S3_ADMIN_SECRET_ACCESS_KEY}" }}
{{- else if not (and $access $secret) }}
{{- fail "seaweedfs.s3.credentials.admin needs accessKey and secretKey, or existingSecret" }}
{{- end }}
{{- $identities := dict "identities" (list (dict "name" "anvAdmin" "credentials" (list (dict "accessKey" $access "secretKey" $secret)) "actions" (list "Admin" "Read" "Write"))) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $s3.existingConfigSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forklift.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
stringData:
  seaweedfs_s3_config: {{ toJson $identities | quote }}
{{- end }}
