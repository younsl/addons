apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.15.0
appVersion: "0.15.0"
home: https://github.com/younsl/addons/tree/main/box/forklift
sources:
  - https://github.com/younsl/addons/tree/main/box/forklift/charts/forklift
dependencies:
  - name: seaweedfs
    version: "4.48.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Storage page shows a live one-hour object-store health timeline from a HeadBucket check every minute"
    - kind: added
      description: "forklift_storage_up and forklift_storage_check_duration_seconds metrics for object-store availability"
    - kind: added
      description: "Storage overview shows the provider logo, server version and a copyable endpoint"
    - kind: changed
      description: "Migration reports open as a linkable page and their JSON includes the report location and size"
    - kind: changed
      description: "The bundled SeaweedFS skips its bucket hook Job by default, so an Argo CD sync no longer waits on a hook pod that cannot start"
    - kind: fixed
      description: "Failing check IDs in the migration history no longer overlap the row arrow"
