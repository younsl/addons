[package]
name = "valcon"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Younsung Lee <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Terminal UI for ElastiCache (Valkey and Redis OSS): items, connections, connected pods, and read-only key browsing"
repository = "https://github.com/younsl/addons"
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-cloudwatch = "1.140.0"
aws-sdk-ec2 = "1.274.0"
aws-sdk-elasticache = "1.129.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["v1_36"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "ws", "rustls-tls", "aws-lc-rs"] }
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
