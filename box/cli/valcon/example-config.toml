# Copy to $XDG_CONFIG_HOME/valcon/config.toml (default ~/.config/valcon/config.toml) or pass --config.
# Flags and their env vars override every value here. AWS_PROFILE and AWS_REGION win over the file.

default_target = "prod"

[defaults]
aws_region = "us-east-1"
interval = 15
parallel = 10
exec_timeout = 10
port = 6379
# Mirror this image in a private registry if nodes cannot pull from Docker Hub.
probe_image = "valkey/valkey:9.1.3-alpine"
probe_timeout = 60

[targets.prod]
context = "prod"
namespaces = ["orders", "checkout"]

[targets.staging]
context = "staging"
all_namespaces = true
selector = "app.kubernetes.io/part-of=shop"
