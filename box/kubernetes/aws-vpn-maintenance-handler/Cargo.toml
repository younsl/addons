[package]
name = "aws-vpn-maintenance-handler"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Owns AWS Site-to-Site VPN tunnel endpoint maintenance, applying it in a maintenance window after Slack approval"
readme = "README.md"
repository = "https://github.com/younsl/addons"

[[bin]]
name = "aws-vpn-maintenance-handler"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"

# HTTP servers (health, metrics)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# HTTP client (Slack Web API, Prometheus query API). Pinned to 0.12 because kube
# depends on reqwest 0.12; a second major would link two HTTP stacks.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Slack Socket Mode (outbound WebSocket)
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-sts = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"

# Kubernetes (Lease, ConfigMap, Events)
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
# Pin the process-wide rustls crypto provider. Both `ring` (reqwest) and
# `aws-lc-rs` (AWS SDK, kube) get linked, so rustls cannot auto-pick a default.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
croner = "3"
humantime = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus-client = "0.25"

# Misc
rand = "0.9"

[dev-dependencies]
aws-smithy-mocks = "0.3"
aws-sdk-ec2 = { version = "1", features = ["test-util"] }
aws-sdk-sts = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
