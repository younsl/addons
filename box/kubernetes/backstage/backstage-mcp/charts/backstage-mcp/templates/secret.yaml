{{- if and (not .Values.backstage.existingSecret) .Values.backstage.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage-mcp.backstageSecretName" . }}
  labels:
    {{- include "backstage-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  BACKSTAGE_TOKEN: {{ .Values.backstage.token | quote }}
{{- end }}
{{- if and (not .Values.mcp.existingSecret) .Values.mcp.bearerToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage-mcp.mcpSecretName" . }}
  labels:
    {{- include "backstage-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_BEARER_TOKEN: {{ .Values.mcp.bearerToken | quote }}
  # The full header value, which is what a kagent RemoteMCPServer reads
  # through headersFrom.
  AUTHORIZATION: {{ printf "Bearer %s" .Values.mcp.bearerToken | quote }}
{{- end }}
