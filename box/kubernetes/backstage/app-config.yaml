app:
  title: Backstage
  baseUrl: http://localhost:3000
  plugins:
    opencost: true
  platforms:
    - name: Grafana
      category: Observability
      description: Metrics visualization and dashboards
      url: https://grafana.example.com
      logo: https://cdn.jsdelivr.net/gh/grafana/grafana@main/public/img/grafana_icon.svg
      tags: shared
    - name: ArgoCD
      category: CI/CD
      description: GitOps continuous delivery
      url: https://argocd.example.com
      logo: https://argo-cd.readthedocs.io/en/stable/assets/logo.png
      tags: shared
    - name: QueryPie (nonprd)
      category: Data
      description: Data access governance platform
      url: https://querypie-nonprd.example.com
      logo: https://backstage.io/logo_assets/svg/Icon_Teal.svg
      tags: nonprd
      # Optional, defaults to false. true marks the platform as heading for
      # retirement in both card and grid view.
      deprecated: false
    - name: QueryPie (prd)
      category: Data
      description: Data access governance platform
      url: https://querypie-prd.example.com
      logo: https://backstage.io/logo_assets/svg/Icon_Teal.svg
      tags: prd
    - name: Jenkins
      category: CI/CD
      description: Legacy build server, migrating to ArgoCD
      url: https://jenkins.example.com
      logo: https://www.jenkins.io/images/logos/jenkins/jenkins.svg
      tags: shared
      # Still listed and still linked, but greyed out and faded with a
      # "Deprecated" badge in both card and grid view.
      deprecated: true

organization:
  name: DevOps Portal

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  auditor:
    severityLogLevelMappings:
      low: debug
      medium: info
      high: info
      critical: error
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    # Empty object (not the ':memory:' string) so the type stays consistent with
    # higher-priority overrides that set connection as an object (app-config.local.yaml
    # uses { directory }, Helm values.yaml uses pg). Backstage 1.51.0+ errors on a
    # string-vs-object merge conflict across config sources. With no filename,
    # better-sqlite3 defaults to an in-memory DB, so the base default is unchanged.
    connection: {}
  auth:
    dangerouslyDisableDefaultAuthPolicy: true
    # Static token for backstage-mcp. Declared in app-config.local.yaml or the
    # Helm values rather than here, because a `${VAR}` that is not set makes
    # the backend refuse to start.
    # externalAccess:
    #   - type: static
    #     options:
    #       token: ${BACKSTAGE_MCP_TOKEN}
    #       subject: backstage-mcp
    #     accessRestrictions:
    #       - plugin: catalog
    #       - plugin: search
    #       - plugin: techdocs
    #       - plugin: platforms
    #       - plugin: opencost

integrations:
  gitlab:
    - host: ${GITLAB_HOST}
      token: ${GITLAB_TOKEN}
      apiBaseUrl: https://${GITLAB_HOST}/api/v4

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User, Template]
  providers:
    gitlab:
      yourProviderId:
        host: ${GITLAB_HOST}
        branch: main
        fallbackBranch: master
        skipForkedRepos: false
        entityFilename: catalog-info.yaml
        schedule:
          frequency: { minutes: 1 }
          timeout: { minutes: 3 }
          initialDelay: { seconds: 10 }
    gitlabOrg:
      yourOrgProviderId:
        host: ${GITLAB_HOST}
        schedule:
          frequency: { hours: 1 }
          timeout: { minutes: 5 }
          initialDelay: { seconds: 30 }
    keycloakOrg:
      yourProviderId:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: ${KEYCLOAK_REALM}
        realm: ${KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CATALOG_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CATALOG_CLIENT_SECRET}
        briefRepresentation: false
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
          initialDelay: { seconds: 30 }
  locations:
    - type: file
      target: ../../templates/register-component/template.yaml
      rules:
        - allow: [Template]

enableExperimentalRedirectFlow: true

auth:
  environment: development
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      development:
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        metadataUrl: ${KEYCLOAK_METADATA_URL}
        prompt: auto
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

scaffolder:
  defaultScmIntegrations: true

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

permission:
  # -- (list) Admin user entity refs granted access to admin-gated routes
  admins:
    # - user:development/guest
    - user:default/admin1
    - user:default/admin2

opencost:
  timezone: Asia/Seoul
  clusters:
    - name: shared
      alias: Shared
      url: ${OPENCOST_SHARED_URL}
    - name: dev
      alias: Dev
      url: ${OPENCOST_DEV_URL}
    - name: stg
      alias: Stage
      url: ${OPENCOST_STG_URL}
    - name: sb
      alias: Sandbox
      url: ${OPENCOST_SB_URL}
    - name: prd
      alias: Production
      url: ${OPENCOST_PRD_URL}

search:
  collators:
    catalog:
      schedule:
        frequency: { minutes: 1 }
        timeout: { minutes: 15 }
        initialDelay: { seconds: 10 }
