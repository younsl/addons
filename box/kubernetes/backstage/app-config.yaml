app:
  title: Backstage
  baseUrl: http://localhost:3000
  gitlab:
    host: ${GITLAB_HOST}
  plugins:
    catalogHealth: true
    argocdAppSet: true
    iamUserAudit: true
    s3LogExtract: true
    opencost: true
    gitlabTokenAudit: true
    opensearchAccount: true
    opensearchViewer: true
    opensearchScaling: true
    pat: true
  platforms:
    - name: Grafana
      category: Observability
      description: Metrics visualization and dashboards
      url: https://grafana.example.com
      logo: https://cdn.jsdelivr.net/gh/grafana/grafana@main/public/img/grafana_icon.svg
      tags: shared
    - name: ArgoCD
      category: CI/CD
      description: GitOps continuous delivery
      url: https://argocd.example.com
      logo: https://argo-cd.readthedocs.io/en/stable/assets/logo.png
      tags: shared
    - name: QueryPie (nonprd)
      category: Data
      description: Data access governance platform
      url: https://querypie-nonprd.example.com
      logo: https://backstage.io/logo_assets/svg/Icon_Teal.svg
      tags: nonprd
      # Optional, defaults to false. true marks the platform as heading for
      # retirement in both card and grid view.
      deprecated: false
    - name: QueryPie (prd)
      category: Data
      description: Data access governance platform
      url: https://querypie-prd.example.com
      logo: https://backstage.io/logo_assets/svg/Icon_Teal.svg
      tags: prd
    - name: Jenkins
      category: CI/CD
      description: Legacy build server, migrating to ArgoCD
      url: https://jenkins.example.com
      logo: https://www.jenkins.io/images/logos/jenkins/jenkins.svg
      tags: shared
      # Still listed and still linked, but greyed out and faded with a
      # "Deprecated" badge in both card and grid view.
      deprecated: true

organization:
  name: DevOps Portal

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  auditor:
    severityLogLevelMappings:
      low: debug
      medium: info
      high: info
      critical: error
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    # Empty object (not the ':memory:' string) so the type stays consistent with
    # higher-priority overrides that set connection as an object (app-config.local.yaml
    # uses { directory }, Helm values.yaml uses pg). Backstage 1.51.0+ errors on a
    # string-vs-object merge conflict across config sources. With no filename,
    # better-sqlite3 defaults to an in-memory DB, so the base default is unchanged.
    connection: {}
  auth:
    dangerouslyDisableDefaultAuthPolicy: true
    # Static token for backstage-mcp. Declared in app-config.local.yaml or the
    # Helm values rather than here, because a `${VAR}` that is not set makes
    # the backend refuse to start.
    # externalAccess:
    #   - type: static
    #     options:
    #       token: ${BACKSTAGE_MCP_TOKEN}
    #       subject: backstage-mcp
    #     accessRestrictions:
    #       - plugin: catalog
    #       - plugin: search
    #       - plugin: techdocs
    #       - plugin: platforms
    #       - plugin: openapi-registry
    #       - plugin: catalog-health
    #       - plugin: argocd-appset
    #       - plugin: gitlab-token-audit
    #       - plugin: opencost
    #       - plugin: iam-user-audit
    #       - plugin: opensearch-account
    #       - plugin: opensearch-viewer
    #       - plugin: opensearch-scaling
    #       - plugin: s3-log-extract
  reading:
    allow:
      - host: localhost:7007

integrations:
  gitlab:
    - host: ${GITLAB_HOST}
      token: ${GITLAB_TOKEN}
      apiBaseUrl: https://${GITLAB_HOST}/api/v4

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User, Template]
  providers:
    gitlab:
      yourProviderId:
        host: ${GITLAB_HOST}
        branch: main
        fallbackBranch: master
        skipForkedRepos: false
        entityFilename: catalog-info.yaml
        schedule:
          frequency: { minutes: 1 }
          timeout: { minutes: 3 }
          initialDelay: { seconds: 10 }
    gitlabOrg:
      yourOrgProviderId:
        host: ${GITLAB_HOST}
        schedule:
          frequency: { hours: 1 }
          timeout: { minutes: 5 }
          initialDelay: { seconds: 30 }
    keycloakOrg:
      yourProviderId:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: ${KEYCLOAK_REALM}
        realm: ${KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CATALOG_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CATALOG_CLIENT_SECRET}
        briefRepresentation: false
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
          initialDelay: { seconds: 30 }
  locations:
    - type: file
      target: ../../templates/register-component/template.yaml
      rules:
        - allow: [Template]

enableExperimentalRedirectFlow: true

auth:
  environment: development
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      development:
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        metadataUrl: ${KEYCLOAK_METADATA_URL}
        prompt: auto
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

scaffolder:
  defaultScmIntegrations: true

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

gitlab:
  defaultCodeOwnersPath: CODEOWNERS
  defaultReadmePath: README.md
  allowedKinds:
    - Component
    - Resource

sonarqube:
  baseUrl: ${SONARQUBE_BASE_URL}
  apiKey: ${SONARQUBE_API_KEY}

argocdApplicationSet:
  kubernetes:
    # -- (string) Optional in-cluster SA token; in-cluster mode uses pod SA automatically
    # serviceAccountToken: ${K8S_SA_TOKEN}
    # -- (string) Namespace where ApplicationSets are deployed. The service account needs
    # get/list/watch on argoproj.io applicationsets plus list on applications, which supply
    # the chart and app version detail. Without the latter the plugin still lists
    # ApplicationSets, only with no version detail
    namespace: argocd
  chartMetadata:
    # -- (bool) Read Chart.yaml from the git repository to resolve the upstream chart
    # version. An Application sourced from a git path records only the git revision, so
    # without this the Chart Version column is empty for every such Application. Reuses
    # the integrations.gitlab token
    enabled: true
    # -- (int) Cache lifetime for a Chart.yaml read, keyed by repository, path and branch.
    # Keyed on the branch rather than the synced commit, so a push does not invalidate
    # every entry at once
    ttlMinutes: 60
  upstreamChart:
    # -- (int) Cache lifetime for an upstream version lookup. Queried only when a reader
    # asks, never on the refresh schedule, since a Helm repository index is far too large
    # to pull every minute
    ttlMinutes: 360
    # -- (int) Seconds after a scan finishes before another may start. Enforced on the
    # backend, so the wait applies to every reader rather than to one browser
    scanCooldownSeconds: 60
  slack:
    # -- (string) Slack webhook URL for ApplicationSet notifications
    webhookUrl: ${SLACK_WEBHOOK_URL}
  schedule:
    # -- (string) Cron for ApplicationSet fetch. Defaults to every 1 minute when omitted
    # fetchCron: '*/5 * * * *'
    # -- (string) Cron for Slack notification. Evaluated in UTC
    cron: '0 10-11,14-18 * * 1-5'

iamUserAudit:
  # -- (bool) When true, password reset is logged only (no AWS API call, no Slack notification)
  dryRun: true
  # -- (int) Days of inactivity to flag a user
  inactiveDays: 90
  # -- (int) Days before threshold to send warning DM
  warningDays: 14
  # -- (string) AWS region for IAM API (IAM is global, but SDK needs a region)
  region: us-east-1
  # -- (string) IAM role ARN to assume for API calls. In production, EKS Pod Identity provides credentials directly
  # assumeRoleArn: arn:aws:iam::123456789012:role/backstage-iam-user-audit-role
  slack:
    # -- (string) Slack webhook URL for warning notifications
    webhookUrl: ${SLACK_WEBHOOK_URL}
    # -- (string) Slack bot token (xoxb-...) for DM on approval. Requires scopes: users:read.email, chat:write
    botToken: ${IAM_AUDIT_SLACK_BOT_TOKEN}
  schedule:
    # -- (string) Cron for fetching IAM user data. Evaluated in UTC
    fetchCron: '*/5 * * * *'
    # -- (string) Cron for Slack notification. Evaluated in UTC
    cron: '0 10 * * 1-5'

slackMrBot:
  # -- (bool) Enable the Slack MR review request bot (Socket Mode)
  enabled: true
  # -- (string) Slack bot token (xoxb-...). Requires scopes: commands, chat:write. Add users:read, users:read.email to mention approvers instead of naming them
  botToken: ${SLACK_MR_BOT_TOKEN}
  # -- (string) Slack app-level token (xapp-...) for Socket Mode. Requires scope: connections:write
  appToken: ${SLACK_MR_BOT_APP_TOKEN}
  # -- (string) Slash command registered in the Slack app
  command: /mr
  # -- (string) First line of the posted message
  headerText: 'MR 리뷰 부탁드립니다~'
  # -- (object) Thread replies as reviewers approve and someone merges. Every key has a default, so this block can be omitted
  # reviewNotify:
  #   # -- (bool) Follow posted requests and reply in their thread (default: true)
  #   enabled: true
  #   # -- (number) How often to poll the provider for tracked requests (default: 60)
  #   pollIntervalSeconds: 60
  #   # -- (number) Stop following a request this many days after it was posted (default: 14)
  #   trackDays: 14
  # -- (object) Review providers. Omit to reuse the `integrations` hosts and tokens
  # providers:
  #   gitlab:
  #     - host: gitlab.example.com
  #       apiBaseUrl: https://gitlab.example.com/api/v4
  #       token: ${GITLAB_TOKEN}

s3LogExtract:
  # -- (string) S3 bucket name
  bucket: ${S3_LOG_BUCKET}
  # -- (string) S3 key prefix
  prefix: ${S3_LOG_PREFIX}
  # -- (string) AWS region of the S3 bucket
  region: ap-northeast-2
  # -- (string) IAM role ARN to assume for S3 access (for local dev or cross-account)
  # assumeRoleArn: arn:aws:iam::123456789012:role/backstage-s3-log-extract

catalogHealth:
  # -- (int) Concurrent requests when checking catalog-info.yaml
  concurrency: 10
  schedule:
    # -- (string) Cron for GitLab scan
    cron: '0 * * * *'

permission:
  # -- (list) Admin user entity refs granted access to admin-gated routes
  admins:
    # - user:development/guest
    - user:default/admin1
    - user:default/admin2

# Personal access tokens for external systems. Only permission.admins can
# issue them; each token is scoped per plugin (read or write) and expires.
pat:
  # -- (int) Longest lifetime an admin may pick, in days. Hard-capped at 365.
  maxExpiryDays: 365
  audit:
    # -- (int) Days to keep api call and token lifecycle events.
    retentionDays: 365
  # -- (list) Plugins a token may be scoped to. The pat plugin itself is
  # never scopable. A token can only reach /api/<id> for ids listed here.
  scopablePlugins:
    - id: catalog
      label: Catalog
      description: Entities, locations and refresh
    - id: search
      label: Search
    - id: techdocs
      label: TechDocs
    - id: scaffolder
      label: Scaffolder
      description: Templates and task runs
    - id: platforms
      label: Platforms
    - id: openapi-registry
      label: API Registry
    - id: catalog-health
      label: Catalog Health
    - id: argocd-appset
      label: ArgoCD AppSets
    - id: gitlab-token-audit
      label: GitLab Token Audit
    - id: opencost
      label: OpenCost
    - id: iam-user-audit
      label: IAM User Audit
    - id: s3-log-extract
      label: S3 Log Extract
    - id: opensearch-account
      label: OpenSearch Account
    - id: opensearch-viewer
      label: OpenSearch Viewer
    - id: opensearch-scaling
      label: OpenSearch Scaling

opencost:
  timezone: Asia/Seoul
  clusters:
    - name: shared
      alias: Shared
      url: ${OPENCOST_SHARED_URL}
    - name: dev
      alias: Dev
      url: ${OPENCOST_DEV_URL}
    - name: stg
      alias: Stage
      url: ${OPENCOST_STG_URL}
    - name: sb
      alias: Sandbox
      url: ${OPENCOST_SB_URL}
    - name: prd
      alias: Production
      url: ${OPENCOST_PRD_URL}

opensearchAccount:
  # -- (string) OpenSearch base URL exposing the Security API
  endpoint: ${OPENSEARCH_ENDPOINT}
  # -- (string) Admin user for the Security API
  username: ${OPENSEARCH_ADMIN_USERNAME}
  # -- (string) Admin password for the Security API
  password: ${OPENSEARCH_ADMIN_PASSWORD}
  # -- (bool) Require admin approval before create/delete is executed
  requiresApproval: true
  tls:
    # -- (bool) Reject invalid/self-signed certs. Set false for self-signed clusters
    rejectUnauthorized: true

opensearchScaling:
  # -- (string) AWS region of the OpenSearch Service domains
  region: ap-northeast-2
  # -- (string) Optional IAM role to assume for OpenSearch Service API calls (omit to use IRSA/instance profile)
  # assumeRoleArn: arn:aws:iam::123456789012:role/backstage-opensearch-scaling
  # -- (string) Default IANA timezone shown in the reservation form
  defaultTimezone: Asia/Seoul
  # -- (string[]) Selectable IANA timezones for the reservation form
  timezones:
    - Asia/Seoul
    - UTC
    - America/New_York
  # -- (string[]) Fallback instance types. Types are normally fetched from the AWS
  #    API (ListInstanceTypeDetails) for the selected domain's engine version; this
  #    list is used only before a domain is selected or if that call returns nothing.
  instanceTypes:
    - r6g.large.search
    - r6g.xlarge.search
    - r6g.2xlarge.search
    - r6g.4xlarge.search
    - m6g.large.search
    - m6g.xlarge.search
    - m6g.2xlarge.search
    - c6g.large.search
    - c6g.xlarge.search
  # -- (number) Hours after the reserved time to keep retrying when a change is already in progress
  executionGraceHours: 2

opensearchViewer:
  # -- (string) OpenSearch endpoint to scan. Defaults to opensearchAccount.endpoint
  # endpoint: ${OPENSEARCH_ENDPOINT}
  # -- (string) OpenSearch API username. Defaults to opensearchAccount.username
  # username: ${OPENSEARCH_ADMIN_USERNAME}
  # -- (string) OpenSearch API password. Defaults to opensearchAccount.password
  # password: ${OPENSEARCH_ADMIN_PASSWORD}
  # -- (object[]) Index patterns scanned independently for field type conflicts
  targets:
    - name: All indices
      indexPattern: '*'
  # -- (string[]) Index patterns excluded from conflict impact calculations
  ignoredIndexPatterns:
    - .kibana*
    - .opensearch-*
  # -- (string) Cron for automatic conflict impact refresh
  scanCron: '*/15 * * * *'
  tls:
    # -- (bool) Reject invalid/self-signed certs. Defaults to opensearchAccount.tls.rejectUnauthorized
    rejectUnauthorized: true

gitlabTokenAudit:
  # -- (bool) Enable the GitLab Token Audit plugin
  enabled: true
  # -- (object) Default webhook seeded into the DB at boot; UI edits override at runtime but a backend restart re-applies these values
  # webhook:
  #   enabled: true
  #   url: https://hooks.slack.com/services/XXX/YYY/ZZZ
  #   daysBefore: [30, 14]
  # -- (object) Scope filters for which projects/groups to include or exclude
  scope:
    # -- (list) Project paths or IDs to explicitly scan for project access tokens. Exact match only (no regex; GitLab API needs concrete paths)
    includeProjects: []
    # -- (list) Group paths or IDs to explicitly scan for group access tokens. Exact match only (no regex; GitLab API needs concrete paths)
    includeGroups: []
    # -- (list) Project paths to drop from results. Entry is exact match by default or a regex when wrapped in slashes, e.g. '/^archived\//'
    excludeProjects: []
    # -- (list) Group paths to drop from results. Entry is exact match by default or a regex when wrapped in slashes, e.g. '/^sandbox-/'
    excludeGroups: []
  schedule:
    # -- (string) IANA timezone applied to fetchCron and notifyCron
    timezone: Asia/Seoul
    # -- (string) Cron for refreshing GitLab tokens. Evaluated in the configured timezone
    fetchCron: '0 */6 * * *'
    # -- (string) Cron for webhook notification scan. Evaluated in the configured timezone
    notifyCron: '0 10 * * *'

search:
  collators:
    catalog:
      schedule:
        frequency: { minutes: 1 }
        timeout: { minutes: 15 }
        initialDelay: { seconds: 10 }
