apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.14.0
appVersion: "0.14.0"
home: https://github.com/younsl/addons/tree/main/box/kubernetes/forklift
sources:
  - https://github.com/younsl/addons/tree/main/box/kubernetes/forklift/charts/forklift
dependencies:
  - name: seaweedfs
    version: "4.48.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: removed
      description: "Bundled MinIO subchart, whose images were removed from quay.io"
    - kind: added
      description: "Bundled SeaweedFS all-in-one subchart (seaweedfs.enabled, on by default) wired to the s3 backend"
    - kind: added
      description: "storage.s3.provider, adminEndpoint and adminToken for MinIO, RustFS, SeaweedFS and Garage admin metrics"
    - kind: added
      description: "storage.migration runs forklift migrate-storage as a Job with twelve preflight checks, keeping forklift at 0 replicas"
