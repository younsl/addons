apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.12.4
appVersion: "0.13.3"
home: https://github.com/younsl/addons/tree/main/box/kubernetes/forklift
sources:
  - https://github.com/younsl/addons/tree/main/box/kubernetes/forklift/charts/forklift
dependencies:
  # Bundled object storage for the s3 backend. Enabled by default so the chart
  # runs HA out of the box with no external bucket; disable (minio.enabled=false)
  # and point storage.s3.* at AWS S3 / another S3-compatible store for production.
  - name: minio
    version: "5.4.0"
    repository: https://charts.min.io/
    condition: minio.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Upgrade forklift to 0.13.3 and forklift-mcp to 0.3.2: 2s bucket on every duration histogram"
