apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.14.1
appVersion: "0.14.1"
home: https://github.com/younsl/addons/tree/main/box/kubernetes/forklift
sources:
  - https://github.com/younsl/addons/tree/main/box/kubernetes/forklift/charts/forklift
dependencies:
  - name: seaweedfs
    version: "4.48.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "OCI proxies follow the registry's blob redirect, so layers from Docker Hub and ghcr pull instead of failing with 502"
    - kind: fixed
      description: "The PyPI proxy's HTML index lists every file again when pypi.org sends null fields"
