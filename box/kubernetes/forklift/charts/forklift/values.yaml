# Default values for forklift.

# -- (int) Number of replicas. With 2+ replicas, enable ha to elect a single active writer.
replicaCount: 2
# -- (int) Number of old ReplicaSets to retain for rollback.
revisionHistoryLimit: 10

# -- (object) Deployment update strategy. Empty auto-selects: RollingUpdate for the s3 backend, Recreate for fs.
strategy: {}

image:
  # -- (string) Image registry host. Empty folds the host into `repository`.
  registry: ghcr.io
  # -- (string) Image repository.
  repository: younsl/forklift
  # -- (string) Image pull policy.
  pullPolicy: IfNotPresent
  # -- (string) Image tag. Empty uses the chart appVersion.
  tag: ""

# -- (list) Image pull secrets for private registries.
imagePullSecrets: []
# -- (string) Override the chart name portion of resource names.
nameOverride: ""
# -- (string) Override the fully qualified resource name.
fullnameOverride: ""

# High availability via Kubernetes Lease leader election. Only the leader is
# Ready (the Service routes to it) and runs the blob sweeper, guaranteeing a
# single writer to the SQLite database on the shared RWX volume.
ha:
  # -- (bool) Enable leader election. Auto-derived from replicaCount > 1 when left null.
  enabled: null
  # -- (string) Lease object name. Defaults to the release fullname when empty.
  leaseName: ""
  # -- (string) Duration that non-leader candidates wait before attempting to acquire leadership.
  leaseDuration: 15s
  # -- (string) Deadline for the leader to renew the lease before giving up leadership.
  renewDeadline: 10s
  # -- (string) Interval between leadership acquisition attempts.
  retryPeriod: 2s

# PV-based replication: an alternative HA mode for clusters without
# ReadWriteMany storage (e.g. EBS-only). Renders a StatefulSet where every pod
# gets its own ReadWriteOnce PVC; the standby pulls the leader's SQLite
# snapshot and blobs every interval and promotes that copy when it wins the
# leader election. Replication is asynchronous: writes within one interval can
# be lost on failover. Traffic routes to the leader through the
# forklift.io/role=leader pod label (all pods stay Ready so rollouts proceed).
replication:
  # -- (bool) Enable PV-based replication (StatefulSet, per-pod RWO PVC). Mutually exclusive with shared RWX mode.
  enabled: false
  # -- (string) Standby pull interval; the bounded data-loss window on failover.
  interval: 30s
  # -- (string) Bearer token for internal replication endpoints. Empty generates one into the chart Secret.
  token: ""
  # -- (string) StatefulSet pod management policy: Parallel or OrderedReady.
  podManagementPolicy: Parallel

# Persistent storage for the SQLite metadata DB and the content-addressed blob
# store. For replicaCount > 1 the access mode MUST be ReadWriteMany (e.g. EFS,
# NFS, CephFS) so all replicas share the same volume. Exception: with
# replication enabled each pod gets its own ReadWriteOnce PVC (accessModes is
# ignored in that mode; storageClass, size and annotations still apply).
persistence:
  # -- (bool) Enable persistent storage. When false, data is lost on pod restart.
  enabled: true
  # -- (string) StorageClass for the PVC. Uses the cluster default when empty.
  storageClass: ""
  # -- (list) PVC access modes. MUST be ReadWriteMany for replicaCount > 1.
  accessModes:
    - ReadWriteMany
  # -- (string) PVC storage size.
  size: 20Gi
  # -- (object) Annotations to add to the PVC.
  annotations: {}
  # -- (string) Use an existing PVC instead of creating one.
  # existingClaim: ""

# Blob + metadata storage backend. "fs" (default) keeps blobs and the SQLite
# database on the PersistentVolume above. "s3" stores blobs directly in an S3
# bucket and snapshots the metadata database to S3, so an HA deployment needs no
# EBS/RWX volume: pods run as a Deployment with an emptyDir for the live SQLite
# working file, and the leader (elected via Lease when replicaCount > 1) uploads
# the metadata snapshot while standbys restore it on promotion. The s3 backend
# is mutually exclusive with replication.enabled.
storage:
  # -- (string) Storage backend: "fs" or "s3". Bundled MinIO (minio.enabled) forces s3.
  backend: fs
  s3:
    # -- (string) S3 bucket. Required for s3 without bundled MinIO; else defaults to the first minio.buckets entry.
    bucket: ""
    # -- (string) Key prefix within the bucket.
    prefix: ""
    # -- (string) AWS region. Empty uses the AWS default chain.
    region: ""
    # -- (string) Custom S3 endpoint for S3-compatible stores. Auto-targets the bundled MinIO when enabled.
    endpoint: ""
    # -- (bool) Path-style addressing (MinIO needs it). Forced on with bundled MinIO.
    forcePathStyle: false
    # -- (string) Metadata snapshot sync cadence; the bounded data-loss window on failover.
    metaSyncInterval: 30s
    # -- (string) Existing Secret with keys access-key-id and secret-access-key. Empty uses the AWS default chain (IRSA/Pod Identity).
    existingSecret: ""

# Bundled MinIO object storage (minio/minio subchart). Enabled by default so the
# chart provides S3-backed HA storage with no external bucket: forklift's s3
# backend is auto-wired to the in-cluster MinIO (endpoint, bucket, path-style,
# credentials). The single-node standalone default suits dev/demo; for production
# disable it (minio.enabled=false) and point storage.s3.* at AWS S3 (with EKS
# IRSA / Pod Identity) or a hardened external MinIO. These keys are passed
# straight to the subchart — see https://github.com/minio/minio/tree/master/helm/minio
# for the full set.
minio:
  # -- (bool) Deploy bundled MinIO and wire forklift's s3 backend to it.
  enabled: true
  image:
    # -- (string) MinIO server image repository.
    repository: quay.io/minio/minio
    # -- (string) MinIO image tag. Pinned for the S3 conditional-write support HA fencing needs.
    tag: RELEASE.2025-09-07T16-13-09Z
  # -- (string) Deployment mode: "standalone" or "distributed".
  mode: standalone
  # -- (string) MinIO root access key, mirrored as the S3 access-key-id. CHANGE for non-dev use.
  rootUser: forklift
  # -- (string) MinIO root secret key (min 8 chars), mirrored as the S3 secret-access-key. CHANGE for non-dev use.
  rootPassword: forklift-minio-change-me
  # -- (list) Buckets to provision. The first entry is forklift's unless storage.s3.bucket overrides it.
  buckets:
    - name: forklift
      policy: none
      purge: false
  persistence:
    # -- (bool) Persist MinIO data on a PVC.
    enabled: true
    # -- (string) Size of the MinIO data volume.
    size: 10Gi
  resources:
    requests:
      # -- (string) MinIO memory request, lowered from the subchart's 16Gi default.
      memory: 512Mi

# Authentication and authorization.
auth:
  # -- (bool) Allow unauthenticated read (pull) access.
  anonymousRead: false
  # -- (string) Session cookie lifetime.
  sessionTTL: 12h
  # -- (string) Session cookie signing secret, shared across replicas. Empty generates one into the chart Secret.
  sessionSecret: ""
  bootstrap:
    # -- (string) Admin username seeded on first run.
    adminUser: admin
    # -- (string) Admin password seeded on first run. Empty generates one into the chart Secret (key: bootstrap-admin-password).
    adminPassword: ""
  oidc:
    # -- (bool) Enable OIDC single sign-on.
    enabled: false
    # -- (string) OIDC issuer URL.
    issuerURL: ""
    # -- (string) OIDC client ID.
    clientID: ""
    # -- (string) OIDC client secret.
    clientSecret: ""
    # -- (string) OIDC redirect URL.
    redirectURL: ""
    # -- (string) Token claim used as the username.
    usernameClaim: preferred_username
    # -- (string) Token claim used for group membership.
    groupsClaim: groups
  # Declarative, ArgoCD-style RBAC reconciled from this chart on every startup.
  # The policy is authoritative for the roles, grants and group mappings it
  # defines (managed rows): removing an entry here removes it from the database
  # on the next restart. Roles, mappings and assignments created interactively
  # in the UI are left untouched and remain editable.
  rbac:
    # -- (bool) Enable declarative RBAC. When false, roles are managed only through the UI/API.
    enabled: true
    # -- (string) Default role for every authenticated user (ArgoCD policy.default). Empty means deny-all until a role is granted.
    policyDefault: readonly
    # -- (string) ArgoCD-style policy: "p, <role>, repo, <action>, <repo-glob>, allow" permissions and "g, <group:name|user:name>, <role>" grants.
    policy: |
      # The `administrator` role (admin on every repository) is created
      # automatically for the bootstrap admin on first run, so it is not declared
      # here; reference it in grant lines below to assign full access to others.

      # readonly: read-only (pull) access to every repository. Default role for
      # all authenticated users.
      p, readonly, repo, read, *, allow

      # auditor (security engineer): read-only across all administrative surfaces
      # (audit) plus package approval decisions, security policy edits and
      # repository reads, but no create/update/delete and no access to upstream
      # credentials. Drop the `security` line to leave the Security tab
      # read-only while keeping approval rights.
      p, auditor, repo, audit, *, allow
      p, auditor, repo, approve, *, allow
      p, auditor, repo, security, *, allow
      p, auditor, repo, read, *, allow

      # Example: developers can pull and push to team repositories.
      # p, developer, repo, read, team-a-*, allow
      # p, developer, repo, write, team-a-*, allow

      # Example: map a Keycloak group and a specific user to roles.
      # g, group:/platform-admins, administrator
      # g, user:alice, developer
    # -- (list) Declarative local accounts. Passwords are set here or generated into the chart Secret (key: local-user-<name>-password).
    accounts: []
    #  - name: ci-bot
    #    password: ""   # empty -> generated and stored in the Secret

# Per-repository audit log: records every artifact download/upload/delete and
# repository config change with user, status and client IP.
audit:
  # -- (bool) Enable the audit log.
  enabled: true
  # -- (string) Retention period; the leader prunes older entries. "0" keeps them forever.
  retention: 2160h # 90 days

# Management API and web-console package publication. Enabled by default so an
# image/chart upgrade exposes the completed format handlers immediately. Set
# enabled=false to retain an explicitly disabled deployment.
uiUpload:
  # -- (bool) Enable component-aware artifact upload through the management API and web UI.
  enabled: true
  # -- (string) Maximum wall-clock duration of one upload request.
  maxDuration: 30m
  # -- (int) Maximum process-wide concurrent upload requests.
  maxConcurrent: 4
  # -- (int) Maximum concurrent upload requests for one authenticated principal.
  maxConcurrentUser: 2
  # -- (int) Maximum number of uploaded files in one publication.
  maxAssets: 16
  # -- (string) Maximum size of one non-Go uploaded file.
  maxFileBytes: 256MiB
  # -- (string) Maximum total file bytes in one publication.
  maxBatchBytes: 512MiB
  # -- (string) Maximum Go module zip size; cannot exceed the GOPROXY protocol limit.
  goMaxZipBytes: 500MiB

# Vulnerability scanning data source (OSV). Passed to the container as CLI flags
# (--osv-url, --vuln-rescan-interval, --vuln-ttl, --vuln-workers). Scanning of
# every cached/uploaded coordinate happens whenever osvUrl is set, regardless of
# per-repository policy; the policy (Settings > Vulnerability policy) only gates
# enforcement (block/warn). For air-gapped clusters, set this to a
# self-hosted/mirrored OSV. Set osvUrl empty to disable scanning entirely.
vuln:
  # -- (string) OSV API base URL used to scan requested versions. Empty disables scanning.
  osvUrl: https://api.osv.dev
  # -- (string) How often stale scan results are re-queried.
  rescanInterval: 6h
  # -- (string) Age at which a scan result is considered stale.
  ttl: 24h
  # -- (int) Concurrent scan workers draining the queue.
  workers: 6

# License scanning data source (deps.dev). Passed to the container as CLI flags
# (--deps-dev-url, --license-rescan-interval, --license-ttl, --license-workers).
# Like vulnerability scanning, resolution of every cached/uploaded coordinate
# happens whenever depsDevUrl is set; per-repository policy only gates
# enforcement. Set depsDevUrl empty to disable license resolution.
license:
  # -- (string) deps.dev API base URL used to resolve package licenses. Empty disables resolution.
  depsDevUrl: https://api.deps.dev
  # -- (string) How often stale license results are re-queried.
  rescanInterval: 24h
  # -- (string) Age at which a license result is considered stale.
  ttl: 168h
  # -- (int) Concurrent resolution workers draining the queue.
  workers: 6

# Coverage scanning: walks a GitLab instance and reports how many projects
# actually build through this forklift, with a scheduled report naming the ones
# still to migrate. This is coverage in the sense of how far the rollout reaches,
# not test coverage. Off by default; see enabled below.
#
# Only the connection is configured here, and it stays here: the URL and the
# token are one decision, so the pair that reaches GitLab is pinned by the
# deployment rather than editable at runtime. Everything else about a scan
# (schedule, exclusions, alarm receivers) is edited in the console, since those
# are operational decisions. The token additionally lives in a Secret, so it
# never reaches the metadata database, the snapshots synced to object storage, or
# an API response.
coverageScanning:
  gitlab:
    # -- (bool) Turn coverage scanning on. Off by default: a GitLab token already in the environment must not start a crawl on its own.
    enabled: false
    # -- (string) GitLab base URL, e.g. https://gitlab.example.com. Required when enabled.
    url: ""
    # -- (string) Access token with read_api. Written into the chart's Secret; prefer existingSecret in production.
    token: ""
    # -- (string) Read the token from this Secret instead, so it never appears in values.
    existingSecret: ""
    # -- (string) Key holding the token, in either the chart's Secret or existingSecret.
    existingSecretKey: coverage-gitlab-token

# -- (string) Public base URL (e.g. https://forklift.example.com) for generated metadata URLs. Empty uses the request host.
externalUrl: ""

# -- (bool) Seed default proxy and hosted repositories on first run. Idempotent.
seedDefaultRepos: true

log:
  # -- (string) Log level (debug, info, warn, error).
  level: info
  # -- (string) Log format (json, text).
  format: json

serviceAccount:
  # -- (bool) Create a ServiceAccount.
  create: true
  # -- (object) Annotations to add to the ServiceAccount (e.g. IRSA role ARN).
  annotations: {}
  # -- (string) ServiceAccount name. Generated from the fullname when empty.
  name: ""
  # -- (list) Image pull secrets set on the ServiceAccount, separate from the pod-level imagePullSecrets.
  imagePullSecrets: []

rbac:
  # -- (bool) Create Role/RoleBinding for the leader-election Lease.
  create: true

service:
  # -- (string) Service type.
  type: ClusterIP
  # -- (int) Service port for HTTP traffic.
  port: 80
  # -- (int) Service port exposing Prometheus metrics (container port 8081).
  metricsPort: 8081
  # -- (object) Annotations to add to the Service.
  annotations: {}
  # -- (string) Traffic distribution preference (e.g. PreferClose). Empty omits the field.
  trafficDistribution: ""
  # Headless Service for per-pod DNS, rendered only in PV-based replication mode.
  headless:
    # -- (object) Annotations to add to the headless Service.
    annotations: {}
    # -- (string) Traffic distribution for the headless Service. Empty omits the field.
    trafficDistribution: ""

# Gateway API HTTPRoute exposing the API and web console.
gateway:
  # -- (bool) Enable HTTPRoute.
  enabled: false
  # -- (string) HTTPRoute name. Defaults to the release fullname when empty.
  name: ""
  # -- (list) Parent Gateway references.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: gateway-system
      sectionName: https
  # -- (list) Hostnames for the route.
  hostnames:
    - forklift.example.com
  # -- (list) HTTP route rules.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # -- (list) HTTPRoute filters.
      filters: []
      # -- (list) HTTPBackendRefs. Empty name/port default to the chart Service and service.port.
      backendRefs:
        - group: ""
          kind: Service
          name: ""
          port: ""
          weight: 1

# -- (object) Annotations to add to pods.
podAnnotations: {}
# -- (object) Labels to add to pods.
podLabels: {}

# -- (object) Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# -- (object) Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- (object) Container resource requests and limits.
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# -- (list) In-place vertical scaling policy: CPU in place, restart on memory resize.
resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: RestartContainer

# -- (object) Liveness probe configuration.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- (object) Readiness probe configuration.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

podDisruptionBudget:
  # -- (bool) Create a PodDisruptionBudget to keep replicas available during disruptions.
  enabled: true
  # -- (int) Minimum number of available replicas.
  minAvailable: 1
  # -- (string) Eviction policy for unhealthy pods: AlwaysAllow or IfHealthyBudget.
  unhealthyPodEvictionPolicy: AlwaysAllow

# MCP (Model Context Protocol) server: exposes the forklift management API as
# MCP tools for agent runtimes such as Claude and kagent. Renders a separate
# Deployment and Service running the dedicated forklift-mcp image (its own
# release line, versioned independently of forklift). Every tool call is
# proxied to the forklift Service with the caller's Authorization header
# (Bearer PAT or Basic), so forklift RBAC applies per caller; the optional
# token secret is only a fallback for clients that cannot send headers.
# MCP endpoint: http://<release>-mcp/mcp (streamable HTTP).
mcp:
  # -- (bool) Deploy the forklift-mcp server as its own pod.
  enabled: false
  image:
    # -- (string) MCP image registry host. Set empty to fold the host into `repository`.
    registry: ghcr.io
    # -- (string) MCP image repository (path under the registry).
    repository: younsl/forklift-mcp
    # -- (string) MCP image pull policy.
    pullPolicy: IfNotPresent
    # -- (string) MCP image tag. Released independently of forklift, so no appVersion fallback.
    tag: "0.3.1"
  # -- (int) Number of MCP replicas. Keep 1: MCP sessions live in pod memory.
  replicaCount: 1
  # -- (string) forklift API base URL to proxy to. Empty targets this release's Service.
  upstreamURL: ""
  # -- (object) Optional fallback token Secret for clients that cannot send an Authorization header.
  token:
    # -- (string) Existing Secret holding the fallback token. Empty disables the fallback.
    existingSecret: ""
    # -- (string) Key in that Secret holding the token.
    key: token
  service:
    # -- (string) Service type for the MCP endpoint.
    type: ClusterIP
    # -- (int) Service port for the MCP endpoint (container port 8080).
    port: 80
    # -- (int) Service port exposing MCP metrics (container port 8081), separate from MCP traffic.
    metricsPort: 8081
    # -- (object) Annotations to add to the MCP Service.
    annotations: {}
    # -- (string) Traffic distribution preference (e.g. PreferClose). Empty omits the field.
    trafficDistribution: ""
  # Gateway API HTTPRoute for the MCP endpoint, on its own host and certificate.
  gateway:
    # -- (bool) Enable HTTPRoute for the MCP endpoint.
    enabled: false
    # -- (string) MCP HTTPRoute name. Defaults to <fullname>-mcp when empty.
    name: ""
    # -- (list) Parent Gateway references for the MCP route.
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: main-gateway
        namespace: gateway-system
        sectionName: https
    # -- (list) Hostnames for the MCP route.
    hostnames:
      - forklift-mcp.example.com
    # -- (list) MCP HTTP route rules.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # -- (list) HTTPRoute filters.
        filters: []
        # -- (list) HTTPBackendRefs. Empty name/port default to the MCP Service and mcp.service.port.
        backendRefs:
          - group: ""
            kind: Service
            name: ""
            port: ""
            weight: 1
  serviceMonitor:
    # -- (bool) Create a Prometheus Operator ServiceMonitor for the MCP server.
    enabled: false
    # -- (string) Scrape interval.
    interval: 30s
    # -- (string) Scrape timeout. Uses the Prometheus default when empty.
    scrapeTimeout: ""
    # -- (object) Additional labels for the MCP ServiceMonitor (e.g. release selector).
    additionalLabels: {}
  # -- (object) Resource requests and limits for the MCP container.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  # -- (list) In-place vertical scaling policy: CPU in place, restart on memory resize.
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: RestartContainer
  # -- (object) Annotations to add to MCP pods.
  podAnnotations: {}
  # -- (object) Labels to add to MCP pods.
  podLabels: {}
  # -- (object) Node selector for MCP pod scheduling.
  nodeSelector: {}
  # -- (list) Tolerations for MCP pod scheduling.
  tolerations: []
  # -- (object) Affinity rules for MCP pod scheduling.
  affinity: {}
  # -- (string) Priority class name for MCP pods. Empty uses the cluster default.
  priorityClassName: ""
  # -- (list) Raw environment variables appended to the MCP container.
  extraEnv: []

serviceMonitor:
  # -- (bool) Create a Prometheus Operator ServiceMonitor.
  enabled: false
  # -- (string) Scrape interval.
  interval: 30s
  # -- (string) Scrape timeout. Uses the Prometheus default when empty.
  scrapeTimeout: ""
  # -- (object) Additional labels for the ServiceMonitor (e.g. release selector).
  additionalLabels: {}

# -- (object) Node selector for pod scheduling.
nodeSelector: {}
# -- (list) Tolerations for pod scheduling.
tolerations: []
# -- (object) Affinity rules for pod scheduling.
affinity: {}
# -- (list) Topology spread constraints for pod scheduling.
topologySpreadConstraints: []
# -- (string) Priority class name for pod scheduling. Empty uses the cluster default.
priorityClassName: ""
# -- (string) Pod DNS policy. Empty uses the cluster default.
dnsPolicy: ""
# -- (object) Pod DNS configuration. Required when dnsPolicy is None.
dnsConfig: {}

# -- (list) Raw environment variables appended to the container.
extraEnv: []

# -- (list) Raw CLI flags appended to the container args (after the scan flags).
extraArgs: []

# -- (list) Arbitrary additional manifests to render (each value is templated).
extraObjects: []
