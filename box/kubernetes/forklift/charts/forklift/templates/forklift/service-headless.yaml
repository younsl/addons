{{- if .Values.replication.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forklift.headlessServiceName" . }}
  labels:
    {{- include "forklift.labels" . | nindent 4 }}
  {{- with .Values.service.headless.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  {{- with .Values.service.headless.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  publishNotReadyAddresses: true
  selector:
    {{- include "forklift.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
