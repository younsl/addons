{{- if and .Values.rbac.create (eq (include "forklift.haEnabled" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "forklift.fullname" . }}-leader-election
  labels:
    {{- include "forklift.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  {{- if eq (include "forklift.labelRouting" .) "true" }}
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - patch
  {{- end }}
{{- end }}
