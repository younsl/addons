  /cargo/{repo}/config.json:
    get:
      tags: [cargo]
      summary: Sparse registry configuration
      description: >
        `dl` points at this repository's download endpoint. `api` is present
        on hosted and group repositories and enables the Registry Web API: a
        hosted repository serves publish, yank and search, a group serves
        search and refuses writes with 405. A group answers with its first
        member's config, but both URLs name the group, so downloads fan out
        across every member. A proxy has no `api`. `auth-required` is present
        when anonymous read is disabled.
      x-codegen-skip: true
      security: [{}, { cargoToken: [] }, { basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CargoRepo"
      responses:
        "200":
          description: Registry configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoRegistryConfig" }
        "401": { description: Authentication required }
        "404": { description: Repository not found or not a Cargo repository }
  /cargo/{repo}/api/v1/crates:
    get:
      tags: [cargo]
      summary: Search crates (cargo search)
      description: >
        Hosted repositories only. Matches the crate name, ignoring case and
        hyphen/underscore differences, and every whitespace-separated term in
        `q` must occur in it. Results rank an exact match first, then names
        starting with the first term, then the rest, alphabetically within
        each rank. Crates whose every version is yanked are left out, and
        `max_version` is the highest non-yanked version. A proxy answers 404,
        so a group falls through its members in order and answers from the
        first hosted one.
      x-codegen-skip: true
      security: [{}, { cargoToken: [] }, { basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CargoRepo"
        - name: q
          in: query
          required: false
          description: Search terms. Empty lists every crate.
          schema: { type: string }
        - name: per_page
          in: query
          required: false
          description: Page size. Out-of-range values are clamped.
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Matching crates, at most per_page of them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoSearchResult" }
        "401": { description: Authentication required }
        "403": { description: Read permission required }
        "404":
          description: Not a hosted repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "503":
          description: Crates could not be listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
  /cargo/{repo}/api/v1/crates/new:
    put:
      tags: [cargo]
      summary: Publish a crate version (cargo publish)
      description: >
        Hosted repositories only, write permission. A group answers 405
        (plain text, "group repositories are read-only"). The body is cargo's
        publish encoding: a little-endian u32 length and the metadata JSON,
        then a little-endian u32 length and the .crate archive, with nothing
        after it. The metadata JSON is bounded at 16 MiB and the archive by
        FORKLIFT_UI_UPLOAD_MAX_FILE_BYTES. Its name and vers must name a valid
        crate version, but identity, dependencies, features and description
        are read from the archive's normalized Cargo.toml, exactly as for a UI
        upload. The version is committed atomically with the sparse index and
        is immutable. Cargo treats only 200 as success.
      x-codegen-skip: true
      security: [{ cargoToken: [] }, { basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CargoRepo"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoPublishResult" }
        "400":
          description: Truncated body, trailing bytes, or invalid metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "401": { description: Authentication required }
        "403": { description: Write permission required }
        "405":
          description: A proxy (CargoErrors) or a group (plain text)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "409":
          description: Version exists or was removed, the name conflicts, or the index changed concurrently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "413":
          description: Metadata or archive exceeds the upload limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "415":
          description: The archive is not a .crate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "422":
          description: Invalid archive, unsafe paths, or an invalid Cargo.toml
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "503":
          description: Upload storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
