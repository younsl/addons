  /api/v1/users/{id}/impersonate:
    post:
      tags: [users]
      summary: Sign in as this user (admin, interactive session only)
      description: >
        Replaces the caller's session cookie with one that acts as the target
        user, carrying only that user's permissions. The reason is recorded in
        the server log, and repository audit events raised during the session
        keep the target as the actor with the administrator noted alongside.
        Refused for robot and disabled accounts, for your own account, and while
        an impersonation is already active. Token and Basic credentials cannot
        start one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImpersonationInput" }
      responses:
        "200":
          description: Impersonating; a session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImpersonationStart" }
        "400": { description: Validation error (missing or short reason, self, robot or disabled target) }
        "403": { description: Not an interactive session }
        "404": { description: Not found }
        "409": { description: Already impersonating }
