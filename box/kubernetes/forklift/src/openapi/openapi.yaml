openapi: 3.1.0
info:
  title: forklift API
  version: "0.1.0"
  description: >
    Management API for forklift, a Kubernetes-native artifact repository.
    Package-format endpoints (Maven, npm, Cargo, Go, PyPI, raw) are mounted under
    /maven, /npm, /cargo, /go, /pypi and /raw and follow each ecosystem's native
    protocol (raw serves plain GET/PUT by path). The Cargo Registry Web API
    subset forklift implements is documented under the cargo tag. The other
    format protocols are not. The OCI distribution API
    (container images, Helm charts) is mounted at /v2 with the repository name
    as the first path segment. This specification is served at
    /openapi.yaml with a Scalar reference UI at /api-docs.
servers:
  - url: /
tags:
  - name: system
  - name: session
  - name: repositories
  - name: tokens
  - name: users
  - name: roles
  - name: approvals
  - name: group-mappings
  - name: ha
  - name: notification
  - name: search
  - name: coverage
  - name: cargo
    description: >
      Cargo sparse registry and the Registry Web API subset behind
      `cargo publish`, `cargo yank` and `cargo search`, under /cargo/{repo}.
      Hosted repositories serve all of it, groups serve reads and search,
      proxies serve reads only.
      Sparse-index entries (`1/<c>`, `2/<cr>`, `3/<a>/<crate>`,
      `<aa>/<bb>/<crate>`) are newline-delimited JSON and are not listed
      individually. Cargo sends the configured token as is, so the
      Authorization header carries a bare personal access token
      (cargoToken). Basic and Bearer credentials are accepted too. Errors use
      cargo's envelope (CargoErrors), except 401 and 403, which come from the
      shared authorization layer as plain text. These operations carry
      x-codegen-skip because the console does not call them.
paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe (no auth)
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe (no auth); in HA mode only the elected leader is ready
      responses:
        "200": { description: Ready to serve traffic }
        "503": { description: Not the leader, or database unavailable }
  /api/v1/login:
    post:
      tags: [session]
      summary: Log in with a local username and password (sets a session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionIdentity" }
        "401": { description: Invalid credentials }
        "403": { description: Account locked after too many failed attempts }
        "404": { description: Local authentication is disabled }
  /api/v1/logout:
    post:
      tags: [session]
      summary: Clear the session cookie
      responses:
        "204": { description: Logged out }
  /api/v1/me:
    get:
      tags: [session]
      summary: Describe the current principal
      responses:
        "200":
          description: Principal info (authenticated=false with no other fields when anonymous)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /api/v1/impersonate/stop:
    post:
      tags: [session]
      summary: End an impersonated session and return to your own account
      responses:
        "200":
          description: Restored session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionIdentity" }
        "400": { description: Not impersonating }
        "401": { description: The original account is disabled or no longer exists; the cookie is cleared }
  /api/v1/version:
    get:
      tags: [session]
      summary: Build-time version and commit metadata
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/v1/stats/landing:
    get:
      tags: [session]
      summary: Public instance-wide counts for the login page welcome line
      responses:
        "200":
          description: Coarse totals; no names or per-repository detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingStats"
  /api/v1/announcement:
    get:
      tags: [session]
      summary: Read the site-wide announcement banner
      description: >
        Readable by any signed-in user. Never set and cleared are the same
        response - an empty body - so the banner has one absent state to render
        rather than two.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The current announcement, or an empty body if there is none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
    put:
      tags: [session]
      summary: Replace the site-wide announcement (admin)
      description: >
        The body is stored as Markdown source verbatim; rendering and
        sanitisation are the UI's job. An empty body clears the announcement.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "200":
          description: The stored announcement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400":
          description: Body exceeds 1000 characters or 16KiB
  /api/v1/search:
    get:
      tags: [search]
      summary: Global search across repositories, artifacts, artifact labels, approvals, users and roles
      description: >
        Powers the sidebar search. Every section is narrowed to what the caller
        may see; repositories, artifacts and artifact labels filter per-repo by
        the read action,
        approvals require approve or audit rights, users and roles require
        admin or audit rights. Sections without access are null, permitted
        sections with no match are empty arrays.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: Max results per section (1-20, default 5).
          schema: { type: integer }
      responses:
        "200":
          description: Grouped, permission-filtered results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { description: Missing q }
  /api/v1/repositories:
    get:
      tags: [repositories]
      summary: List repositories
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RepositoryListItem" }
    post:
      tags: [repositories]
      summary: Create a repository
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryCreate" }
      responses:
        "201":
          description: The created repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { description: Validation error }
        "409": { description: Name already exists }
  /api/v1/repositories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [repositories]
      summary: Get a repository
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: >
            Repository. This returns the list item shape: the handler fills
            can_write and pending_approval_count, and the remaining aggregates
            serialise as 0 rather than being omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryListItem" }
        "403": { description: Read permission required }
        "404": { description: Not found }
    put:
      tags: [repositories]
      summary: Update a repository's upstream URL and config (admin)
      description: >
        PUT replaces the whole resource, so a proxy must always resend its
        upstream_url; omitting it returns 400 instead of silently clearing it.
        Administrators only, because the body carries the upstream URL and its
        credentials. The security-policy subset of the config has its own route,
        PUT /api/v1/repositories/{id}/security, reachable with the security
        action.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryInput" }
      responses:
        "200":
          description: The updated repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { description: Invalid config, empty upstream_url on a proxy, invalid group members, approval on a group, or pypi legacy zip outside hosted PyPI }
        "404": { description: Not found }
    delete:
      tags: [repositories]
      summary: Delete a repository
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "403": { description: Seeded repository (managed by the chart) cannot be deleted }
        "404": { description: Not found }
  /api/v1/repositories/{id}/security:
    put:
      tags: [repositories]
      summary: Update a repository's security policy (admin or security action)
      description: >
        Replaces the security-policy sections of a repository's config: age
        policy, approval policy, vulnerability policy, license policy, IP ACL
        and notification receivers. Every other section (cache, retention,
        group members, upload compatibility) and the upstream URL with its
        credentials are carried over from the stored config and cannot be set
        through this route, so the security action never becomes repository
        management. Like PUT /api/v1/repositories/{id} this replaces rather
        than merges the sections it owns; omitted sections reset to their zero
        value. Authorized for administrators and for principals holding the
        security action on this repository; personal access tokens never
        qualify, since the security action cannot be carried by a token scope.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositorySecurityInput" }
      responses:
        "200":
          description: Updated repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { description: Invalid policy, or approval enabled on a group repository }
        "403": { description: Security permission required for this repository }
        "404": { description: Not found }
  /api/v1/repositories/{id}/audit-logs:
    get:
      tags: [repositories]
      summary: List a repository's audit log (admin), newest first
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: event
          in: query
          schema:
            type: string
            enum: [view, download, upload, delete, ttl.expire, vuln.block, license.block,
                   upload.metadata, upload.reject, upload.cancel,
                   repo.create, repo.update, repo.delete,
                   approval.request, approval.approve, approval.reject,
                   deny.create, deny.delete, deny.block]
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogList" }
        "404": { description: Not found }
  /api/v1/repository-names:
    get:
      tags: [repositories]
      summary: List repository names (any authenticated user) for token-scope autocomplete
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Slim repository list (name, format, type)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RepositoryName" }
  /api/v1/repositories/check-upstream:
    post:
      tags: [repositories]
      summary: Probe an upstream URL for reachability before creating a proxy (admin)
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamCheckInput" }
      responses:
        "200":
          description: Connectivity result (any HTTP response counts as reachable; a malformed URL returns 200 with reachable=false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpstreamHealth" }
        "400": { description: url is empty, invalid inline auth, or a repository_id probe URL that does not match the stored upstream scheme and host }
  /api/v1/repositories/{id}/oci-tags:
    get:
      tags: [repositories]
      summary: Tagged images in an OCI repository (Harbor-style view)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Every tag with its manifest digest, kind, platforms, content size and push time. Empty for non-OCI formats.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/OCITagInfo" }
        "403": { description: No read permission on the repository }
        "404": { description: Repository not found }
  /api/v1/repositories/{id}/oci-detail:
    get:
      tags: [repositories]
      summary: Harbor-style drill-down for one OCI artifact (overview and additions)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: name, in: query, required: true, schema: { type: string }, description: OCI image name (may contain slashes). }
        - { name: ref, in: query, required: true, schema: { type: string }, description: Tag or sha256 digest. }
      responses:
        "200":
          description: Overview fields, raw manifest/config JSON, and per-kind additions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OCIArtifactDetail"
        "400": { description: Missing name or ref }
        "403": { description: No read permission on the repository }
        "404": { description: Repository, tag or manifest not found }
  /api/v1/repositories/{id}/artifacts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [repositories]
      summary: List a repository's artifacts (any user who can read the repository)
      description: >
        Returns one page of artifacts, most recently accessed first. Each artifact
        includes downloads_30d and last_accessed_by; see the Artifact schema for
        their recording and retention semantics. q searches path, version, content
        type, cached_by, last_accessed_by, cached/accessed timestamps, and labels
        as a case-insensitive substring, or a regular expression when regex=true.
        Download counts, size, vulnerability results, and licenses are not searched.
        There is no server-side sort parameter; column sorting in the console
        applies only to the loaded page. filter narrows the listing to what one
        Statistics panel counts: labeled over the whole repository, and
        scanned, clean, vulnerable, licensed and broken over the 500 most
        recently accessed artifacts, the same sample the Statistics tab
        aggregates. filtered then counts the matches and limit/offset page
        within them, while count stays the repository total.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search path, version, content type, cached_by, last_accessed_by, cached/accessed timestamps, and labels. }
        - name: filter
          in: query
          description: >
            Keep only labeled artifacts (at least one label), scanned (a stored
            vulnerability scan), clean (scanned, no advisories), vulnerable
            (scanned, at least one advisory), licensed (a resolved license) or
            broken (bytes missing from the blob store). Combines with q, not
            with regex or prefix.
          schema: { type: string, enum: [labeled, scanned, clean, vulnerable, licensed, broken] }
        - { name: regex, in: query, schema: { type: boolean, default: false }, description: Treat q as a case-insensitive regular expression. }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: prefix, in: query, schema: { type: string }, description: Legacy path-prefix filter; when set, q/regex/limit/offset are ignored. }
      responses:
        "200":
          description: One page of artifacts with aggregate count, total size, and the filtered match count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "400": { description: Invalid regex, an unknown filter, or a filter combined with regex or prefix }
        "403": { description: Read permission required }
        "404": { description: Not found }
    delete:
      tags: [repositories]
      summary: Delete one artifact, or purge all unmanaged artifacts in the repository (admin)
      description: >
        With a path query parameter, deletes one unmanaged artifact. Without it,
        purges unmanaged repositories; managed publications require lifecycle endpoints.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: path, in: query, schema: { type: string }, description: Artifact path to delete. Omit to purge all artifacts. }
        - name: force
          in: query
          schema: { type: boolean }
          description: >
            Repair escape hatch for an artifact whose blob bytes are missing from the
            blob store. Such an artifact can neither be served nor removed through the
            publication lifecycle (which must read the derived metadata first), so this
            deletes it despite the managed-artifact guard. It is refused unless the
            bytes are confirmed absent, and refused with 503 when the blob store cannot
            answer. Requires a path. When the artifact was the last asset of a managed
            publication, that publication is removed too, without a tombstone, so the
            same version can be published again.
      responses:
        "200":
          description: Purged all artifacts, or forced delete of one broken artifact
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ArtifactPurgeResult"
                  - $ref: "#/components/schemas/ArtifactForceDeleteResult"
        "204": { description: Single artifact deleted }
        "400": { description: force was requested without a path }
        "404": { description: Not found }
        "409": { description: Managed paths require a publication lifecycle operation, or force was used on an artifact whose bytes are present }
        "503": { description: The blob store could not confirm the bytes are missing }
  /api/v1/repositories/{id}/uploads:
    post:
      tags: [repositories]
      summary: Atomically upload a package publication to a hosted repository
      description: >
        The manifest is the first multipart field and declared asset fields
        follow in manifest order. The global feature flag defaults off. Maven,
        npm, PyPI, Cargo and Go are supported; exactly one format-specific
        manifest object must match the target hosted repository.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required for session-cookie authentication; not required with Authorization.
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { $ref: "#/components/schemas/ArtifactUploadManifest" }
              additionalProperties: { type: string, format: binary }
            encoding:
              manifest: { contentType: application/json }
      responses:
        "201":
          description: Publication committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactUploadResult" }
        "200":
          description: Replayed committed idempotent result
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactUploadResult" }
        "400": { $ref: "#/components/responses/UploadProblem" }
        "403": { $ref: "#/components/responses/UploadProblem" }
        "404": { $ref: "#/components/responses/UploadProblem" }
        "409": { $ref: "#/components/responses/UploadProblem" }
        "413": { $ref: "#/components/responses/UploadProblem" }
        "422": { $ref: "#/components/responses/UploadProblem" }
        "429": { $ref: "#/components/responses/UploadProblem" }
        "503": { $ref: "#/components/responses/UploadProblem" }
  /api/v1/repositories/{id}/uploads/{uploadID}:
    get:
      tags: [repositories]
      summary: Get the caller's upload state
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: uploadID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Receiving, conflict, committed, or failed upload state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "404": { $ref: "#/components/responses/UploadProblem" }
    delete:
      tags: [repositories]
      summary: Cancel a retained Maven replacement conflict
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: uploadID, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Conflict cancelled and staged leases released }
        "403": { description: Delete permission or CSRF token required }
        "404": { description: Uploads disabled or upload not found }
        "409": { $ref: "#/components/responses/UploadProblem" }
  /api/v1/repositories/{id}/uploads/{uploadID}/commit:
    post:
      tags: [repositories]
      summary: Confirm and atomically commit a retained Maven replacement
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: uploadID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Replacement committed
          content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactUploadResult" } } }
        "403": { description: Write permission or CSRF token required }
        "404": { description: Uploads disabled or upload not found }
        "409": { $ref: "#/components/responses/UploadProblem" }
  /api/v1/repositories/{id}/publications/{publicationID}:
    delete:
      tags: [repositories]
      summary: Delete a Maven, PyPI, or npm publication and rebuild metadata atomically
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: publicationID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Publication deleted, including derived metadata changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationLifecycleResult" }
        "403": { description: Delete permission or CSRF token required }
        "409": { $ref: "#/components/responses/UploadProblem" }
  /api/v1/repositories/{id}/publications/{publicationID}/yank:
    post:
      tags: [repositories]
      summary: Yank or unyank one Cargo publication
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: publicationID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationYankInput" }
      responses:
        "200":
          description: Sparse-index yanked flag updated atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationLifecycleResult" }
        "400": { description: Missing yanked flag or unknown fields }
        "403": { description: Write permission or CSRF token required }
        "409": { $ref: "#/components/responses/UploadProblem" }
  /api/v1/repositories/{id}/disabled:
    post:
      tags: [repositories]
      summary: Take a repository offline or back online (admin)
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryDisabledInput" }
      responses:
        "200":
          description: Updated repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "404": { description: Not found }
  /api/v1/repositories/{id}/dangling:
    get:
      tags: [repositories]
      summary: List artifacts in this repository whose blob bytes are missing
      description: >
        Artifacts the server has observed to be unservable: metadata points at blob
        bytes that are not in the blob store. Entries are re-checked against the
        artifact row and the blob store before being returned, so a repaired or
        republished artifact drops out. Views that display artifact paths use this
        to mark the affected rows.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Broken artifacts, oldest failure first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DanglingRef" }
        "403": { description: Forbidden }
        "404": { description: Repository not found }
  /api/v1/repositories/{id}/artifacts/labels:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [repositories]
      summary: List one artifact's labels (any user who can read the repository)
      description: >
        Labels are operator tags on a single stored artifact, applied the same way
        for every format because the identity is the repository plus the stored
        path. can_label reports whether this caller may change them.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Artifact path. }
      responses:
        "200":
          description: The artifact's labels and whether the caller may change them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactLabelList" }
        "400": { description: Missing path }
        "403": { description: Read permission required }
        "404": { description: Repository or artifact not found }
    post:
      tags: [repositories]
      summary: Add a label to one artifact (repository admin, or the artifact's uploader)
      description: >
        Permitted for an administrator on the repository and for the principal
        recorded as having uploaded (or published) the artifact. Every attempt,
        allowed or refused, is written to the repository's audit log as
        artifact.label.add. Surrounding whitespace is trimmed; the label is
        otherwise stored as typed.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactLabelInput" }
      responses:
        "201":
          description: The artifact's labels after the addition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactLabelList" }
        "400": { description: Missing path, or a label outside the accepted charset/length }
        "403": { description: Not an administrator on the repository and not the uploader }
        "404": { description: Repository or artifact not found }
        "409": { description: The label is already present, or the artifact holds the maximum number of labels }
    delete:
      tags: [repositories]
      summary: Remove a label from one artifact (repository admin, or the artifact's uploader)
      description: >
        Same permission as adding, and recorded the same way as
        artifact.label.remove.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Artifact path. }
        - { name: label, in: query, required: true, schema: { type: string }, description: Label to remove; matched after trimming, case-sensitively. }
      responses:
        "200":
          description: The artifact's labels after the removal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactLabelList" }
        "400": { description: Missing path or label }
        "403": { description: Not an administrator on the repository and not the uploader }
        "404": { description: Repository, artifact, or label not found }
  /api/v1/repositories/{id}/artifacts/labels/bulk:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [repositories]
      summary: Add or remove one label across many artifacts (repository admin, or each artifact's uploader)
      description: >
        The single-artifact permission applied per path: a selection spanning
        artifacts somebody else uploaded labels the ones the caller may label and
        reports the rest in failed. Every attempt is audited exactly as a single
        one is. The response is 200 even when some paths failed, because a
        selection of hundreds routinely contains a few that another request has
        already changed.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactBulkLabelInput" }
      responses:
        "200":
          description: What the batch did, per path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactBulkResult" }
        "400": { description: Empty paths, an unknown action, or a label outside the accepted charset/length }
        "403": { description: Read permission required }
        "404": { description: Repository not found }
        "413": { description: More paths than one request accepts }
  /api/v1/repositories/{id}/artifacts/bulk-delete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [repositories]
      summary: Delete many artifacts in one request (admin)
      description: >
        Each path is deleted and audited as a single delete would be, and a path
        that refuses is reported in failed rather than failing the batch. There is
        no force: repairing an artifact whose bytes are gone needs proof that they
        are, one blob-store round trip per path, which belongs on that artifact's
        own row.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactBulkDeleteInput" }
      responses:
        "200":
          description: What the batch did, per path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactBulkResult" }
        "400": { description: Empty paths }
        "403": { description: Admin required }
        "404": { description: Repository not found }
        "413": { description: More paths than one request accepts }
  /api/v1/repositories/{id}/artifacts/validate-upload:
    post:
      tags: [repositories]
      summary: Preflight a browser upload to a hosted repository
      description: Validates write permission, repository state, size, format-specific path, and path collision without storing bytes.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadValidationInput" }
      responses:
        "200":
          description: Validated upload plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPlan" }
        "400": { description: Invalid path, coordinate, or repository type }
        "403": { description: Write permission required }
        "413": { description: File exceeds the upload limit }
        "503": { description: Upload service is unavailable }
  /api/v1/repositories/{id}/artifacts/upload:
    put:
      tags: [repositories]
      summary: Stream an artifact into a hosted repository from the UI
      description: Repeats preflight, stores the bytes, queues security scans, and enters approval quarantine when configured. Existing paths are never overwritten.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: path, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored artifact and security workflow status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "409": { description: Artifact path already exists }
        "411": { description: Content-Length is required }
        "503": { description: Upload service is unavailable }
  /api/v1/repositories/{id}/upstream-health:
    get:
      tags: [repositories]
      summary: Probe a proxy repository's upstream health (any authenticated user)
