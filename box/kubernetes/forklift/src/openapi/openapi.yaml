        "405":
          description: A proxy (CargoErrors) or a group (plain text)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "409":
          description: The sparse index changed concurrently or is not managed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
  /cargo/{repo}/api/v1/crates/{crate}/{version}/unyank:
