    get:
      tags: [cargo]
      summary: Download a .crate archive
      description: >
        Hosted repositories serve stored crates. Proxy repositories fetch from
        upstream and apply the repository's policy gates. A group answers from
        its first member that has the crate.
      x-codegen-skip: true
      security: [{}, { cargoToken: [] }, { basicAuth: [] }, { bearerAuth: [] }]
      parameters:
