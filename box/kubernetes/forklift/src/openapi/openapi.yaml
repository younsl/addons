    get:
      tags: [tokens]
      summary: List the current user's personal access tokens
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
    post:
      tags: [tokens]
      summary: Create a personal access token (plaintext returned once)
      description: A user may hold at most 3 access tokens; revoke one to free a slot.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Created; the plaintext secret is returned only here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedToken" }
        "409": { description: Token limit reached (max 3 per user) }
  /api/v1/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [tokens]
      summary: Replace a personal access token's scopes
      description: Scopes are the only mutable part of a token; the secret, name and expiry never change.
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenScopesInput" }
      responses:
        "204": { description: Updated }
        "400": { description: Validation error }
        "404": { description: Not found }
    delete:
      tags: [tokens]
      summary: Revoke a personal access token
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Revoked }
