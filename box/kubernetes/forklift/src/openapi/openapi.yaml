        - $ref: "#/components/parameters/CargoCrate"
        - $ref: "#/components/parameters/CargoVersion"
      responses:
        "200":
          description: Unyanked in the sparse index
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoOk" }
        "400":
          description: The version is not valid SemVer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "401": { description: Authentication required }
        "403": { description: Write permission required }
        "404":
          description: Crate version not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "405":
          description: A proxy (CargoErrors) or a group (plain text)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }
        "409":
          description: The sparse index changed concurrently or is not managed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CargoErrors" }

components:
  parameters:
    CargoRepo:
      name: repo
      in: path
      required: true
      description: Cargo repository name
      schema: { type: string }
    CargoCrate:
      name: crate
      in: path
      required: true
      description: Crate name
      schema: { type: string }
    CargoVersion:
      name: version
      in: path
      required: true
      description: SemVer version
      schema: { type: string }
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Local username/password or a personal access token as the password.
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal access token (flpat_...) or an OIDC bearer token.
    cargoToken:
      type: apiKey
      in: header
      name: Authorization
      description: A bare personal access token (flpat_...) with no scheme, as cargo's cargo:token provider sends it.
  responses:
    UploadProblem:
      description: Structured artifact-upload problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/UploadProblem" }
  schemas:
    RoleRef:
      type: object
      description: A role as it appears inside a user record, without its permissions.
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    RoleCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          description: Granted at creation; further permissions are added one at a time afterwards.
          items: { $ref: "#/components/schemas/PermissionCreate" }
    PermissionCreate:
      type: object
      description: One grant as it is submitted - the same shape whether it arrives with a new role or is added to an existing one.
      required: [repo_pattern, actions]
      properties:
        repo_pattern: { type: string, description: Repository glob such as * or maven-*. }
        actions:
          type: array
          items: { type: string, enum: [read, write, delete, approve, audit, security, admin] }
    Permission:
      type: object
      description: One grant inside a role - a repository name pattern and the actions allowed on it.
      required: [actions, id, repo_pattern]
      properties:
        id: { type: integer }
        repo_pattern: { type: string }
        actions:
          type: array
          items: { type: string }
    Role:
      type: object
      required: [created_at, description, id, managed, name, permissions, user_count]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        managed:
          type: boolean
          description: Reconciled from chart configuration, so it is read-only through this API.
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        user_count:
          type: integer
          description: How many users hold this role.
    User:
      type: object
      required: [created_at, disabled, email, failed_login_count, id, last_login_at, locked, lockout_enabled, protected, robot, roles, source, token_count, username]
      properties:
        id: { type: integer }
        username: { type: string }
        source: { type: string, enum: [local, oidc] }
        email: { type: string }
        disabled: { type: boolean }
        robot:
          type: boolean
          description: A token-only service account, which cannot log in interactively.
        created_at: { type: string, format: date-time }
        last_login_at:
          type: [string, "null"]
          format: date-time
          description: Null when the user has never logged in.
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleRef" }
        lockout_enabled: { type: boolean }
        locked: { type: boolean }
        failed_login_count:
          type: integer
          description: Consecutive failed password logins; the account locks at the hard limit of 5. Reset on success or unlock.
        protected:
          type: boolean
          description: The bootstrap admin, which cannot be locked out.
        token_count:
          type: integer
          description: Personal access tokens the user owns, so list views need no extra request.
    Token:
      type: object
      description: A personal access token. The secret is returned only once, at creation.
      required: [created_at, description, expires_at, id, last_used_at, name, scopes_json]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        scopes_json:
          type: string
          description: Raw scope document as stored; an empty string means unscoped.
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    GroupMapping:
      type: object
      description: Maps an identity-provider group to a role.
      required: [group_name, id, managed, role_id]
      properties:
        id: { type: integer }
        group_name: { type: string }
        role_id: { type: integer }
        managed:
          type: boolean
          description: Reconciled from chart configuration, so it is read-only through this API.
    Me:
      type: object
      description: >
        The calling principal. Only "authenticated" is always present: an
        anonymous caller gets that field and nothing else, so every permission
        flag is optional and absent means "no".
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        username: { type: string }
        source: { type: string, description: Principal source, local or oidc. }
        admin: { type: boolean }
        approver: { type: boolean }
        auditor: { type: boolean }
        security: { type: boolean, description: May edit repository security policy (age, approval, vulnerability, license, IP ACL, notification receivers). }
        csrf_token: { type: string, description: Value for the X-CSRF-Token header on session-cookie mutations such as uploads. }
        impersonator:
          type: string
          description: >
            Administrator acting as this user. Present only while an
            impersonated session is active; the listed permissions are
            the impersonated user's own.
    OCITagInfo:
      type: object
      description: One tagged OCI image as the console's image view presents it.
      required: [can_label, digest, kind, labels, media_type, name, path, platforms, pulled_at, pulled_by, pushed_at, pushed_by, size, tag]
      properties:
        path:
          type: string
          description: >
            Stored path of the manifest, which is this artifact's identity for the
            label endpoints (an OCI manifest is an ordinary artifact row).
        labels:
          type: array
          description: Operator tags on the manifest, oldest first.
          items: { $ref: "#/components/schemas/ArtifactLabel" }
        can_label: { type: boolean, description: Whether the caller may change the labels. }
        name: { type: string, description: Image name within the repository. }
        tag: { type: string }
        digest: { type: string }
        media_type: { type: string }
        kind: { type: string, enum: [chart, image, artifact, index] }
        size: { type: integer, description: Config plus layer bytes; for an index, summed over stored children. }
        platforms:
          type: array
          items: { type: string }
        pushed_at: { type: string, format: date-time }
        pulled_at:
          type: [string, "null"]
          format: date-time
          description: Last served time; null when never pulled since the push. Minute-grained (serving refreshes it at most once per touch interval).
        pushed_by: { type: string, description: Who stored the manifest; empty for anonymous or unknown. }
        pulled_by: { type: string, description: Who last pulled; empty when never pulled or anonymous. }
    OCIArtifactDetail:
      type: object
      description: Drill-down view of one OCI artifact.
      required: [can_label, info, labels, manifest_json, path]
      properties:
        info: { $ref: "#/components/schemas/OCITagInfo" }
        path: { type: string, description: Stored manifest path, the identity the label endpoints take. }
        labels:
          type: array
          items: { $ref: "#/components/schemas/ArtifactLabel" }
        can_label: { type: boolean }
        manifest_json:
          type: object
          description: The stored manifest document verbatim.
          additionalProperties: true
        config_json:
          type: object
          description: The config blob verbatim (image config or Chart.yaml metadata). Absent for an index.
          additionalProperties: true
        image:
          type: object
          description: Image config summary. Present only for kind image.
          properties:
            os: { type: string }
            architecture: { type: string }
            created: { type: string }
            entrypoint: { type: array, items: { type: string } }
            cmd: { type: array, items: { type: string } }
            env: { type: array, items: { type: string } }
            layers: { type: integer }
        chart:
          type: object
          description: Files extracted from the chart archive. Present only for kind chart.
          properties:
            values_yaml: { type: string }
            readme_md: { type: string }
        children:
          type: array
          description: Index children (kind index only).
          items:
            type: object
            properties:
              digest: { type: string }
              platform: { type: string }
              size: { type: integer }
    LandingStats:
      type: object
      description: Public coarse totals shown on the login page.
      required: [artifacts, repositories]
      properties:
        repositories: { type: integer }
        artifacts: { type: integer }
    Version:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        oidc_enabled:
          type: boolean
          description: >
            Drives the login page: the single sign-on button is hidden when OIDC
            is not configured, because /auth/login is then unregistered.
    Announcement:
      type: object
      description: >
        The site-wide banner. An empty body means there is nothing to show;
        updated_by is absent until someone has set one.
      required: [body, updated_at]
      properties:
        body: { type: string, description: Markdown source, rendered by the UI. }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    AnnouncementInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: >
            Markdown source. Capped at 1000 characters and 16KiB; an empty
            string clears the announcement.
    SearchResult:
      type: object
      description: >
        Grouped global-search results. A null section means the caller lacks
        access to that surface; an empty array means access but no match.
      properties:
        query: { type: string }
        repositories:
          type: [array, "null"]
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              format: { type: string }
              type: { type: string }
        artifacts:
          type: [array, "null"]
          items:
            type: object
            properties:
              repo_id: { type: integer }
              repo_name: { type: string }
              path: { type: string }
              size: { type: integer }
        labels:
          type: [array, "null"]
          description: >
            Artifact-label matches, narrowed per repository by the read action
            like the artifact hits. A label is its own section because that is how
            it is searched for: the matching label is what the reader needs to see.
          items:
            type: object
            properties:
              repo_id: { type: integer }
              repo_name: { type: string }
              path: { type: string }
              label: { type: string }
        approvals:
          type: [array, "null"]
          items:
            type: object
            properties:
              id: { type: integer }
              repo_name: { type: string }
              package: { type: string }
              status: { type: string, enum: [pending, approved, rejected] }
        users:
          type: [array, "null"]
          items:
            type: object
            properties:
              id: { type: integer }
              username: { type: string }
              robot: { type: boolean }
        roles:
          type: [array, "null"]
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              description: { type: string }
        counts:
          type: object
          description: >
            Exact total matches per permitted section (item lists are capped by
            limit). Keys mirror the section names; absent for sections the
            caller cannot see.
          additionalProperties: { type: integer }
    Repository:
      type: object
      description: A repository as the detail endpoints return it.
      required: [capabilities, config, created_at, description, disabled, format, id, name, publish_methods, seeded, type, updated_at, upstream_url]
      properties:
        id: { type: integer }
        name: { type: string }
        format: { type: string, enum: [maven, npm, cargo, go, pypi, raw, oci] }
        type: { type: string, enum: [hosted, proxy, group] }
        upstream_url: { type: string }
        config: { $ref: "#/components/schemas/RepoConfig" }
        description:
          type: string
          description: Optional operator-facing free text (max 1000 bytes).
        disabled:
          type: boolean
          description: Repository is offline; package and artifact requests are refused.
        seeded:
          type: boolean
          description: A predefined seed repository; protected from deletion (DELETE returns 403).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        capabilities:
          $ref: "#/components/schemas/RepositoryCapabilities"
        publish_methods:
          type: array
          description: Supported ecosystem-native publishers; generic raw PUT is excluded.
          items: { type: string, enum: [mvn, npm, twine, cargo, docker, helm, oras] }
    RepositoryListItem:
      description: >
        A repository as the list endpoint returns it: the detail shape plus
        aggregate counts that are computed per listing and are absent from every
        other repository response.
      allOf:
        - $ref: "#/components/schemas/Repository"
        - type: object
          required: [artifact_count, can_write, clean_count, pending_approval_count, scanned_count, total_size]
          properties:
            artifact_count:
              type: integer
              description: Stored artifact count.
            total_size:
              type: integer
              description: Total stored bytes.
            pending_approval_count:
              type: integer
              description: Packages awaiting approval in this repository; 0 when approval is not configured.
            can_write:
              type: boolean
              description: Whether the current principal may upload to this repository.
            scanned_count:
              type: integer
              description: Stored artifacts that have a vulnerability scan.
            clean_count:
              type: integer
              description: Scanned artifacts that are clean, i.e. carry no advisories.
    RepositoryCapabilities:
      type: object
      required: [read, write, delete, upload]
      properties:
        read: { type: boolean }
        write: { type: boolean }
        delete: { type: boolean }
        upload: { type: boolean }
    RepositoryCreate:
      type: object
      required: [name, format, type]
      properties:
        name: { type: string }
        format: { type: string, enum: [maven, npm, cargo, go, pypi, raw, oci] }
        type: { type: string, enum: [hosted, proxy, group] }
        upstream_url: { type: string }
        config: { $ref: "#/components/schemas/RepoConfig" }
        description:
          type: string
          description: Optional operator-facing free text (max 1000 bytes).
    RepoConfig:
      type: object
      description: >
        A repository's policy document. Every section is always present - the
        server materialises defaults - so a client reads config.vuln.enabled
        without first checking that vuln exists. Only upstream_auth is omitted,
        and only when no credentials are set.
      required:
        [age_policy, approval, cache, group, ip_acl, license, notify,
         policy_pipeline, retention, upload, vuln]
      properties:
        public:
          type: boolean
          description: Anonymous reads allowed on this repository even when instance-wide anonymous read is off. Writes always require authentication.
        cache: { $ref: "#/components/schemas/CacheConfig" }
        age_policy: { $ref: "#/components/schemas/AgePolicyConfig" }
        approval: { $ref: "#/components/schemas/ApprovalConfig" }
        policy_pipeline: { $ref: "#/components/schemas/PolicyPipelineConfig" }
        group: { $ref: "#/components/schemas/GroupConfig" }
        ip_acl: { $ref: "#/components/schemas/IPACLConfig" }
        notify: { $ref: "#/components/schemas/NotifyConfig" }
        retention: { $ref: "#/components/schemas/RetentionConfig" }
        vuln: { $ref: "#/components/schemas/VulnPolicyConfig" }
        license: { $ref: "#/components/schemas/LicensePolicyConfig" }
        upload: { $ref: "#/components/schemas/UploadConfig" }
        upstream_auth: { $ref: "#/components/schemas/UpstreamAuthConfig" }
    CacheConfig:
      type: object
      description: Proxy caching for a repository.
      required: [artifact_ttl, enabled, eviction, max_size_bytes, metadata_ttl, negative_ttl]
      properties:
        enabled: { type: boolean }
        artifact_ttl: { type: string, examples: ["0", "1h"] }
        metadata_ttl: { type: string, examples: ["15m"] }
        negative_ttl: { type: string, examples: ["5m"] }
        max_size_bytes: { type: integer, description: Caps the repository cache size; 0 means unbounded. }
        eviction: { type: string, enum: [lru] }
    AgePolicyConfig:
      type: object
      description: Supply-chain cooldown by upstream release age.
      required: [action, enabled, max_age, min_age]
      properties:
        enabled: { type: boolean }
        min_age: { type: string, examples: ["3d"] }
        max_age: { type: string }
        action: { type: string, enum: [block, warn] }
    ApprovalConfig:
      type: object
      description: >
        Package approval policy (proxy repositories only). Unapproved
        packages are blocked with 403 and queued as pending requests; the
        decision unit is the whole package, version freshness stays with
        age_policy. Mode "audit" serves normally but logs and counts what
        "enforce" would have blocked.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [enforce, audit], default: enforce }
        auto_approve:
          type: array
          description: path.Match glob patterns of package names that bypass approval.
          items: { type: string }
          examples: [["@company/*"]]
        auto_approve_clean:
          type: boolean
          description: >
            Auto-approve a package once the requested coordinate has a stored
            vulnerability scan with no advisories (max severity "none"),
            instead of queuing it. Requires a scanner; applies in enforce and
            audit modes. Automated vulnerability and license checks still
            run before final approval.
    PolicyPipelineConfig:
      type: object
      description: >
        Versioned automated-assessment filter order. Vulnerability, license,
        and age can be reordered. Version deny is a fixed artifact guard;
        human approval is the fixed final serving boundary.
      required: [order, schema_version]
      properties:
        schema_version:
          type: integer
          enum: [2]
          default: 2
        order:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [vulnerability, license, age]
          examples: [[vulnerability, license, age]]
    GroupConfig:
      type: object
      description: >
        Group repository membership (type "group" only). Members are looked
        up in order and the first hit is served; groups are read-only.
      properties:
        members:
          type: array
          items: { type: string }
          examples: [["maven-hosted", "maven-central"]]
    IPACLConfig:
      type: object
      description: >
        Source-IP access control. When enabled, only requests whose client
        IP matches an allow entry (IPv4/IPv6 address or CIDR) are served;
        others get 403. The client IP is the first X-Forwarded-For hop set
        by the ingress, falling back to the TCP peer. An empty allow list
        blocks everything. For a group it guards entry; member repositories
        are not re-checked on fan-out.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        allow:
          type: array
          items: { type: string }
          examples: [["10.0.0.0/16", "203.0.113.5", "2001:db8::/32"]]
    NotifyConfig:
      type: object
      description: >
        Selects notification receivers (named alarm channels managed in the
        admin console) alerted when a package in this repository enters the
        approval queue. Lists receiver names; empty means no notification.
      properties:
        receivers:
          type: array
          items: { type: string }
          examples: [["slack-security"]]
    RetentionConfig:
      type: object
      description: Auto-deletes artifacts idle (not served) beyond idle_ttl; "0" disables.
      properties:
        idle_ttl: { type: string, examples: ["30d"] }
    VulnPolicyConfig:
      type: object
      description: >
        Vulnerability policy. When enabled, a requested version whose highest
        advisory severity meets threshold is blocked, warned, or audited per
        action. Ignore lists advisory ids accepted as false-positive.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        threshold: { type: string, enum: [critical, high, medium, low], default: high }
        action: { type: string, enum: [block, warn, audit], default: audit }
        ignore:
          type: array
          items: { type: string }
          examples: [["CVE-2024-1234", "GHSA-xxxx-yyyy-zzzz"]]
        block_unscanned:
          type: boolean
          description: Block a not-yet-scanned version instead of serving it while scanning asynchronously.
    LicensePolicyConfig:
      type: object
      description: >
        License policy on resolved SPDX identifiers. Deny blocks matching
        licenses; a non-empty allow gates anything outside it (allow-list
        mode). Identifiers match case-insensitively.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        action: { type: string, enum: [block, warn, audit], default: audit }
        deny:
          type: array
          items: { type: string }
          examples: [["GPL-3.0-only"]]
        allow:
          type: array
          items: { type: string }
        block_unresolved:
          type: boolean
          description: Gate a version whose license is not resolved yet instead of serving it while resolving asynchronously.
    UploadConfig:
      type: object
      description: Hosted-upload compatibility switches.
      properties:
        pypi_allow_legacy_zip:
          type: boolean
          description: Accept legacy .zip sdists on hosted PyPI repositories.
    UpstreamAuthConfig:
      type: object
      description: >
        Credentials a proxy repository presents to its upstream (private
        registries, or authenticated mirroring to avoid anonymous rate
        limits). Proxy repositories only. Secret fields (password, token,
        value) are masked as "********" in every response; sending the
        mask back on update keeps the stored secret. The type field is an
        open discriminator so flow-based schemes (e.g. the OCI registry
        token challenge used by Harbor and Docker Hub) can be added later.
      properties:
        type: { type: string, enum: ["", basic, bearer, header] }
        username: { type: string, description: basic only. }
        password: { type: string, description: basic only; masked in responses. }
        token: { type: string, description: bearer only; masked in responses. }
        header: { type: string, description: header only; the header name, e.g. X-Api-Key. }
        value: { type: string, description: header only; masked in responses. }
    PackageApprovalList:
      type: object
      description: >
        One page of the approval queue. count is every row matching the active
        filters and search rather than just this page, so a client can page
        without asking again.
      required: [approvals, count]
      properties:
        count: { type: integer }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/PackageApproval" }
    ApprovalCount:
      type: object
      description: Queue size on its own, for the pending badge that does not need the rows.
      required: [count]
      properties:
        count: { type: integer }
    PendingApprovalRepoList:
      type: object
      required: [repos]
      properties:
        repos:
          type: array
          items: { $ref: "#/components/schemas/PendingApprovalRepo" }
    VersionDenyList:
      type: object
      description: >
        One page of the per-version deny list. count is every rule matching the
        filter, not just this page.
      required: [count, denies]
      properties:
        count: { type: integer }
        denies:
          type: array
          items: { $ref: "#/components/schemas/VersionDeny" }
    PackageApproval:
      type: object
      required: [decided_at, decided_by, first_requested_at, id, last_requested_at, last_requested_version, note, package, repo_name, request_count, requested_by, status]
      properties:
        id: { type: integer }
        repo_name: { type: string }
        package: { type: string, description: Canonical per-format package name. }
        status: { type: string, enum: [pending, approved, rejected] }
        requested_by: { type: string, description: First requester, empty for anonymous. }
        decided_by: { type: string }
        note: { type: string }
        request_count: { type: integer }
        last_requested_version: { type: string, description: Last version seen in a blocked request, empty if none carried one. }
        first_requested_at: { type: string, format: date-time }
        last_requested_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        vuln_severity: { type: string, description: Max severity of the stored scan (critical|high|medium|low|none); absent when unscanned. }
        vuln_ids:
          type: array
          items: { type: string }
        vuln_scope: { type: string, enum: [version, package], description: Whether the scan covers the exact requested version or the whole package. }
        vuln_counts:
          type: object
          description: Advisory count per severity.
          additionalProperties: { type: integer }
        vuln_advisories:
          type: array
          items: { $ref: "#/components/schemas/VulnAdvisory" }
        vuln_source: { type: string, description: Advisory source, e.g. OSV. }
        vuln_scanned_at: { type: [string, "null"], format: date-time }
        vuln_scan_ms: { type: integer, description: Scan elapsed milliseconds. }
        reviewers:
          type: array
          description: Usernames permitted to approve this repository (detail endpoint only).
          items: { type: string }
        upstream_url: { type: string, description: Proxy upstream base URL (detail endpoint only). }
        upstream_package_url: { type: string, description: Resolved package URL on the upstream (detail endpoint only). }
        notified_receivers:
          type: array
          description: Receivers an approval-request alarm was dispatched to.
          items: { type: string }
        notified_at: { type: [string, "null"], format: date-time }
        notify_result: { type: string, enum: [delivered, failed] }
        notify_duration_ms: { type: integer }
        notify_detail: { type: string, description: Delivery outcome detail, e.g. HTTP 200 or a failure reason. }
    VersionDeny:
      type: object
      required: [created_at, created_by, id, package, reason, repo_name, version]
      properties:
        id: { type: integer }
        repo_name: { type: string }
        package: { type: string, description: Canonical per-format package name. }
        version: { type: string, description: Exact denied version. }
        reason: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    AuditLogList:
      type: object
      description: >
        One page of a repository's audit log, newest first. count is every entry
        matching the filter rather than just this page, so a client can page
        without a second request.
      required: [count, logs]
      properties:
        count: { type: integer }
        logs:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
    AuditLog:
      type: object
      required: [client_ip, created_at, event, id, method, path, status, user_agent, username]
      properties:
        id: { type: integer }
        event:
          type: string
          enum: [view, download, upload, delete, ttl.expire, vuln.block, license.block,
                 repo.create, repo.update, repo.delete,
                 approval.request, approval.approve, approval.reject,
                 deny.create, deny.delete, deny.block, upload.metadata,
                 upload.reject, upload.cancel]
        path: { type: string }
        username: { type: string, description: Empty for anonymous access. }
        method: { type: string }
        status: { type: integer }
        client_ip: { type: string }
        user_agent: { type: string }
        request_id: { type: string, description: Correlates rows emitted by one upload. }
        detail_json: { type: string, description: Bounded event-specific JSON detail. }
        created_at: { type: string, format: date-time }
    TokenCreate:
      type: object
      required: [name, description, scopes, expires_in]
      properties:
        name: { type: string }
        description: { type: string }
        expires_in:
          type: string
          description: Token lifetime as a duration string, at most one year (8760h).
          examples: ["720h"]
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TokenScope" }
    VulnAdvisory:
      type: object
      description: One advisory from the vulnerability scan of a package coordinate.
      required: [id, severity]
      properties:
        id: { type: string, examples: ["GHSA-xxxx-yyyy-zzzz"] }
        severity: { type: string, enum: [critical, high, medium, low] }
        score: { type: string, description: CVSS base score, when the source carries one. }
    PendingApprovalRepo:
      type: object
      description: >
        One repository's approval queue: how many packages are pending and how
        many of those are clean, i.e. would be admitted by a clean-only bulk
        approve. Drives the bulk-approve overview.
      required: [clean, format, id, pending, repo_name, type]
      properties:
        id: { type: integer }
        repo_name: { type: string }
        format: { type: string }
        type: { type: string }
        pending: { type: integer }
        clean: { type: integer }
    IssuedToken:
      type: object
      description: >
        A freshly created token. This is the only response carrying the
        plaintext secret; the server stores a hash and cannot show it again.
      required: [description, expires_at, id, name, token]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        token: { type: string, description: The secret, shown once. }
        expires_at: { type: [string, "null"], format: date-time, description: Null when the token does not expire. }

    TokenScope:
      type: object
      required: [repo_pattern, actions]
      properties:
        repo_pattern: { type: string, examples: ["maven-*"] }
        actions:
          type: array
          minItems: 1
          description: >
            The data-plane actions, plus audit - the one management-plane action
            a token may carry. audit is read-only viewing of the admin surfaces,
            so a leaked token still cannot decide approvals, edit policy or
            manage accounts; approve, security and admin stay session-only.
          items: { type: string, enum: [read, write, delete, audit] }
    HAStatus:
      type: object
      required: [backend, enabled, identity, is_leader, leader, mode, role]
      properties:
        enabled: { type: boolean, description: Leader election active (HA mode). }
        mode: { type: string, description: "Topology: single, shared-volume, replication or object-storage." }
        backend: { type: string, enum: [fs, s3] }
        storage_endpoint: { type: string, description: Object-storage bucket/endpoint (s3) or data directory (fs). }
        identity: { type: string, description: This pod's leader-election identity. }
        leader: { type: string, description: Current Lease holder's identity. }
        is_leader: { type: boolean }
        role: { type: string, enum: [leader, standby] }
        lease_name: { type: string }
        fencing_token: { type: integer, description: Lease transition count guarding s3 metadata writes. }
        started_at: { type: string, format: date-time, description: Process start time, for uptime display. }
        version: { type: string, description: This pod's forklift version. }
        runtime: { type: string, description: The Rust toolchain this pod's binary was built with. }
    StorageStats:
      type: object
      description: >
        The object-storage overview: the active backend, forklift's own
        deduplicated blob footprint, and whichever capacity source the backend
        offers - the volume for fs, the MinIO admin API for minio.
      required: [backend, blob_bytes, blob_count, dangling, mode]
      properties:
        backend: { type: string, enum: [fs, s3] }
        mode: { type: string, enum: [filesystem, minio, s3], description: Human-facing storage mode for the overview. }
        endpoint: { type: string, description: Where artifacts live - the object-storage endpoint (s3) or the data directory (fs). }
        bucket: { type: string }
        prefix: { type: string }
        blob_count: { type: integer }
        blob_bytes: { type: integer }
        minio_error: { type: string, description: Why the MinIO cluster metrics are absent. }
        fs_error: { type: string, description: Why the filesystem capacity could not be measured. }
        fs: { $ref: "#/components/schemas/DiskUsage" }
        dangling:
          type: array
          description: >
            Artifacts listed in the metadata whose blob bytes are absent from
            the blob store, so every request for them fails. Each entry is
            re-checked against its artifact row before it is reported, and
            the list is capped at 100.
          items: { $ref: "#/components/schemas/DanglingRef" }
        minio: { $ref: "#/components/schemas/MinioStats" }
    DiskUsage:
      type: object
      description: >
        Capacity of the volume the data directory lives on. Present only for the
        fs backend - a PersistentVolume is what fills up, and a bucket has no
        capacity, so S3 has none.
      required: [available_bytes, total_bytes, usage_ratio, used_bytes]
      properties:
        path: { type: string, description: The directory the numbers were measured through. }
        total_bytes: { type: integer }
        used_bytes: { type: integer }
        available_bytes: { type: integer, description: Writable by this process, excluding any root reserve, so used + available can fall short of total. }
        usage_ratio: { type: number, description: "used_bytes/total_bytes, 0 to 1." }
    DanglingRef:
      type: object
      description: One artifact whose blob bytes are gone, so serving it fails.
      required: [first_seen, hits, last_seen, path, repo_id, repository, sha256, statuses]
      properties:
        repository: { type: string }
        repo_id: { type: integer }
        path: { type: string }
        sha256: { type: string }
        role: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        hits: { type: integer, description: Failed requests observed for this reference. }
        statuses:
          type: array
          description: >
            Response codes these failures produced, most frequent first. A fetch
            answers 500; a publish or a publication delete answers 503.
          items: { $ref: "#/components/schemas/StatusCount" }
        last_status: { type: integer, description: The code the most recent failure returned. }
    StatusCount:
      type: object
      required: [code, count]
      properties:
        code: { type: integer }
        count: { type: integer }
    MinioStats:
      type: object
      description: Live cluster metrics from the MinIO admin API; absent for every other backend.
      required:
        [available_bytes, bucket_count, logical_used_bytes, object_count, offline_drives,
         online_drives, servers, total_capacity_bytes, usage_ratio, used_bytes]
      properties:
        total_capacity_bytes: { type: integer }
        used_bytes: { type: integer }
        available_bytes: { type: integer }
        usage_ratio: { type: number }
        logical_used_bytes: { type: integer }
        object_count: { type: integer }
        bucket_count: { type: integer }
        online_drives: { type: integer }
        offline_drives: { type: integer }
        servers: { type: integer }
        version: { type: string }
    CoverageProject:
      type: object
      description: >
        One scanned GitLab project and its verdict. Applied means both halves of
        the wiring are present - the CI pipeline builds through forklift and a
        package-manager or image-build file pins the registry. Partial means only
        one of the two does, which resolves through forklift on some paths and
        around it on others. A check listed in muted_scopes is left out of that
        judgement, so a project with one muted half is applied on the other alone.
      required: [applied, branch, ci_wired, default_branch, evidence, exclude_reason, format, group, id, last_activity_at, muted_scopes, name, note, on_default, path, registry_pinned, skipped, topics, web_url]
      properties:
        id: { type: integer }
        path: { type: string, description: Full path with namespace, e.g. group/subgroup/project. }
        group: { type: string }
        name: { type: string }
        web_url: { type: string }
        default_branch: { type: string }
        topics:
          type: array
          items: { type: string }
        applied:
          type: string
          enum: [yes, partial, no, error]
        branch: { type: string, description: Branch the wiring was found on; empty when nothing was found. }
        on_default:
          type: [boolean, "null"]
          description: Whether branch is the default branch. Null when no wiring was found at all.
        format: { type: string, description: Repository formats derived from the forklift URL path, e.g. npm/maven. }
        ci_wired: { type: boolean }
        registry_pinned: { type: boolean }
        muted_scopes:
          type: array
          description: >
            Checks an operator has waived on this project, so they are neither
            required for the verdict nor credited to it. Both of them is the
            project being out of the measurement entirely.
          items: { type: string, enum: [ci, registry] }
        evidence:
          type: array
          description: Files that matched, as the trail behind the verdict.
          items: { type: string }
        note: { type: string, description: Scan remark such as branches_truncated:10/28, or an API error. }
        skipped: { type: boolean, description: The project has no GitLab CI at all, so it is out of the coverage denominator. }
        last_activity_at: { type: string, format: date-time }
        exclude_reason:
          type: string
          description: >
            Why the project is out of scope: "muted" when an operator silenced it
            from the console, or "topic:<name>" when the repository opted itself
            out. Empty when the project counts.
    CoverageProjectDetail:
      allOf:
        - $ref: "#/components/schemas/CoverageProject"
        - type: object
          required: [scanned]
          properties:
            scanned:
              type: boolean
              description: >
                False when the last scan produced no verdict for this project,
                either because it was excluded at the time or because it was
                created since.
    CoverageExcludedProject:
      type: object
      description: A project dropped before it was scanned, so it has a reason but no verdict.
      required: [default_branch, group, id, last_activity_at, name, path, reason, topics, web_url]
      properties:
        id: { type: integer }
        path: { type: string }
        group: { type: string }
        name: { type: string }
        web_url: { type: string }
        default_branch: { type: string }
        topics:
          type: array
          items: { type: string }
        reason: { type: string, description: '"muted", or "topic:<name>".' }
        last_activity_at: { type: string, format: date-time }
    CoverageProgress:
      type: object
      description: Live state of a running scan, so the console fills in as projects finish.
      required: [applied, done, errored, excluded, not_applied, partial, phase, skipped, started_at, total]
      properties:
        phase:
          type: string
          enum: [listing, scanning]
          description: listing while the project list is still paging in.
        done: { type: integer }
        total: { type: integer, description: Zero until the listing phase completes. }
        excluded: { type: integer }
        started_at: { type: string, format: date-time }
        applied: { type: integer }
        partial: { type: integer }
        not_applied: { type: integer }
        errored: { type: integer }
        skipped: { type: integer }
    CoverageOverview:
      type: object
      description: Everything the coverage dashboard reads in one call.
      required: [alarm_configured, applied, auto_scan_enabled, configured, history_retention_days, credentials_present, enabled, errored, excluded, excluded_projects, forklift_host, gitlab_url, last_scan_duration_ms, last_scan_error, last_scan_triggered_by, last_scanned_at, next_run_at, not_applied, partial, percent, projects, scan_cron, scan_progress, scanning, skipped, target, timezone]
      properties:
        target: { type: integer, description: The coverage denominator - in-scope projects that have GitLab CI. }
        applied: { type: integer }
        partial: { type: integer }
        not_applied: { type: integer }
        errored: { type: integer }
        skipped: { type: integer, description: Projects without GitLab CI, out of scope. }
        excluded: { type: integer }
        percent: { type: integer }
        projects:
          type: array
          items: { $ref: "#/components/schemas/CoverageProject" }
        excluded_projects:
          type: array
          items: { $ref: "#/components/schemas/CoverageExcludedProject" }
        last_scanned_at:
          type: [string, "null"]
          format: date-time
        last_scan_duration_ms: { type: integer }
        last_scan_triggered_by:
          type: string
          description: A username for a manual run, or schedule / startup for the automatic ones.
        last_scan_error: { type: string, description: Message of the last scan that failed; cleared once one succeeds. }
        scanning: { type: boolean }
        scan_progress:
          oneOf:
            - $ref: "#/components/schemas/CoverageProgress"
            - type: "null"
        gitlab_url: { type: string }
        forklift_host: { type: string, description: What a project must reference to count, saved or derived from FORKLIFT_EXTERNAL_URL. }
        configured: { type: boolean, description: False until both a GitLab instance and a forklift host are known. }
        enabled: { type: boolean, description: Whether coverage scanning is switched on and pointed at a GitLab instance it can reach. }
        credentials_present: { type: boolean, description: Whether a GitLab URL and token are set, which separates "turned off" from "never set up". }
        scan_cron: { type: string }
        timezone: { type: string }
        auto_scan_enabled: { type: boolean }
        next_run_at:
          type: [string, "null"]
          format: date-time
        alarm_configured: { type: boolean, description: Whether a scheduled report has anywhere to go. }
        history_retention_days: { type: integer, description: How long a trend reading is kept, and the widest window the chart can show. }
    CoverageGroup:
      type: object
      required: [applied, group, not_applied, partial, percent, target]
      properties:
        group: { type: string }
        target: { type: integer }
        applied: { type: integer }
        partial: { type: integer }
        not_applied: { type: integer }
        percent: { type: integer }
    CoverageSnapshot:
      type: object
      description: One historical coverage reading, written after each completed scan.
      required: [applied, not_applied, partial, percent, scanned_at, skipped, target]
      properties:
        target: { type: integer }
        applied: { type: integer }
        partial: { type: integer }
        not_applied: { type: integer }
        skipped: { type: integer }
        percent: { type: integer }
        scanned_at: { type: string, format: date-time }
    CoverageLastCommit:
      type: object
      required: [author_name, committed_at, ref, short_id, title, web_url]
      properties:
        ref: { type: string }
        short_id: { type: string }
        title: { type: string }
        author_name: { type: string }
        committed_at: { type: string, format: date-time }
        web_url: { type: string }
    CoveragePipelineFile:
      type: object
      required: [content, matches_forklift, path, truncated]
      properties:
        path: { type: string }
        content: { type: string, description: File body, truncated at 128 KiB. }
        truncated: { type: boolean }
        matches_forklift: { type: boolean, description: The file references the forklift host, so the viewer can highlight it. }
    CoveragePipeline:
      type: object
      required: [files, project_path, ref]
      properties:
        project_path: { type: string }
        ref: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/CoveragePipelineFile" }
    CoverageMuteInput:
      type: object
      description: >
        What to mute on the project. scopes is the whole state rather than a
        delta, so a check it leaves out is unmuted; muted is the all-or-nothing
        shorthand and scopes wins when both are sent.
      properties:
        muted: { type: boolean, description: Mute every check, or bring every one back. }
        scopes:
          type: array
          description: Checks to mute. An empty list unmutes the project.
          items: { type: string, enum: [ci, registry] }
    CoverageMute:
      type: object
      required: [muted, project_path, scopes]
      properties:
        project_path: { type: string }
        muted: { type: boolean, description: True when every check is muted, which is the whole project being out. }
        scopes:
          type: array
          items: { type: string, enum: [ci, registry] }
    CoverageSettings:
      type: object
      description: >
        Scan settings as stored. The GitLab access token is deliberately absent -
        it comes from the environment so it never reaches the database or a
        response. There is no request-rate setting: the crawl discovers a safe
        concurrency at run time from how the instance responds.
      required: [auto_scan_enabled, exclude_topics, forklift_host, forklift_host_default, gitlab_configured, gitlab_url, max_branches, next_run_at, receiver, report_enabled, scan_cron, since_days, skip_when_full_coverage, timezone, updated_at, updated_by, use_search]
      properties:
        forklift_host:
          type: string
          description: >
            The external domain a project's configuration must reference to count
            as wired. Defaults to the host of FORKLIFT_EXTERNAL_URL, so a normal
            deployment leaves it empty; saving an empty value hands it back to
            that default.
        exclude_topics:
          type: array
          description: >
            GitLab topics that opt a repository out from the repository side.
            What is in scope at all is decided by the access token, so there is
            no group or path list.
          items: { type: string }
        scan_cron: { type: string }
        timezone: { type: string }
        auto_scan_enabled: { type: boolean }
        report_enabled:
          type: boolean
          description: >
            Whether the scheduled report is sent. Kept apart from the receiver so
            turning it off does not discard where it goes.
        receiver:
          type: string
          description: The notification receiver the scheduled report is sent to. Empty turns the report off.
        skip_when_full_coverage: { type: boolean, description: Drop the scheduled report when every target project is applied. }
        max_branches: { type: integer, description: Cap on non-default branches searched per project. }
        since_days: { type: integer, description: Ignore branches whose last commit is older than this. }
        use_search: { type: boolean, description: Try GitLab blob search first - one call per project, on a much lower rate limit. }
        updated_by: { type: string }
        updated_at: { type: string }
        gitlab_url:
          type: string
          description: >
            The GitLab base the scan reads from, from
            FORKLIFT_COVERAGE_GITLAB_URL. Read-only: the URL and the token are
            one deployment decision, so both come from the environment.
        gitlab_configured: { type: boolean, description: Coverage scanning is switched on and has a GitLab URL and token. }
        forklift_host_default: { type: string, description: What an empty forklift_host falls back to, from FORKLIFT_EXTERNAL_URL. }
        next_run_at: { type: string, description: When the saved schedule fires next; empty when automatic scanning is off. }
    CoverageSettingsInput:
      type: object
      description: Every field is optional; an omitted field keeps its stored value.
      properties:
        forklift_host: { type: string }
        exclude_topics:
          type: array
          items: { type: string }
        scan_cron: { type: string }
        timezone: { type: string }
        auto_scan_enabled: { type: boolean }
        report_enabled: { type: boolean }
        receiver: { type: string }
        skip_when_full_coverage: { type: boolean }
        max_branches: { type: integer, minimum: 0, maximum: 200 }
        since_days: { type: integer, minimum: 1, maximum: 3650 }
        use_search: { type: boolean }
    CoverageHostCheckInput:
      type: object
      required: [forklift_host]
      properties:
        forklift_host: { type: string, description: A bare external domain, optionally with a port. }
    CoverageHostCheck:
      type: object
      required: [addresses, host, latency_ms, resolve_error, resolved, syntax_error]
      properties:
        host: { type: string, description: The value after a scheme and trailing slashes are stripped. }
        syntax_error: { type: string, description: Empty when the name could be a forklift address. }
        resolved: { type: boolean, description: DNS returned at least one address. Advisory only. }
        addresses:
          type: array
          description: Resolved addresses, capped for display.
          items: { type: string }
        resolve_error: { type: string, description: The resolver's own words on a failed lookup. }
        latency_ms: { type: integer }
    CoverageGitlabCheck:
      type: object
      required: [configured, error, latency_ms, reachable, status, url, version]
      properties:
        configured: { type: boolean, description: False when no URL or token is set, in which case nothing was attempted. }
        url: { type: string }
        reachable: { type: boolean, description: The API answered and accepted the token. }
        status: { type: integer, description: HTTP status returned, zero when the API never answered. }
        version: { type: string, description: The GitLab version, when the API reported one. }
        error: { type: string }
        latency_ms: { type: integer }
    CoverageScanStarted:
      type: object
      required: [started]
      properties:
        started: { type: boolean }
    CoverageAlarmPayload:
      type: object
      description: >
        The webhook body forklift posts for a coverage report. text is the
        human-readable summary Slack and Mattermost render as-is; the structured
        counts let any other consumer route on the raw numbers.
      required: [applied, errored, event, not_applied, partial, percent, skipped, target, text, timestamp]
      properties:
        text: { type: string }
        event: { type: string, description: coverage.report, or test for a sample. }
        target: { type: integer }
        applied: { type: integer }
        partial: { type: integer }
        not_applied: { type: integer }
        errored: { type: integer }
        skipped: { type: integer }
        percent: { type: integer }
        projects:
          type: array
          description: Paths still to migrate, capped the same as the text.
          items: { type: string }
        timestamp: { type: string, format: date-time }
    CoverageAlarmPreview:
      type: object
      required: [payload, receivers, sample]
      properties:
        payload: { $ref: "#/components/schemas/CoverageAlarmPayload" }
        sample: { type: boolean, description: True when no scan has completed yet, so the numbers are made up. }
        receivers:
          type: array
          items: { $ref: "#/components/schemas/NotificationSampleReceiver" }
    NotificationSamplePreview:
      type: object
      description: >
        The alarm a repository would send together with the receivers it would
        reach, so an operator can check both before anything is delivered.
      required: [payload, receivers]
      properties:
        payload: { $ref: "#/components/schemas/ApprovalAlarmPayload" }
        receivers:
          type: array
          items: { $ref: "#/components/schemas/NotificationSampleReceiver" }
    NotificationSampleReceiver:
      type: object
      description: >
        A receiver named by the repository's policy, with whether it still
        exists and is enabled - a name can outlive the receiver it referred to.
      required: [enabled, exists, name]
      properties:
        name: { type: string }
        exists: { type: boolean }
        enabled: { type: boolean }
    NotificationSampleReport:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/NotificationSampleResult" }
    NotificationSampleResult:
      type: object
      description: One receiver's delivery outcome; error is set only on a failure.
      required: [name, ok]
      properties:
        name: { type: string }
        ok: { type: boolean }
        error: { type: string }
    ApprovalAlarmPayload:
      type: object
      description: >
        The webhook body forklift posts when packages enter the approval queue.
        A single quarantined package fills package/version/requested_by; a
        grouped alarm (several within the batch window) fills count, packages
        and requesters instead.
      required: [event, package, repository, text, timestamp]
      properties:
        text: { type: string, description: Human-readable summary, for chat webhooks that render only this. }
        event: { type: string }
        repository: { type: string }
        package: { type: string }
        version: { type: string }
        requested_by: { type: string }
        timestamp: { type: string, format: date-time }
        count: { type: integer, description: Grouped alarms only. }
        packages:
          type: array
          description: 'Grouped alarms only; entries read "repo/pkg@version".'
          items: { type: string }
        requesters:
          type: array
          description: Grouped alarms only; the distinct usernames behind the batch.
          items: { type: string }
        clean_count:
          type: integer
          description: Grouped alarms only; packages whose scan found no advisories.
        dirty_count:
          type: integer
          description: Grouped alarms only; the rest - vulnerable or not yet scanned.
        max_severity: { type: string, description: Highest severity across the dirty packages; absent when none are vulnerable. }
        max_score: { type: string, description: CVSS score of max_severity. }
        top_cve: { type: string }
        top_package: { type: string }
    Receiver:
      type: object
      required: [created_at, created_by, description, enabled, id, name, repositories, updated_at, webhook_configured]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        webhook_configured: { type: boolean, description: Whether a webhook URL is set. The URL itself is write-only and never returned. }
        enabled: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        repositories:
          type: [array, "null"]
          description: >
            Repositories whose notify config selects this receiver by name. A
            receiver with a non-empty list cannot be deleted.
          items: { type: string }
    ReceiverInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Unique channel name (letters, digits, '-', '_')." }
        description: { type: string }
        webhook_url: { type: string, description: Absolute http(s) URL (Slack/Mattermost incoming webhook). Required on create; blank on update keeps the stored URL. }
        enabled: { type: boolean, default: true }
    RepositoryName:
      type: object
      description: Slim repository shape returned by /repository-names for token-scope autocomplete.
      required: [format, name, type]
      properties:
        name: { type: string }
        format: { type: string }
        type: { type: string, enum: [hosted, proxy, group] }
    Artifact:
      type: object
      required: [can_label, cached_at, cached_by, content_type, downloads_30d, labels, last_accessed_at, last_accessed_by, path, published_at, size, version]
      properties:
        path: { type: string }
        version: { type: string }
        size: { type: integer, format: int64 }
        content_type: { type: string }
        published_at: { type: [string, "null"], format: date-time }
        cached_at: { type: string, format: date-time }
        last_accessed_at: { type: string, format: date-time }
        cached_by: { type: string, description: Principal who first cached or uploaded this artifact, empty for anonymous. }
        downloads_30d:
          type: integer
          format: int64
          minimum: 0
          examples: [42, 0]
          description: >
            Number of recorded GET responses with status 200 or 206 for this
            repository name and artifact path, from the listing request's current
            time minus 30 days through that time (inclusive). Counts requests,
            including repeated downloads and partial responses, not unique users
            or completed file transfers. HEAD requests, redirects, 304 responses,
            and failures are excluded. Group requests are recorded against the
            group and are not attributed to member repositories.
            Computed from retained audit logs, so recording delays, disabled or
            dropped recording, and pruned history can reduce the count. Zero means
            no matching retained records, not proof the artifact has never been
            downloaded. The field is always present.
        last_accessed_by:
          type: string
          examples: [alice, ""]
          description: >
            Last authenticated username recorded by the artifact access touch.
            Anonymous requests preserve an existing username; an empty string
            means no authenticated user has been recorded since this field was
            introduced. Updates follow the access touch interval (minute-grained),
            so this is not an exact per-request identity and need not identify the
            request represented by last_accessed_at. The field is always present.
        publication_id: { type: string }
        artifact_role: { type: string, enum: [primary, metadata, checksum, index] }
        labels:
          type: array
          description: Operator tags on this artifact, oldest first.
          items: { $ref: "#/components/schemas/ArtifactLabel" }
        can_label:
          type: boolean
          description: >
            Whether the caller may add or remove this artifact's labels: an
            administrator on the repository, or the principal who uploaded it.
        max_severity: { type: string, description: Highest vulnerability severity from the stored scan, if any. }
        vuln_ids: { type: array, items: { type: string } }
        vuln_counts: { type: object, additionalProperties: { type: integer }, description: Vulnerability count per severity. }
        vuln_advisories:
          type: array
          items: { $ref: "#/components/schemas/VulnAdvisory" }
        vuln_source: { type: string }
        vuln_scanned_at: { type: [string, "null"], format: date-time }
        licenses: { type: array, items: { type: string }, description: Resolved SPDX license ids. }
        license_source: { type: string }
        license_resolved_at: { type: [string, "null"], format: date-time }
        blob_missing:
          type: boolean
          description: >
            The artifact's bytes are absent from the blob store, so requests for it
            fail. Set from references observed missing while serving or publishing.
        blob_missing_since: { type: [string, "null"], format: date-time, description: When the missing bytes were first observed. }
        blob_missing_last_seen:
          type: [string, "null"]
          format: date-time
          description: When the blob was last observed missing.
        blob_missing_last_status:
          type: integer
          description: HTTP status of the last fetch that found the blob missing.
        blob_missing_statuses:
          type: array
          description: Response codes the failures produced, most frequent first.
          items:
            type: object
            properties:
              code: { type: integer }
              count: { type: integer }
    ArtifactList:
      type: object
      description: >
        One page of a repository's artifacts, plus the publications that group
        them. Every field is always present: the handler builds the response
        from a fixed set of keys, so an empty repository reports zeroes and
        empty arrays rather than omitting them.
      required: [artifacts, count, filtered, labeled_count, publications, total_size]
      properties:
        count: { type: integer, description: Total artifacts in the repository, ignoring the search. }
        total_size: { type: integer, format: int64 }
        filtered: { type: integer, description: Artifacts matching the active search across all pages. }
        labeled_count:
          type: integer
          description: >
            Artifacts in the repository carrying at least one label, ignoring
            the search. labeled_count / count is the labeling coverage shown on
            the Statistics tab.
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        publications:
          type: array
          items: { $ref: "#/components/schemas/ArtifactPublication" }
    ArtifactLabel:
      type: object
      description: One operator tag on one artifact, with who applied it and when.
      required: [created_at, created_by, label]
      properties:
        label: { type: string, description: "Stored form: a key, or a key:value pair." }
        created_by: { type: string, description: Who applied it; empty for a label applied without an authenticated principal. }
        created_at: { type: string, format: date-time }
    ArtifactLabelList:
      type: object
      description: One artifact's labels, with the caller's permission to change them.
      required: [can_label, labels, path]
      properties:
        path: { type: string }
        labels:
          type: array
          items: { $ref: "#/components/schemas/ArtifactLabel" }
        can_label: { type: boolean }
    ArtifactBulkLabelInput:
      type: object
      description: One label, and the artifacts to put it on or take it off.
      required: [action, label, paths]
      properties:
        paths:
          type: array
          description: Artifact paths. Duplicates and blanks are dropped before the batch runs.
          maxItems: 200
          items: { type: string }
        label:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+(:[A-Za-z0-9_-]+)?$"
        action:
          type: string
          enum: [add, remove]
    ArtifactBulkDeleteInput:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          description: Artifact paths. Duplicates and blanks are dropped before the batch runs.
          maxItems: 200
          items: { type: string }
    ArtifactBulkResult:
      type: object
      description: >
        What a bulk action did. Reported per path rather than as one verdict, so a
        partly refused selection still tells the caller what changed.
      required: [failed, requested, succeeded]
      properties:
        requested: { type: integer, description: Paths in the request after blanks and duplicates were dropped. }
        succeeded: { type: integer }
        failed:
          type: array
          items: { $ref: "#/components/schemas/ArtifactBulkFailure" }
    ArtifactBulkFailure:
      type: object
      required: [error, path]
      properties:
        path: { type: string }
        error: { type: string }
    ArtifactLabelInput:
      type: object
      description: >
        The artifact to label and the label to apply. The path travels in the body
        because an artifact path contains slashes.
      required: [label, path]
      properties:
        path: { type: string }
        label:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+(:[A-Za-z0-9_-]+)?$"
          description: >
            A bare key, or a key:value pair. Each side is ASCII letters, digits,
            '-' and '_'. Surrounding whitespace is trimmed; casing is preserved.
    ArtifactPublication:
      type: object
      required: [actions, asset_count, coordinate, created_at, created_by, format, id, package, total_size, updated_at, version, yanked]
      properties:
        id: { type: string }
        format: { type: string, enum: [maven, npm, cargo, go, pypi] }
        coordinate: { type: string }
        package: { type: string }
        version: { type: string }
        asset_count: { type: integer }
        total_size: { type: integer, format: int64 }
        broken_assets:
          type: integer
          description: Assets of this publication whose blob is no longer present in storage.
        actions:
          type: array
          items: { type: string, enum: [replace, extend, delete, yank, unyank] }
        yanked: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ArtifactUploadManifest:
      type: object
      required: [schema_version, format, overwrite, assets]
      properties:
        schema_version: { type: integer, enum: [1] }
        format: { type: string, enum: [maven, npm, cargo, go, pypi] }
        overwrite: { type: boolean, default: false }
        assets:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            required: [part]
            properties:
              part: { type: string }
              extension: { type: string }
              classifier: { type: string }
              role: { type: string }
        maven:
          $ref: "#/components/schemas/MavenUploadManifest"
        npm:
          $ref: "#/components/schemas/NPMUploadManifest"
        pypi:
          $ref: "#/components/schemas/PyPIUploadManifest"
        cargo:
          $ref: "#/components/schemas/CargoUploadManifest"
        go:
          $ref: "#/components/schemas/GoUploadManifest"
    MavenUploadManifest:
      type: object
      required: [group_id, artifact_id, version, generate_pom, packaging]
      additionalProperties: false
      properties:
        group_id: { type: string }
        artifact_id: { type: string }
        version: { type: string }
        generate_pom: { type: boolean }
        packaging: { type: string }
    NPMUploadManifest:
      type: object
      additionalProperties: false
      properties:
        dist_tag: { type: string, default: latest }
    PyPIUploadManifest:
      type: object
      additionalProperties: false
    CargoRegistryConfig:
      type: object
      description: Sparse registry config.json. Only dl is always present.
      required: [dl]
      properties:
        dl:
          type: string
          description: Download URL template with {crate} and {version} markers. On a group it names the group, not a member.
        api:
          type: string
          description: Registry Web API base. Present on hosted and group repositories, absent on a proxy.
        auth-required:
          type: boolean
          description: Present, and true, when anonymous read is disabled.
    CargoSearchResult:
      type: object
      required: [crates, meta]
      properties:
        crates:
          type: array
          items: { $ref: "#/components/schemas/CargoCrateSummary" }
        meta:
          type: object
          required: [total]
          properties:
            total:
              type: integer
              description: Number of matching crates across all pages
    CargoCrateSummary:
      type: object
      required: [name, max_version, description]
      properties:
        name:
          type: string
          description: Crate name as published
        max_version:
          type: string
          description: Highest non-yanked version, build metadata included
        description:
          type: string
          description: The package description, whitespace-collapsed and cut to 1024 bytes. Empty for crates published before descriptions were recorded.
    CargoPublishResult:
      type: object
      required: [warnings]
      properties:
        warnings:
          type: object
          required: [invalid_categories, invalid_badges, other]
          properties:
            invalid_categories: { type: array, items: { type: string } }
            invalid_badges: { type: array, items: { type: string } }
            other: { type: array, items: { type: string } }
    CargoOk:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    CargoErrors:
      type: object
      description: Cargo's error envelope. Cargo prints each detail as the cause of the failure.
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [detail]
            properties:
              detail: { type: string }
    CargoUploadManifest:
      type: object
      additionalProperties: false
      properties:
        yanked: { type: boolean, default: false }
    GoUploadManifest:
      type: object
      required: [module, version]
      additionalProperties: false
      properties:
        module: { type: string, examples: [example.com/team/module] }
        version: { type: string, examples: [v1.2.3] }
        time:
          type: string
          format: date-time
          description: Reserved for a future privileged import workflow; ordinary uploads omit it.
    UploadedArtifact:
      type: object
      required: [path, role, size, sha256]
      properties:
        path: { type: string }
        role: { type: string, enum: [primary, metadata, checksum, index] }
        size: { type: integer, format: int64 }
        sha256: { type: string }
    ArtifactUploadResult:
      type: object
      required: [upload_id, repository, format, coordinate, created, replaced, derived, scan_status, durability, warnings]
      properties:
        upload_id: { type: string }
        repository: { type: string }
        format: { type: string, enum: [maven, npm, cargo, go, pypi] }
        coordinate: { type: string }
        created: { type: array, items: { $ref: "#/components/schemas/UploadedArtifact" } }
        replaced: { type: array, items: { $ref: "#/components/schemas/UploadedArtifact" } }
        derived: { type: array, items: { $ref: "#/components/schemas/UploadedArtifact" } }
        scan_status: { type: string, enum: [queued, deferred, disabled] }
        durability: { type: string, enum: [local, async] }
        warnings: { type: array, items: { type: object } }
    UploadProblem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        upload_id: { type: string }
        field_errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: string } }
        conflict_action: { type: string, enum: [replace, reject] }
        retryable: { type: boolean }
    UploadPlan:
      type: object
      required: [path, package, version, content_type, size, approval_required, exists]
      properties:
        path: { type: string }
        package: { type: string }
        version: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        approval_required: { type: boolean }
        exists: { type: boolean }
    UploadResult:
      allOf:
        - { $ref: "#/components/schemas/UploadPlan" }
        - type: object
          required: [approval_status]
          properties:
            approval_status: { type: string, enum: [not_required, pending, approved, rejected, audit] }
    UpstreamHealth:
      type: object
      properties:
        applicable: { type: boolean, description: False for non-proxy repositories (nothing to probe). }
        reachable: { type: boolean }
        status: { type: integer, description: HTTP status returned by the probe, when reachable. }
        latency_ms: { type: integer, format: int64 }
        error: { type: string }
    RepoPermission:
      type: object
      description: A role permission whose repo pattern grants access to a repository.
      required: [actions, repo_pattern, role, role_id, user_count]
      properties:
        role_id: { type: integer }
        role: { type: string }
        repo_pattern: { type: string }
        actions: { type: array, items: { type: string } }
        user_count: { type: integer }
    RepoToken:
      type: object
      description: A personal access token that can reach a repository (scoped match or unscoped, inheriting owner roles).
      required: [actions, expires_at, last_used_at, name, owner, repo_pattern, token_id, unscoped]
      properties:
        token_id: { type: integer }
        name: { type: string }
        owner: { type: string }
        repo_pattern: { type: string }
        actions: { type: array, items: { type: string } }
        unscoped: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    SessionIdentity:
      type: object
      description: >
        Who the session now belongs to. Returned by the two operations that
        change that - signing in, and stepping back out of an impersonated
        session.
      required: [source, username]
      properties:
        username: { type: string }
        source: { type: string, description: Principal source, local or oidc. }
    ImpersonationStart:
      type: object
      description: >
        The impersonated session. Impersonation is time-boxed, so the caller is
        told when it lapses rather than having to discover it.
      required: [expires_in, impersonator, source, username]
      properties:
        username: { type: string, description: The impersonated user. }
        source: { type: string }
        impersonator: { type: string, description: The administrator behind the session. }
        expires_in: { type: string, description: 'Lifetime as a duration string, e.g. "30m0s".' }
    CreatedUser:
      type: object
      description: >
        The slim acknowledgement of a created user - enough to address the new
        row. The full record is a separate GET.
      required: [id, username]
      properties:
        id: { type: integer }
        username: { type: string }
    StatusMessage:
      type: object
      description: >
        Acknowledgement from an operation whose outcome is the fact that it ran.
        The value is prose for the operator, not a code to branch on.
      required: [status]
      properties:
        status: { type: string }
    UploadSession:
      type: object
      description: >
        A resumable upload's progress. Exactly one of result and problem is
        present once the session reaches a terminal state - the committed
        artifacts, or the conflict that stopped it - and neither while it is
        still receiving.
      required: [expires_at, state, upload_id]
      properties:
        upload_id: { type: string }
        state: { type: string }
        expires_at: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/ArtifactUploadResult" }
        problem: { $ref: "#/components/schemas/UploadProblem" }
    PublicationLifecycleResult:
      type: object
      description: >
        What a publication delete or yank changed: the publication itself, plus
        the derived files (indexes, metadata) rewritten or removed alongside it.
      required: [coordinate, deleted, derived_deleted, derived_updated, publication_id]
      properties:
        publication_id: { type: string }
        coordinate: { type: string, description: Canonical package coordinate the publication resolved to. }
        deleted: { type: [array, "null"], items: { type: string } }
        derived_updated: { type: [array, "null"], items: { $ref: "#/components/schemas/UploadedArtifact" } }
        derived_deleted: { type: [array, "null"], items: { type: string } }
        yanked: { type: boolean, description: Present on a yank, absent on a delete. }
    ArtifactPurgeResult:
      type: object
      description: >
        How many artifacts a purge removed. A purge takes out an unknown number
        of rows, so the count is the only way the caller learns what happened.
      required: [deleted]
      properties:
        deleted: { type: integer }
    ArtifactForceDeleteResult:
      type: object
      description: >
        The other shape this route answers with. A forced delete names the one
        path it removed, the digest that was missing, and whether the
        publication went with it. Note that deleted is a path here and a count
        in ArtifactPurgeResult - the same key, two types, which is why the
        response is one or the other rather than the two merged.
      required: [deleted, publication_coordinate, publication_deleted, sha256]
      properties:
        deleted: { type: string, description: Path of the deleted artifact. }
        sha256: { type: string, description: Digest of the blob that was missing. }
        publication_deleted: { type: boolean }
        publication_coordinate: { type: string }
    BulkApproveResult:
      type: object
      description: >
        How many packages the bulk approve admitted. With clean_only set that is
        fewer than the queue held, so the count is what tells the caller how
        much is left.
      required: [approved]
      properties:
        approved: { type: integer }
    LoginInput:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
    RepositoryInput:
      type: object
      properties:
        upstream_url: { type: string, description: Required for proxy repositories. }
        config: { $ref: "#/components/schemas/RepoConfig" }
        description:
          type: string
          description: Optional operator-facing free text (max 1000 bytes).
    RepositorySecurityInput:
      type: object
      properties:
        config:
          allOf: [{ $ref: "#/components/schemas/RepoConfig" }]
          description: >
            Only age_policy, approval, vuln, license, ip_acl, notify and
            public are read. Any other RepoConfig field present in the body is
            ignored rather than rejected, so a client may resend a full
            config document it fetched from GET /api/v1/repositories/{id}.
    UpstreamCheckInput:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Absolute http(s) URL to probe. }
        repository_id:
          type: integer
          description: >
            Probe with an existing repository's stored upstream
            credentials (responses only ever carry masked secrets, so
            clients cannot resend them). The url must match the
            repository's upstream scheme and host; stored credentials
            are never presented to any other destination.
        auth:
          type: object
          description: Inline credentials for a pre-create connectivity check; same shape as RepoConfig.upstream_auth.
    PublicationYankInput:
      type: object
      required: [yanked]
      properties: { yanked: { type: boolean } }
    RepositoryDisabledInput:
      type: object
      required: [disabled]
      properties:
        disabled: { type: boolean }
    UploadValidationInput:
      type: object
      required: [path, size]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        content_type: { type: string }
    TokenScopesInput:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
    UserCreate:
      type: object
      required: [username]
      properties:
        username: { type: string }
        password:
          type: string
          description: Required for a normal user; must be omitted for a robot account.
        email: { type: string }
        role_ids: { type: array, items: { type: integer } }
        robot:
          type: boolean
          description: >
            Create a token-only Robot Account: no password, interactive
            login (password and OIDC session) is refused, but the account
            can own personal access tokens for automation.
    UserInput:
      type: object
      properties:
        password: { type: string, description: New password (local users only). }
        disabled: { type: boolean }
        lockout_enabled: { type: boolean, description: Enable or disable account lockout after repeated failed logins. }
        unlock: { type: boolean, description: Clear an active lockout immediately. }
    ImpersonationInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the impersonation is needed; recorded in the server log.
    RoleAssignmentCreate:
      type: object
      properties:
        role_id: { type: integer }
    PackageApprovalCreate:
      type: object
      required: [repo, package, status]
      properties:
        repo: { type: string }
        package: { type: string, description: Canonical per-format package name. }
