[package]
name = "forklift"
version = "0.13.2"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
description = "Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI, raw, OCI) with proxy caching and supply-chain policy gates"
publish = false
default-run = "forklift"

[lib]
name = "forklift"
path = "src/lib.rs"

[[bin]]
name = "forklift"
path = "src/bin/forklift.rs"

[[bin]]
name = "forklift-mcp"
path = "src/bin/forklift_mcp.rs"

[features]
# Exposes `forklift::testing` (shared test harness) to the integration tests in tests/.
testing = []

[dependencies]
# Runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util", "rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await", "io"] }
async-trait = "0.1.92"
bytes = "1.12.1"

# HTTP server
axum = { version = "0.8.9", features = ["http1", "http2", "json", "query", "multipart", "matched-path", "original-uri", "tokio", "macros"] }
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "server-graceful", "service"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "set-header"] }

# HTTP client (upstream proxying, webhooks, OSV, deps.dev, GitLab, OIDC)
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "charset", "http2", "json", "stream", "multipart", "gzip"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }
hickory-resolver = { version = "0.26.2", default-features = false, features = ["tokio", "system-config"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
serde_yaml_ng = "0.10.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
toml = "1.1.5"

# Storage
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "hooks", "functions"] }
aws-config = { version = "1.12.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.145.0", default-features = false, features = ["rt-tokio", "http-1x", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.4.0", features = ["rustls-ring"] }
aws-smithy-runtime-api = { version = "1.16.0", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1.6.3", features = ["http-body-1-x", "rt-tokio"] }
aws-sigv4 = { version = "1.5.1", default-features = false, features = ["http1", "sign-http"] }
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }

# Kubernetes (Lease leader election, pod role label)
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }

# Auth
openidconnect = { version = "4.0.1", default-features = false }
bcrypt = "0.19.3"
hmac = "0.13.0"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
subtle = "2.6.1"
base64 = "0.23.1"
rand = "0.10.2"
hex = "0.4.3"

# MCP server (forklift-mcp binary)
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server", "schemars", "macros"] }
schemars = "1.2.2"

# Observability
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter", "std"] }
pprof = { version = "0.15.0", default-features = false, features = ["prost-codec"] }

# Static assets
rust-embed = { version = "8.12.0", features = ["include-exclude", "mime-guess", "debug-embed"] }
mime_guess = "2.0.5"

# Utilities
chrono = { version = "0.4.45", features = ["serde", "clock"] }
chrono-tz = "0.10.4"
thiserror = "2.0.20"
anyhow = "1.0.104"
url = "2.5.8"
regex = "1.13.1"
uuid = { version = "1.26.0", features = ["v4"] }
semver = "1.0.28"
glob-match = "0.2.1"
ipnet = "2.12.2"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
percent-encoding = "2.3.2"
form_urlencoded = "1.2.2"
mime = "0.3.17"
httpdate = "1.0.3"
humantime = "2.4.0"
libc = "0.2.189"
parking_lot = "0.12.5"
once_cell = "1.21.4"
dashmap = "6.2.1"
itoa = "1.0.18"
arc-swap = "1.9.2"

[dev-dependencies]
# Self-reference so tests/ can use the harness behind the `testing` feature.
forklift = { path = ".", features = ["testing"] }
wiremock = "0.6.5"
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
pretty_assertions = "1.4.1"
serial_test = "4.0.1"
# Reads DTO JSON shapes from Rust source (see src/api/openapi_schema_test.rs).
syn = { version = "3.0.5", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1
