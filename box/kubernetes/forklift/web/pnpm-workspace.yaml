allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
# Security-patch pins for transitive dependencies flagged by Dependabot.
# Each selector matches only the vulnerable range, so nothing else moves.
# Drop an entry once every dependent resolves to a patched version on its own.
overrides:
  brace-expansion@2: '>=5.0.9'
  shell-quote: '>=1.9.0'
  nanoid@<3.3.18: 3.3.18
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=3.0.0 <5.0.9: 5.0.9
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  fast-uri@>=3.0.0 <3.1.6: 3.1.6
  ip-address@<=10.3.0: 10.3.1
  undici@>=7.0.0 <7.29.0: 7.29.0
  postcss@<=8.5.22: 8.5.23
  hono@<4.13.5: 4.13.5
  '@hono/node-server@<1.19.15': 1.19.15
  uuid@<11.1.1: 11.1.1
