[package]
name = "ec2-metadata-exporter"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Prometheus exporter that publishes every EC2 instance's private IP and Name tag via the DescribeInstances API"
readme = "README.md"
repository = "https://github.com/younsl/o"

[[bin]]
name = "ec2-metadata-exporter"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }

# HTTP servers (metrics, health)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"

# Metrics
prometheus-client = "0.25"

# Config
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
aws-smithy-mocks = "0.3"
aws-sdk-ec2 = { version = "1", features = ["test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
