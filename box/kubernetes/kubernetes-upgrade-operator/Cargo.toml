[package]
name = "kuo"
version = "0.6.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Younsung Lee <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Kubernetes Upgrade Operator for EKS clusters"
repository = "https://github.com/younsl/addons"
readme = "README.md"

[dependencies]
# AWS SDK
aws-config = { version = "1.8", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process"] }
aws-sdk-eks = { version = "1.119", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-autoscaling = { version = "1.97", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.56", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1"

# Async runtime
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "fs"] }
tokio-util = "0.7"
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Kubernetes
kube = { version = "3.0.1", features = ["runtime", "derive", "client", "rustls-tls", "aws-lc-rs"], default-features = false }
k8s-openapi = { version = "0.27", features = ["v1_31"] }
schemars = { version = "1.2", features = ["chrono04"] }

# HTTP server (health endpoints)
axum = { version = "0.8", features = ["tokio"] }

# HTTP client (Slack notifications)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }

# TLS crypto provider
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

# Metrics
prometheus-client = "0.23"

# MCP server (kagent integration)
rmcp = { version = "3.1", features = ["transport-streamable-http-server"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date handling
chrono = { version = "0.4", features = ["serde"] }

# Secrets
secrecy = "0.10"

# Build info
const_format = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
