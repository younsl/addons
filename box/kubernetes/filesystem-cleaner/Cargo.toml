[package]
name = "filesystem-cleaner"
version = "0.4.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Kubernetes sidecar/init filesystem cleaner for managing disk space"
readme = "README.md"
repository = "https://github.com/younsl/o"

[[bin]]
name = "filesystem-cleaner"
path = "src/main.rs"

[dependencies]
# Async runtime (interval scheduling, signal handling)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"

# CLI
clap = { version = "4", features = ["derive"] }

# Glob matching. The default settings (literal_separator=false) are load-bearing:
# deployed exclude patterns like `*.log` rely on `*` matching across `/`.
globset = "0.4"

# statvfs(2) for disk usage
nix = { version = "0.31", default-features = false, features = ["fs"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
