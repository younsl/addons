<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>

  <!-- top row: the sync path -->
  <rect x="40" y="110" width="190" height="80" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="135" y="144" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Argo CD</text>
  <text x="135" y="166" font-size="11.5" fill="#6b6b6b" text-anchor="middle">Sync from UI &#183; CLI &#183; API</text>

  <rect x="300" y="110" width="220" height="80" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="410" y="144" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">kube-apiserver</text>
  <text x="410" y="166" font-size="11.5" fill="#6b6b6b" text-anchor="middle">validating webhook</text>

  <rect x="590" y="110" width="240" height="80" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="710" y="140" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">argocd-canary-gate</text>
  <text x="710" y="160" font-size="11.5" fill="#cccccc" text-anchor="middle">deny while a canary</text>
  <text x="710" y="175" font-size="11.5" fill="#cccccc" text-anchor="middle">is mid-flight</text>

  <!-- bottom row -->
  <rect x="300" y="280" width="220" height="72" rx="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="310" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">cert-manager</text>
  <text x="410" y="330" font-size="11" fill="#6b6b6b" text-anchor="middle">serving cert + webhook caBundle</text>

  <rect x="590" y="280" width="240" height="80" rx="6" fill="#f4f4f4" stroke="#111111" stroke-width="1.5"/>
  <text x="710" y="310" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Rollout</text>
  <text x="710" y="330" font-size="11.5" fill="#6b6b6b" text-anchor="middle">stableRS vs currentPodHash</text>
  <text x="710" y="345" font-size="11.5" fill="#6b6b6b" text-anchor="middle">pauseConditions &#183; abort</text>

  <!-- flow -->
  <line x1="230" y1="150" x2="296" y2="150" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="263" y="138" font-size="11.5" fill="#6b6b6b" text-anchor="middle">1. sync</text>

  <line x1="520" y1="134" x2="586" y2="134" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="553" y="122" font-size="11.5" fill="#6b6b6b" text-anchor="middle">2. review</text>

  <line x1="586" y1="170" x2="524" y2="170" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="553" y="200" font-size="11.5" fill="#6b6b6b" text-anchor="middle">4. allow, or deny 403</text>
  <text x="553" y="215" font-size="11.5" fill="#6b6b6b" text-anchor="middle">shown in the sync toast</text>

  <line x1="750" y1="190" x2="750" y2="276" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="762" y="228" font-size="11.5" fill="#6b6b6b">3. reads live status</text>
  <text x="762" y="243" font-size="11.5" fill="#6b6b6b">by tracking label</text>

  <!-- cert-manager keeps the webhook's TLS trust working: the serving pair
       lands in a Secret the gate mounts, the caBundle lands in the webhook
       registration the apiserver holds -->
  <line x1="410" y1="276" x2="410" y2="194" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="40" y="392" font-size="11.5" fill="#6b6b6b">A denied sync is also recorded as a Kubernetes Event on the Application. Auto-sync and skip-annotated apps are exempt.</text>
</svg>
