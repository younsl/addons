<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

  <!-- cluster boundary -->
  <rect x="20" y="24" width="860" height="592" rx="12" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="52" font-size="15" font-weight="600" fill="#111111">Kubernetes Cluster</text>

  <!-- sync writers -->
  <rect x="60" y="72" width="240" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="100" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">argocd-server</text>
  <text x="180" y="120" font-size="11.5" fill="#6b6b6b" text-anchor="middle">Sync from UI &#183; CLI &#183; REST API</text>

  <rect x="340" y="72" width="250" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="465" y="100" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">application controller</text>
  <text x="465" y="120" font-size="11.5" fill="#6b6b6b" text-anchor="middle">auto-sync &#183; exempt by default</text>

  <rect x="630" y="72" width="210" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="735" y="100" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Argo Rollouts controller</text>
  <text x="735" y="120" font-size="11.5" fill="#6b6b6b" text-anchor="middle">runs the canary, writes status</text>

  <!-- kube-apiserver -->
  <rect x="60" y="208" width="530" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="325" y="236" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">kube-apiserver</text>
  <text x="325" y="256" font-size="11.5" fill="#6b6b6b" text-anchor="middle">ValidatingWebhookConfiguration &#183; matchConditions narrow to new sync operations</text>

  <!-- writers to apiserver -->
  <line x1="180" y1="136" x2="180" y2="204" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="192" y="168" font-size="11.5" fill="#6b6b6b">1. sync sets</text>
  <text x="192" y="184" font-size="11.5" fill="#6b6b6b">operation field</text>
  <line x1="465" y1="136" x2="465" y2="204" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="477" y="176" font-size="11.5" fill="#6b6b6b">passes through</text>

  <!-- argocd namespace -->
  <rect x="60" y="344" width="530" height="248" rx="10" fill="#f4f4f4" stroke="#111111" stroke-width="1.5"/>
  <text x="84" y="368" font-size="14" font-weight="600" fill="#111111">namespace: argocd</text>

  <!-- gate pod -->
  <rect x="84" y="384" width="290" height="140" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="229" y="412" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">argocd-canary-gate</text>
  <text x="229" y="434" font-size="11.5" fill="#cccccc" text-anchor="middle">webhook HTTPS :8443 POST /validate</text>
  <text x="229" y="452" font-size="11.5" fill="#cccccc" text-anchor="middle">admin HTTP :8080 probes &#183; metrics</text>
  <text x="229" y="478" font-size="11.5" fill="#cccccc" text-anchor="middle">deny while stableRS &#8800; currentPodHash,</text>
  <text x="229" y="494" font-size="11.5" fill="#cccccc" text-anchor="middle">pauseConditions present, or abort</text>

  <!-- application object -->
  <rect x="398" y="384" width="168" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="482" y="412" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Application</text>
  <text x="482" y="432" font-size="11.5" fill="#6b6b6b" text-anchor="middle">spec.destination.namespace</text>
  <text x="482" y="448" font-size="11.5" fill="#6b6b6b" text-anchor="middle">points at the Rollouts</text>

  <!-- admission round trip -->
  <line x1="160" y1="272" x2="160" y2="380" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="304" font-size="11.5" fill="#6b6b6b">2. AdmissionReview</text>
  <line x1="300" y1="380" x2="300" y2="276" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="304" font-size="11.5" fill="#6b6b6b">4. allow, or deny 403</text>
  <text x="312" y="320" font-size="11.5" fill="#6b6b6b">shown in the Argo CD toast</text>

  <!-- event write -->
  <line x1="374" y1="422" x2="394" y2="422" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="384" y="486" font-size="11.5" fill="#6b6b6b" text-anchor="start">5. Event CanaryBlocked</text>
  <text x="384" y="502" font-size="11.5" fill="#6b6b6b" text-anchor="start">on deny or warn only</text>

  <!-- destination namespace -->
  <rect x="630" y="208" width="210" height="384" rx="10" fill="#f4f4f4" stroke="#111111" stroke-width="1.5"/>
  <text x="650" y="232" font-size="13" font-weight="600" fill="#111111">namespace: app destination</text>

  <rect x="650" y="248" width="170" height="92" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="735" y="274" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Rollout</text>
  <text x="735" y="294" font-size="11" fill="#6b6b6b" text-anchor="middle">argocd.argoproj.io/</text>
  <text x="735" y="308" font-size="11" fill="#6b6b6b" text-anchor="middle">instance=&#60;app&#62; label</text>
  <text x="735" y="326" font-size="11" fill="#6b6b6b" text-anchor="middle">canary strategy</text>

  <rect x="650" y="372" width="170" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="735" y="394" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">ReplicaSet stable</text>
  <text x="735" y="412" font-size="11" fill="#6b6b6b" text-anchor="middle">stableRS pod hash</text>

  <rect x="650" y="440" width="170" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="735" y="462" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">ReplicaSet canary</text>
  <text x="735" y="480" font-size="11" fill="#6b6b6b" text-anchor="middle">currentPodHash &#183; paused</text>

  <!-- rollouts controller writes status -->
  <line x1="735" y1="136" x2="735" y2="244" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="747" y="176" font-size="11.5" fill="#6b6b6b">writes status</text>

  <!-- rollout owns replicasets -->
  <line x1="735" y1="340" x2="735" y2="368" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="700" y1="424" x2="700" y2="436" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- gate reads rollouts -->
  <polyline points="374,504 620,504 620,320 646,320" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="524" font-size="11.5" fill="#6b6b6b">3. list Rollouts by tracking label, via kube-apiserver</text>

  <!-- legend -->
  <text x="60" y="608" font-size="11.5" fill="#6b6b6b">The gate never reads what the sync would deploy. It reads live Rollout status: while an update is in flight, the sync is refused.</text>
</svg>
