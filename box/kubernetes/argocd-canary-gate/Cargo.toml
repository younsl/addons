[package]
name = "argocd-canary-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Admission gate that blocks an Argo CD Application sync while an Argo Rollouts canary is still in progress"
readme = "README.md"
repository = "https://github.com/younsl/o"

[[bin]]
name = "argocd-canary-gate"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs"] }
async-trait = "0.1"

# HTTP servers: the HTTPS admission webhook and the plain HTTP admin listener
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }

# Kubernetes: Rollouts and Applications are read unstructured, Events are written typed
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
# Pin the process-wide rustls crypto provider so the webhook listener and kube
# share aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# UI extension archive
tar = { version = "0.4", default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus-client = "0.25"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
rcgen = "0.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
