<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrow-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4d4d8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="1180" height="640" fill="#0a0a0b"/>

  <!-- title -->
  <text x="40" y="40" fill="#e4e4e7" font-size="16" font-weight="600">trivy-collector MCP</text>
  <text x="40" y="58" fill="#71717a">kagent agents query Trivy reports through the embedded MCP endpoint on the server pod</text>

  <!-- ===== Hub cluster ===== -->
  <rect x="40" y="84" width="820" height="516" rx="10" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="58" y="108" fill="#a1a1aa" font-size="12" letter-spacing="1">HUB CLUSTER</text>

  <!-- namespace: kagent -->
  <rect x="64" y="126" width="300" height="450" rx="8" fill="#131316" stroke="#3f3f46"/>
  <text x="80" y="150" fill="#d4d4d8" font-size="12">namespace/kagent</text>

  <!-- Agent -->
  <rect x="88" y="172" width="252" height="78" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="104" y="194" fill="#71717a" font-size="11">Agent</text>
  <text x="104" y="214" fill="#e4e4e7">security-analyst</text>
  <text x="104" y="234" fill="#8a8a93" font-size="11">controller + LLM, tools: McpServer</text>

  <!-- RemoteMCPServer -->
  <rect x="88" y="296" width="252" height="104" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="104" y="318" fill="#71717a" font-size="11">RemoteMCPServer</text>
  <text x="104" y="338" fill="#e4e4e7">trivy-collector</text>
  <text x="104" y="356" fill="#8a8a93" font-size="11">protocol: STREAMABLE_HTTP</text>
  <text x="104" y="372" fill="#8a8a93" font-size="11">url: http://trivy-collector.</text>
  <text x="104" y="386" fill="#8a8a93" font-size="11">     trivy-system.svc:3000/mcp</text>

  <!-- Secret -->
  <rect x="88" y="446" width="252" height="72" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="104" y="468" fill="#71717a" font-size="11">Secret</text>
  <text x="104" y="488" fill="#e4e4e7">trivy-collector-mcp</text>
  <text x="104" y="506" fill="#8a8a93" font-size="11">Authorization: Bearer tc_…</text>

  <!-- Agent -> RemoteMCPServer -->
  <line x1="214" y1="250" x2="214" y2="294" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="224" y="276" fill="#71717a" font-size="11">references</text>

  <!-- RemoteMCPServer -> Secret -->
  <line x1="214" y1="400" x2="214" y2="444" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="224" y="426" fill="#71717a" font-size="11">headersFrom</text>

  <!-- namespace: trivy-system -->
  <rect x="480" y="126" width="360" height="450" rx="8" fill="#131316" stroke="#3f3f46"/>
  <text x="496" y="150" fill="#d4d4d8" font-size="12">namespace/trivy-system</text>

  <!-- server pod -->
  <rect x="504" y="172" width="312" height="176" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="520" y="194" fill="#71717a" font-size="11">Pod</text>
  <text x="520" y="214" fill="#e4e4e7">trivy-collector-server</text>
  <text x="800" y="194" fill="#71717a" font-size="11" text-anchor="end">--mode=server</text>

  <!-- middleware bar -->
  <rect x="520" y="228" width="280" height="24" rx="4" fill="#27272a" stroke="#3f3f46"/>
  <text x="660" y="244" fill="#d4d4d8" font-size="11" text-anchor="middle">auth (Bearer / cookie) → RBAC</text>

  <!-- lanes: MCP left (entry side), REST right -->
  <rect x="520" y="262" width="140" height="70" rx="4" fill="#26262b" stroke="#a1a1aa" stroke-width="1.4"/>
  <text x="590" y="284" fill="#d4d4d8" font-size="11" text-anchor="middle">MCP</text>
  <text x="590" y="302" fill="#fafafa" font-size="12" font-weight="600" text-anchor="middle">/mcp</text>
  <text x="590" y="320" fill="#a1a1aa" font-size="10" text-anchor="middle">Streamable HTTP</text>

  <rect x="672" y="262" width="128" height="70" rx="4" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="736" y="284" fill="#a1a1aa" font-size="11" text-anchor="middle">UI / REST</text>
  <text x="736" y="302" fill="#e4e4e7" font-size="12" text-anchor="middle">/api/v1</text>
  <text x="736" y="320" fill="#71717a" font-size="10" text-anchor="middle">Swagger, dashboard</text>

  <!-- scraper pod -->
  <rect x="504" y="380" width="312" height="66" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="520" y="402" fill="#71717a" font-size="11">Pod</text>
  <text x="520" y="422" fill="#e4e4e7">trivy-collector-scraper</text>
  <text x="800" y="402" fill="#71717a" font-size="11" text-anchor="end">--mode=scraper</text>
  <text x="520" y="438" fill="#8a8a93" font-size="11">Secret watcher + per-cluster watchers</text>

  <!-- PVC -->
  <rect x="504" y="480" width="312" height="66" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="520" y="502" fill="#71717a" font-size="11">PersistentVolumeClaim</text>
  <text x="520" y="522" fill="#e4e4e7">SQLite  /data/trivy.db</text>
  <text x="520" y="538" fill="#8a8a93" font-size="11">reports, notes, tokens, api logs</text>

  <!-- server -> PVC (read), routed down the left inner margin -->
  <path d="M 504 340 L 492 340 L 492 513 L 502 513" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="474" y="430" fill="#71717a" font-size="11" text-anchor="end">read</text>

  <!-- scraper -> PVC (write) -->
  <line x1="660" y1="446" x2="660" y2="478" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="670" y="466" fill="#71717a" font-size="11">write</text>

  <!-- Agent -> /mcp (main flow) -->
  <path d="M 340 211 L 420 211 L 420 297 L 518 297" fill="none" stroke="#d4d4d8" stroke-width="1.8" marker-end="url(#arrow-bright)"/>
  <text x="372" y="322" fill="#d4d4d8" font-size="11">POST /mcp</text>
  <text x="372" y="338" fill="#a1a1aa" font-size="10">Bearer tc_…</text>
  <text x="372" y="352" fill="#a1a1aa" font-size="10">Mcp-Session-Id</text>
  <text x="372" y="374" fill="#71717a" font-size="10">initialize</text>
  <text x="372" y="388" fill="#71717a" font-size="10">tools/list</text>
  <text x="372" y="402" fill="#71717a" font-size="10">tools/call</text>

  <!-- ===== Edge clusters ===== -->
  <rect x="892" y="84" width="248" height="516" rx="10" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="910" y="108" fill="#a1a1aa" font-size="12" letter-spacing="1">EDGE CLUSTERS</text>

  <rect x="916" y="140" width="200" height="120" rx="8" fill="#131316" stroke="#3f3f46"/>
  <text x="932" y="164" fill="#d4d4d8" font-size="12">cluster/prod</text>
  <rect x="932" y="180" width="168" height="30" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="1016" y="200" fill="#a1a1aa" font-size="11" text-anchor="middle">Trivy Operator</text>
  <rect x="932" y="218" width="168" height="30" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="1016" y="238" fill="#a1a1aa" font-size="11" text-anchor="middle">read-only ServiceAccount</text>

  <rect x="916" y="290" width="200" height="120" rx="8" fill="#131316" stroke="#3f3f46"/>
  <text x="932" y="314" fill="#d4d4d8" font-size="12">cluster/stage</text>
  <rect x="932" y="330" width="168" height="30" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="1016" y="350" fill="#a1a1aa" font-size="11" text-anchor="middle">Trivy Operator</text>
  <rect x="932" y="368" width="168" height="30" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="1016" y="388" fill="#a1a1aa" font-size="11" text-anchor="middle">read-only ServiceAccount</text>

  <text x="932" y="452" fill="#71717a" font-size="10">scraper watches</text>
  <text x="932" y="466" fill="#71717a" font-size="10">VulnerabilityReports</text>
  <text x="932" y="480" fill="#71717a" font-size="10">SbomReports</text>
  <text x="932" y="500" fill="#52525b" font-size="10">no collector pod on edge</text>

  <!-- scraper -> edges (watch) -->
  <path d="M 816 413 L 872 413 L 872 200 L 914 200" fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow-dim)"/>
  <path d="M 872 350 L 914 350" fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow-dim)"/>

  <!-- legend -->
  <line x1="40" y1="620" x2="70" y2="620" stroke="#d4d4d8" stroke-width="1.8"/>
  <text x="78" y="624" fill="#a1a1aa" font-size="11">MCP call path</text>
  <line x1="190" y1="620" x2="220" y2="620" stroke="#71717a" stroke-width="1.2"/>
  <text x="228" y="624" fill="#a1a1aa" font-size="11">in-cluster reference / data</text>
  <line x1="430" y1="620" x2="460" y2="620" stroke="#52525b" stroke-width="1.2"/>
  <text x="468" y="624" fill="#a1a1aa" font-size="11">cross-cluster watch (hub-pull)</text>
</svg>
