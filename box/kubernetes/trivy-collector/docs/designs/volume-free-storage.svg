<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrow-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4d4d8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/>
    </marker>
  </defs>

  <rect width="1240" height="800" fill="#0a0a0b"/>

  <text x="40" y="40" fill="#e4e4e7" font-size="16" font-weight="600">trivy-collector volume-free storage</text>
  <text x="40" y="58" fill="#71717a">No PersistentVolumeClaim. The scraper owns SQLite on its own emptyDir; authored state lives in API objects.</text>

  <!-- ===== Hub cluster ===== -->
  <rect x="40" y="84" width="800" height="676" rx="10" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="58" y="108" fill="#a1a1aa" font-size="12" letter-spacing="1">HUB CLUSTER</text>

  <!-- namespace -->
  <rect x="64" y="126" width="752" height="612" rx="8" fill="#131316" stroke="#3f3f46"/>
  <text x="80" y="150" fill="#d4d4d8" font-size="12">namespace/trivy-system</text>

  <!-- HTTPRoute -->
  <rect x="88" y="172" width="228" height="58" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="104" y="194" fill="#71717a" font-size="11">HTTPRoute</text>
  <text x="104" y="216" fill="#e4e4e7">trivy-collector</text>

  <!-- Service: server -->
  <rect x="88" y="266" width="228" height="76" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="104" y="288" fill="#71717a" font-size="11">Service</text>
  <text x="104" y="310" fill="#e4e4e7">…-server</text>
  <text x="104" y="330" fill="#8a8a93" font-size="11">:3000 http  :8080 metrics</text>

  <!-- Deployment: server -->
  <rect x="88" y="378" width="228" height="150" rx="6" fill="#18181b" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="104" y="400" fill="#71717a" font-size="11">Deployment</text>
  <text x="104" y="422" fill="#e4e4e7">…-server</text>
  <text x="104" y="442" fill="#8a8a93" font-size="11">replicas: N  + PDB</text>
  <text x="104" y="462" fill="#7dd3fc" font-size="11">no volume, no database</text>
  <text x="104" y="482" fill="#8a8a93" font-size="11">UI, /api/v1, /mcp</text>
  <text x="104" y="500" fill="#8a8a93" font-size="11">OIDC + RBAC applied here</text>
  <text x="104" y="518" fill="#8a8a93" font-size="11">access log → stdout</text>

  <!-- NetworkPolicy -->
  <rect x="352" y="378" width="152" height="150" rx="6" fill="#141418" stroke="#52525b" stroke-dasharray="4 4"/>
  <text x="366" y="400" fill="#71717a" font-size="11">NetworkPolicy</text>
  <text x="366" y="422" fill="#d4d4d8" font-size="12">…-scraper-</text>
  <text x="366" y="438" fill="#d4d4d8" font-size="12">internal</text>
  <text x="366" y="462" fill="#8a8a93" font-size="11">ingress :8081</text>
  <text x="366" y="480" fill="#8a8a93" font-size="11">from server</text>
  <text x="366" y="498" fill="#8a8a93" font-size="11">pods only</text>

  <!-- Service: scraper -->
  <rect x="540" y="266" width="252" height="76" rx="6" fill="#18181b" stroke="#52525b"/>
  <text x="556" y="288" fill="#71717a" font-size="11">Service</text>
  <text x="556" y="310" fill="#e4e4e7">…-scraper</text>
  <text x="556" y="330" fill="#8a8a93" font-size="11">:8081 internal  :8080 metrics</text>

  <!-- Deployment: scraper -->
  <rect x="540" y="378" width="252" height="222" rx="6" fill="#18181b" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="556" y="400" fill="#71717a" font-size="11">Deployment</text>
  <text x="556" y="422" fill="#e4e4e7">…-scraper</text>
  <text x="556" y="442" fill="#8a8a93" font-size="11">replicas: 1  RollingUpdate</text>
  <text x="556" y="466" fill="#fca5a5" font-size="11">sole reader and writer</text>
  <text x="556" y="486" fill="#8a8a93" font-size="11">watchers (hub + per edge)</text>
  <text x="556" y="504" fill="#8a8a93" font-size="11">alert evaluator (ingest path)</text>
  <text x="556" y="522" fill="#8a8a93" font-size="11">/internal/v1 read API</text>
  <text x="556" y="540" fill="#8a8a93" font-size="11">/readyz follows hydration</text>

  <!-- emptyDir -->
  <rect x="556" y="556" width="220" height="30" rx="4" fill="#1f1f24" stroke="#fca5a5" stroke-dasharray="4 3"/>
  <text x="570" y="576" fill="#fca5a5" font-size="11">emptyDir /data — SQLite, 2Gi</text>

  <!-- ===== Authored state ===== -->
  <rect x="88" y="566" width="416" height="152" rx="8" fill="#101013" stroke="#3f3f46"/>
  <text x="104" y="590" fill="#a1a1aa" font-size="12" letter-spacing="1">AUTHORED STATE — SURVIVES EVERY RESTART</text>

  <rect x="104" y="606" width="188" height="46" rx="4" fill="#18181b" stroke="#86efac"/>
  <text x="116" y="624" fill="#71717a" font-size="10">ConfigMap</text>
  <text x="116" y="642" fill="#86efac" font-size="11">…-notes</text>

  <rect x="304" y="606" width="188" height="46" rx="4" fill="#18181b" stroke="#86efac"/>
  <text x="316" y="624" fill="#71717a" font-size="10">Secret</text>
  <text x="316" y="642" fill="#86efac" font-size="11">…-api-tokens</text>

  <rect x="104" y="662" width="188" height="46" rx="4" fill="#18181b" stroke="#86efac"/>
  <text x="116" y="680" fill="#71717a" font-size="10">ConfigMap</text>
  <text x="116" y="698" fill="#86efac" font-size="11">…-alerts</text>

  <rect x="304" y="662" width="188" height="46" rx="4" fill="#18181b" stroke="#fcd34d"/>
  <text x="316" y="680" fill="#71717a" font-size="10">Secret</text>
  <text x="316" y="698" fill="#fcd34d" font-size="11">…-internal (shared token)</text>

  <!-- ===== Edge clusters ===== -->
  <rect x="880" y="84" width="320" height="676" rx="10" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="898" y="108" fill="#a1a1aa" font-size="12" letter-spacing="1">EDGE CLUSTERS</text>
  <text x="898" y="128" fill="#71717a" font-size="11">source of truth for every report</text>

  <rect x="904" y="150" width="272" height="150" rx="8" fill="#131316" stroke="#3f3f46"/>
  <text x="920" y="174" fill="#d4d4d8" font-size="12">cluster/edge-a</text>
  <text x="920" y="200" fill="#8a8a93" font-size="11">kube-apiserver</text>
  <rect x="920" y="214" width="240" height="66" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="932" y="234" fill="#71717a" font-size="10">CRs (aquasecurity.github.io)</text>
  <text x="932" y="254" fill="#e4e4e7" font-size="11">VulnerabilityReport</text>
  <text x="932" y="272" fill="#e4e4e7" font-size="11">SbomReport</text>

  <rect x="904" y="322" width="272" height="150" rx="8" fill="#131316" stroke="#3f3f46"/>
  <text x="920" y="346" fill="#d4d4d8" font-size="12">cluster/edge-b</text>
  <text x="920" y="372" fill="#8a8a93" font-size="11">kube-apiserver</text>
  <rect x="920" y="386" width="240" height="66" rx="4" fill="#18181b" stroke="#52525b"/>
  <text x="932" y="406" fill="#71717a" font-size="10">CRs (aquasecurity.github.io)</text>
  <text x="932" y="426" fill="#e4e4e7" font-size="11">VulnerabilityReport</text>
  <text x="932" y="444" fill="#e4e4e7" font-size="11">SbomReport</text>

  <!-- rebuild note -->
  <rect x="904" y="500" width="272" height="118" rx="8" fill="#101013" stroke="#fca5a5" stroke-dasharray="4 4"/>
  <text x="920" y="524" fill="#fca5a5" font-size="11">ON EVERY SCRAPER RESTART</text>
  <text x="920" y="548" fill="#8a8a93" font-size="11">emptyDir starts empty; each</text>
  <text x="920" y="566" fill="#8a8a93" font-size="11">watcher replays a full list, so</text>
  <text x="920" y="584" fill="#8a8a93" font-size="11">reports are rebuilt from here.</text>
  <text x="920" y="604" fill="#8a8a93" font-size="11">No report is ever lost.</text>

  <!-- ===== Edges ===== -->

  <!-- HTTPRoute -> Service server -->
  <path d="M 202 230 L 202 262" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Service server -> Deployment server -->
  <path d="M 202 342 L 202 374" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- server -> scraper Service, through the NetworkPolicy -->
  <path d="M 316 424 L 348 424" stroke="#d4d4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-bright)"/>
  <path d="M 504 424 L 536 424" stroke="#d4d4d8" stroke-width="1.5" fill="none" marker-end="url(#arrow-bright)"/>
  <text x="352" y="356" fill="#d4d4d8" font-size="11">every report read</text>
  <text x="352" y="372" fill="#8a8a93" font-size="10">x-internal-token</text>

  <!-- scraper Service -> scraper Deployment -->
  <path d="M 666 342 L 666 374" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- scraper -> edge apiservers -->
  <path d="M 792 460 C 850 460, 850 250, 900 250" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 792 480 C 850 480, 850 420, 900 420" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="800" y="404" fill="#8a8a93" font-size="10">watch</text>

  <!-- server -> authored state -->
  <path d="M 168 528 L 168 562" stroke="#86efac" stroke-width="1.5" fill="none" marker-end="url(#arrow-dim)"/>
  <text x="180" y="552" fill="#86efac" font-size="10">watch into memory</text>

  <!-- internal token mounted by both pods -->
  <path d="M 492 678 C 524 678, 524 552, 490 544 L 324 544" stroke="#fcd34d" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow-dim)"/>
  <path d="M 492 694 C 620 694, 664 660, 664 604" stroke="#fcd34d" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow-dim)"/>
  <text x="512" y="726" fill="#fcd34d" font-size="10">mounted by both pods as INTERNAL_TOKEN</text>

  <!-- ===== Legend ===== -->
  <rect x="540" y="150" width="252" height="96" rx="8" fill="#101013" stroke="#3f3f46"/>
  <text x="556" y="172" fill="#a1a1aa" font-size="11" letter-spacing="1">WHAT CHANGED</text>
  <text x="556" y="194" fill="#8a8a93" font-size="11">— PVC removed entirely</text>
  <text x="556" y="212" fill="#8a8a93" font-size="11">— server is stateless, scales</text>
  <text x="556" y="230" fill="#8a8a93" font-size="11">— neither pod is node-pinned</text>
</svg>
