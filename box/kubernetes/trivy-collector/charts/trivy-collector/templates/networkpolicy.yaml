{{- if .Values.internal.networkPolicy.enabled }}
{{- /*
    Second fence around the internal API, alongside the shared token: only the
    server pods may reach the scraper's internal port. The port is also absent
    from the HTTPRoute and both ServiceMonitors.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trivy-collector.scraperName" . }}-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trivy-collector.scraperSelectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trivy-collector.scraperSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The internal read API: server pods only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "trivy-collector.serverSelectorLabels" . | nindent 14 }}
        {{- with .Values.internal.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.internal.port }}
    # Metrics and probes stay open to the monitoring stack and the kubelet.
    - ports:
        - protocol: TCP
          port: {{ .Values.health.port }}
{{- end }}
