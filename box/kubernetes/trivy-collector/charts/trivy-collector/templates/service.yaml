---
# Service targeting the server pod only (UI / API).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trivy-collector.serverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trivy-collector.serverSelectorLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.health.port }}
      targetPort: health
      protocol: TCP
      name: metrics
  selector:
    {{- include "trivy-collector.serverSelectorLabels" . | nindent 4 }}
---
# Service for the scraper pod. Carries metrics for Prometheus and the internal
# read API the server pods proxy through.
#
# The internal port is deliberately absent from the HTTPRoute and
# both ServiceMonitors: it answers with every report in the fleet and no
# per-user filtering, because RBAC is applied above it in the server. It is
# fenced by the shared token and, when enabled, by a NetworkPolicy admitting
# only the server pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trivy-collector.scraperName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trivy-collector.scraperSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.health.port }}
      targetPort: health
      protocol: TCP
      name: metrics
    - port: {{ .Values.internal.port }}
      targetPort: internal
      protocol: TCP
      name: internal
  selector:
    {{- include "trivy-collector.scraperSelectorLabels" . | nindent 4 }}
