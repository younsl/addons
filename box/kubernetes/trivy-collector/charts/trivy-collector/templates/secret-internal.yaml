{{- if not .Values.internal.existingSecret }}
{{- /*
    Shared token guarding the scraper's internal read API.

    That API returns every report in the fleet with no per-user filtering,
    because RBAC is applied above it in the server. Reachable unauthenticated it
    would be a straight downgrade from the filesystem permission that used to
    protect the database, so both pods mount this Secret and the scraper
    compares it in constant time on every request.

    The value must stay stable across upgrades or every server pod would start
    failing against a rotated scraper. Resolution order:
      1. internal.token, when set explicitly
      2. the value already stored in this Secret (via lookup)
      3. a freshly generated token, on first install only

    A GitOps controller that renders without cluster access cannot perform (2),
    so set internal.token or internal.existingSecret in that setup.
*/}}
{{- $name := printf "%s-internal" (include "trivy-collector.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if .Values.internal.token }}
{{- $token = .Values.internal.token | b64enc }}
{{- else if and $existing $existing.data (index $existing.data .Values.internal.secretKey) }}
{{- $token = index $existing.data .Values.internal.secretKey }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trivy-collector.labels" . | nindent 4 }}
  annotations:
    # Never garbage-collect the token: losing it locks the server out of the
    # scraper until both Deployments restart.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.internal.secretKey }}: {{ $token | quote }}
{{- end }}
