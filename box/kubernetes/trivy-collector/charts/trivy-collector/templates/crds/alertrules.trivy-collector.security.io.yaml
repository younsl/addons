{{- if .Values.crds.install }}
{{- /*
  Generated by `make crd` from AlertRuleSpec in src/alerts/crd.rs. Do not edit:
  change the Rust type and regenerate.

  This sits in templates/ rather than crds/ because Helm never upgrades anything
  in crds/. A schema change there would silently not apply, and this chart is
  installed through Argo CD, where that failure is invisible.
*/}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: alertrules.trivy-collector.security.io
  labels:
    {{- include "trivy-collector.labels" . | nindent 4 }}
    {{- with .Values.crds.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.crds.keep .Values.crds.annotations }}
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  group: trivy-collector.security.io
  names:
    categories:
    - trivy-collector
    kind: AlertRule
    plural: alertrules
    shortNames:
    - tcalert
    singular: alertrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.matchers.packageName
      name: Package
      type: string
    - jsonPath: .spec.matchers.versionExpr
      name: Version
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.firedCount
      name: Fired
      type: integer
    - jsonPath: .status.lastFiredAt
      name: Last-Fired
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: An alert rule matching SBOM components across collected clusters, and the receivers
          a match is delivered to.
        properties:
          spec:
            description: 'An alert rule: which SBOM component to watch for, and where to send the notification
              when one lands in a workload''s SBOM.'
            properties:
              annotations:
                additionalProperties:
                  type: string
                default: {}
                description: Alertmanager-style annotations attached to the outbound notification.
                type: object
              cooldownSeconds:
                description: Minimum gap between two notifications for the same rule and target. Absent
                  falls back to the evaluator's default.
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              description:
                default: ''
                description: Free-text note for whoever reads the rule next.
                type: string
              enabled:
                default: true
                description: A disabled rule is stored and listed but never evaluated.
                type: boolean
              labels:
                additionalProperties:
                  type: string
                default: {}
                description: Alertmanager-style labels attached to the outbound notification. These are
                  the rule author's labels, not the object's `metadata.labels`.
                type: object
              matchers:
                description: What has to be true of an SBOM component for the rule to fire.
                properties:
                  clusters:
                    description: Clusters to restrict the rule to. Empty matches any cluster.
                    items:
                      type: string
                    type: array
                  namespace:
                    description: Workload namespace to restrict the rule to. Absent matches any.
                    nullable: true
                    type: string
                  packageName:
                    description: Component name to match, case-insensitively. Absent matches every component,
                      which is rarely what an author means.
                    nullable: true
                    type: string
                  versionExpr:
                    description: Version constraint, e.g. `<2.17.0` or `>=1.0.0,<2.0.0`.
                    nullable: true
                    type: string
                type: object
              receivers:
                description: Where a firing rule delivers to. At least one is required.
                items:
                  properties:
                    name:
                      type: string
                    slack:
                      nullable: true
                      properties:
                        channel:
                          nullable: true
                          type: string
                        title:
                          nullable: true
                          type: string
                        webhookUrl:
                          description: Incoming-webhook URL. Must be on `https://hooks.slack.com/`; see
                            `types::validate_webhook_url` for why the host is pinned.
                          type: string
                      required:
                      - webhookUrl
                      type: object
                  required:
                  - name
                  type: object
                type: array
            required:
            - matchers
            - receivers
            type: object
          status:
            description: 'What the collector has observed about a rule. The scraper writes the evaluation
              fields, and only when something changed: a firing, or a `Ready` transition. Writing on every
              ingested report would mean an API call per rule per report. The server writes the audit
              fields, once per create or edit. Authorship lives here rather than in annotations. An annotation
              is part of the spec object, so the server recording "bob edited this" reads as drift to
              whatever GitOps controller owns the manifest and gets reverted on the next sync. A status
              subresource is exempt from that by design. A rule applied straight from Git has no recorded
              author, which is the truth: nobody authored it through the API.'
            nullable: true
            properties:
              conditions:
                description: Standard Kubernetes conditions. See `CONDITION_READY` and `CONDITION_DELIVERED`.
                items:
                  description: A condition, shaped like `metav1.Condition`. `k8s-openapi`'s own `Condition`
                    is not reused because deriving the CRD schema needs `JsonSchema`, which that crate
                    only implements behind a feature this build does not enable.
                  properties:
                    lastTransitionTime:
                      description: When `status` last changed, not when it was last confirmed.
                      type: string
                    message:
                      description: Human-readable detail. Empty when the reason says everything.
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: CamelCase machine-readable cause.
                      type: string
                    status:
                      description: '`True`, `False`, or `Unknown`.'
                      type: string
                    type:
                      description: '`Ready` or `Delivered`.'
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdBy:
                description: Who created the rule through the API. Absent for one applied from a Git repository,
                  which reads back as `unknown`.
                nullable: true
                type: string
              firedCount:
                description: Notifications dispatched over the rule's lifetime. Cooldown suppression is
                  not counted, because nothing was sent.
                format: uint64
                minimum: 0.0
                type: integer
              lastFindingCount:
                description: How many distinct components the last notification carried.
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              lastFiredAt:
                description: When the rule last dispatched a notification.
                nullable: true
                type: string
              lastFiredWorkload:
                description: '`cluster/namespace/name` of the workload the last notification was about.'
                nullable: true
                type: string
              matchingWorkloads:
                description: Distinct workloads matching this rule at the last firing, the fired one included.
                  This is the fleet-wide blast radius, not a per-report count.
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              observedGeneration:
                description: '`metadata.generation` the evaluator last acted on. A value behind the current
                  generation means the edit has not been evaluated yet, which is normal until the next
                  SBOM report arrives.'
                format: int64
                nullable: true
                type: integer
              updatedAt:
                description: When the rule was last edited through the API.
                nullable: true
                type: string
              updatedBy:
                description: Who last edited it through the API.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: AlertRule
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
