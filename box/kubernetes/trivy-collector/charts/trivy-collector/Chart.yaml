annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Replace the horizontal header with a foldable sidebar; menus regrouped and search/admin pages promoted to top-level entries"
    - kind: changed
      description: "Replace Swagger UI with an embedded Scalar reference at /api-docs; the bundle ships in the image, and a CSP plus config opt-out keep it from reaching Scalar's hosted platform"
    - kind: removed
      description: "Remove /swagger-ui; the OpenAPI document stays at /api-docs/openapi.json"
    - kind: fixed
      description: "A scraper configured to watch nothing no longer reports a permanent rebuild; hydration now separates 'nothing to watch' from 'still syncing'"
