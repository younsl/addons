[package]
name = "kagent-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Posts Alertmanager alerts to Slack and replies in-thread with an analysis from a kagent agent over A2A"
readme = "README.md"
repository = "https://github.com/younsl/addons"

[[bin]]
name = "kagent-gateway"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# HTTP server (webhook, health, metrics)
axum = { version = "0.8", features = ["tokio", "http1"], default-features = false }

# HTTP client (Slack Web API, kagent A2A)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Slack Socket Mode (outbound WebSocket)
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config / CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus-client = "0.23"

# Misc
async-trait = "0.1"
rand = "0.9"
regex = "1.11"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
