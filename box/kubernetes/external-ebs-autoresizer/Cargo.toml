[package]
name = "external-ebs-autoresizer"
version = "0.6.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Auto-expands the root filesystem (ext2/3/4 or XFS) of standalone EC2 instances via EBS ModifyVolume and SSM"
readme = "README.md"
repository = "https://github.com/younsl/o"

[[bin]]
name = "external-ebs-autoresizer"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-util = "0.7.19"
async-trait = "0.1.92"

# HTTP servers (health, metrics)
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

# HTTP client (Alertmanager, Grafana, Prometheus query API)
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }

# AWS SDK
aws-config = { version = "1.11.0", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1.251.0"
aws-sdk-ssm = "1.121.0"
aws-smithy-types = "1.6.2"

# Kubernetes (Lease, Events, Nodes, claims and volumes)
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
# Pin the process-wide rustls crypto provider. Both `ring` (reqwest) and
# `aws-lc-rs` (AWS SDK, kube) get linked, so rustls cannot auto-pick a default.
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

# Time
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# CLI
clap = { version = "4.6.6", features = ["derive"] }

# Policy selectors (RE2-compatible syntax, as in the Go version)
regex = "1.13.1"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.20"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Metrics
prometheus = { version = "0.14.0", default-features = false }

[dev-dependencies]
wiremock = "0.6.5"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
# Paused-clock tests for the controller loop
tokio = { version = "1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
