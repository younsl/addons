<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="t d">
  <title id="t">Recurrence prevention architecture</title>
  <desc id="d">Recurrence prevention architecture: a config change must pass semantic validation before it reaches the capacity controller, and the controller removes resolver hosts only within an hourly removal cap. Separately, capacity settings are checked in every Region</desc>
  <style>
    :root { --bg: #000; --bg-1: transparent; --bg-2: #000; --line: #1f1f1f; --line-2: #333; --fg: #ededed; --fg-2: #a1a1a1; --fg-3: #666; --ok: #45dec5; --err: #ff6166; --warn: #f5a524; --sans: "Geist", "Pretendard Variable", Pretendard, ui-sans-serif, system-ui, -apple-system, sans-serif; --mono: "Geist Mono", "Pretendard Variable", Pretendard, ui-monospace, SFMono-Regular, Menlo, monospace; color-scheme: dark; }
    svg text { font-family: var(--mono); }
    svg text.ko { font-family: var(--sans); }
    .t-lg { font: 600 14px var(--sans); fill: var(--fg); }
    .t-sm { font-size: 10.5px; fill: var(--fg-3); }
    .zone { fill: none; stroke: var(--line-2); stroke-dasharray: 3 4; }
    .box { fill: var(--bg-2); stroke: var(--line-2); }
    .box-ok { fill: rgba(69,222,197,.06); stroke: rgba(69,222,197,.45); }
    .box-err { fill: rgba(255,97,102,.06); stroke: rgba(255,97,102,.5); }
  </style>
  <rect width="960" height="390" fill="#000"/>
  <defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#45dec5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6166"/></marker></defs>
  <rect class="box" x="30" y="120" width="150" height="70" rx="10"/><text class="t-lg ko" x="48" y="150">Config change</text><text class="t-sm ko" x="48" y="170">Resolver fleet config</text>
  <path d="M180 155H228" stroke="var(--ok)" stroke-width="1.5" fill="none" marker-end="url(#af)"/>
  <rect x="230" y="120" width="180" height="70" rx="10" fill="rgba(245,165,36,.06)" stroke="rgba(245,165,36,.5)"/><text x="248" y="142" style="fill:var(--warn);font-size:10.5px">02</text><text class="t-lg ko" x="248" y="162">Semantic validation</text><text class="t-sm ko" x="248" y="179">Capacity left after apply</text>
  <path d="M320 190V238" stroke="var(--err)" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <rect class="box-err" x="245" y="240" width="150" height="36" rx="18"/><text x="320" y="263" text-anchor="middle" class="ko" style="fill:var(--err);font-size:11.5px">Reject missing or low</text>
  <path d="M410 155H458" stroke="var(--ok)" stroke-width="1.5" fill="none" marker-end="url(#af)"/>
  <rect class="box" x="460" y="120" width="180" height="70" rx="10"/><text class="t-lg ko" x="478" y="150">Capacity controller</text><text class="t-sm ko" x="478" y="170">Adds and removes hosts</text>
  <path d="M550 190V240" stroke="var(--warn)" stroke-dasharray="3 3" fill="none"/>
  <rect x="465" y="240" width="170" height="36" rx="18" fill="rgba(245,165,36,.06)" stroke="rgba(245,165,36,.5)"/><text x="550" y="263" text-anchor="middle" class="ko" style="fill:var(--warn);font-size:11.5px">03 Hourly removal cap</text>
  <path d="M640 155H678" stroke="var(--ok)" stroke-width="1.5" fill="none" marker-end="url(#af)"/>
  <rect class="zone" x="680" y="40" width="250" height="236" rx="12"/><text class="ko t-sm" x="698" y="62">EC2 DNS resolver fleet</text>
  <g>
    <rect class="box-ok" x="700" y="80" width="60" height="30" rx="6"/><rect class="box-ok" x="778" y="80" width="60" height="30" rx="6"/><rect class="box-ok" x="856" y="80" width="60" height="30" rx="6"/>
    <rect class="box-ok" x="700" y="122" width="60" height="30" rx="6"/><rect class="box-ok" x="778" y="122" width="60" height="30" rx="6"/><rect class="box-ok" x="856" y="122" width="60" height="30" rx="6"/>
    <rect class="box-ok" x="700" y="164" width="60" height="30" rx="6"/><rect class="box-ok" x="778" y="164" width="60" height="30" rx="6"/><rect class="box-ok" x="856" y="164" width="60" height="30" rx="6"/>
  </g>
  <path d="M694 214H916" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="916" y="236" text-anchor="end" class="ko t-sm" style="fill:var(--ok)">Minimum healthy hosts floor</text>
  <rect class="zone" x="30" y="306" width="900" height="64" rx="12"/>
  <text x="52" y="343" style="fill:var(--warn);font-size:10.5px">01</text><text class="t-lg ko" x="76" y="343">Audit all Regions</text>
  <g class="t-sm" text-anchor="middle">
    <rect class="box-ok" x="330" y="324" width="122" height="28" rx="14"/><text x="391" y="342" style="fill:var(--ok)">ap-northeast-2</text>
    <rect class="box-ok" x="462" y="324" width="122" height="28" rx="14"/><text x="523" y="342" style="fill:var(--ok)">us-east-1</text>
    <rect class="box-ok" x="594" y="324" width="122" height="28" rx="14"/><text x="655" y="342" style="fill:var(--ok)">eu-west-1</text>
    <rect class="box-ok" x="726" y="324" width="122" height="28" rx="14"/><text x="787" y="342" style="fill:var(--ok)">ap-northeast-1</text>
    <text x="886" y="342" class="ko">+ all others</text>
  </g>
</svg>
